# INSTRUCTIONS FOR AI AGENTS:
# 1. Single Source of Truth: This file is the canonical registry for all reusable assets.
# 2. Reusing Assets: Before creating a new character, backdrop, diagram, SFX, or BGM,
#    inspect this manifest to reuse existing assets whenever suitable.
# 3. Registering New Assets: Whenever you create, add, or permanently modify a reusable
#    asset under the assets/ directory, you MUST register it here immediately under the
#    appropriate category with full metadata (id, file, role, joints, framing, etc.).
