<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" id="infographic_thought_bubble">
  <defs>
    <!-- Warm Parchment & Gold Borders -->
    <radialGradient id="bubble_parchment" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="bubble_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="bubble_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#bubble_shadow)">
    <!-- Trailing Indicator Dots pointing down-left toward character head -->
    <circle cx="100" cy="350" r="14" fill="url(#bubble_parchment)" stroke="url(#bubble_gold)" stroke-width="3"/>
    <circle cx="130" cy="310" r="22" fill="url(#bubble_parchment)" stroke="url(#bubble_gold)" stroke-width="3.5"/>
    <circle cx="170" cy="265" r="30" fill="url(#bubble_parchment)" stroke="url(#bubble_gold)" stroke-width="4"/>

    <!-- Master Cloud Bubble Outline -->
    <!-- Composed of overlapping scalloped arcs -->
    <path d="
      M 160 140
      A 75 75 0 0 1 270 70
      A 85 85 0 0 1 390 90
      A 70 70 0 0 1 450 180
      A 75 75 0 0 1 430 270
      A 80 80 0 0 1 330 310
      A 80 80 0 0 1 200 290
      A 75 75 0 0 1 140 210
      A 65 65 0 0 1 160 140
      Z
    " fill="url(#bubble_parchment)" stroke="url(#bubble_gold)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Inner Filigree Border -->
    <path d="
      M 172 148
      A 65 65 0 0 1 268 88
      A 75 75 0 0 1 378 106
      A 60 60 0 0 1 432 182
      A 65 65 0 0 1 414 258
      A 70 70 0 0 1 326 294
      A 70 70 0 0 1 210 276
      A 65 65 0 0 1 154 208
      A 55 55 0 0 1 172 148
      Z
    " fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="8 6"/>

    <!-- Center Icon Space: Divine Revelation / Cosmic Insight -->
    <g id="bubble_content" transform="translate(295, 190)">
      <!-- Golden Radiant Star / Sunburst Core -->
      <circle cx="0" cy="0" r="42" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
      <!-- Radiating Sparks -->
      <path d="M 0 -34 L 0 34 M -34 0 L 34 0 M -24 -24 L 24 24 M -24 24 L 24 -24" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="14" fill="#991b1b" stroke="#fef08a" stroke-width="2"/>
    </g>
  </g>
</svg>
