<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" id="outro_marquee">
  <defs>
    <!-- Theatrical Gold Gradients -->
    <linearGradient id="mq_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mq_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d05"/>
      <stop offset="50%" stop-color="#2d1708"/>
      <stop offset="100%" stop-color="#120803"/>
    </linearGradient>
    <filter id="mq_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#mq_shadow)">
    <!-- Ornate Marquee Cartouche -->
    <path d="M 60 40 L 740 40 Q 770 40 770 70 L 770 170 Q 770 200 740 200 L 60 200 Q 30 200 30 170 L 30 70 Q 30 40 60 40 Z" fill="url(#mq_bg)" stroke="url(#mq_gold)" stroke-width="4"/>

    <!-- Inset Filigree Border -->
    <rect x="42" y="52" width="716" height="136" rx="14" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="10 6"/>

    <!-- Corner Gold Rosettes -->
    <circle cx="55" cy="65" r="8" fill="url(#mq_gold)"/>
    <circle cx="745" cy="65" r="8" fill="url(#mq_gold)"/>
    <circle cx="55" cy="175" r="8" fill="url(#mq_gold)"/>
    <circle cx="745" cy="175" r="8" fill="url(#mq_gold)"/>

    <!-- Sacred Devanagari Title: कथा अनन्ता (Katha Ananta) -->
    <text x="400" y="112" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="url(#mq_gold)" text-anchor="middle" letter-spacing="4">कथा अनन्ता</text>

    <!-- Subtitle: SUTRADHAR · MYTHOLOGICAL EPICS -->
    <text x="400" y="156" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="6">SUTRADHAR · KATHPUTLI CHRONICLES</text>
  </g>
</svg>
