<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" id="infographic_symbol_infinity">
  <defs>
    <!-- Radiant Gold & Amber Gradients -->
    <linearGradient id="inf_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="inf_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="inf_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#inf_shadow)">
    <!-- Central Cosmic Glow -->
    <ellipse cx="250" cy="175" rx="220" ry="130" fill="url(#inf_glow)"/>

    <!-- Radiant Background Rays -->
    <g stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="250" y1="40" x2="250" y2="70"/>
      <line x1="250" y1="310" x2="250" y2="280"/>
      <line x1="50" y1="175" x2="80" y2="175"/>
      <line x1="450" y1="175" x2="420" y2="175"/>
      <line x1="110" y1="75" x2="135" y2="95"/>
      <line x1="390" y1="275" x2="365" y2="255"/>
      <line x1="390" y1="75" x2="365" y2="95"/>
      <line x1="110" y1="275" x2="135" y2="255"/>
    </g>

    <!-- Master Golden Infinity Figure (∞ Lemniscate) -->
    <!-- Outer Thick Stroke with Core High-Gloss Highlight -->
    <path d="
      M 250 175
      C 290 115 385 115 385 175
      C 385 235 290 235 250 175
      C 210 115 115 115 115 175
      C 115 235 210 235 250 175
      Z
    " fill="none" stroke="url(#inf_gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Core Incandescent Center Line -->
    <path d="
      M 250 175
      C 290 115 385 115 385 175
      C 385 235 290 235 250 175
      C 210 115 115 115 115 175
      C 115 235 210 235 250 175
      Z
    " fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Central Nexus Jewel -->
    <circle cx="250" cy="175" r="10" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
    <circle cx="250" cy="175" r="4" fill="#ffffff"/>
  </g>
</svg>
