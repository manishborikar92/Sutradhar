<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" id="infographic_symbol_scales">
  <defs>
    <!-- Karmic Gold Gradients -->
    <linearGradient id="scale_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="scale_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#scale_shadow)">
    <!-- Central Pedestal / Base -->
    <polygon points="170,360 230,360 215,310 185,310" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="200" cy="360" rx="65" ry="16" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2.5"/>

    <!-- Central Vertical Pillar -->
    <rect x="194" y="90" width="12" height="230" rx="3" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2"/>

    <!-- Top Finial & Pivot Jewel -->
    <polygon points="200,45 212,85 188,85" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2"/>
    <circle cx="200" cy="95" r="14" fill="#dc2626" stroke="url(#scale_gold)" stroke-width="3"/>
    <circle cx="200" cy="95" r="5" fill="#fef08a"/>

    <!-- Horizontal Balance Beam -->
    <rect x="55" y="90" width="290" height="10" rx="4" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2"/>

    <!-- LEFT SCALE PAN (Punya / Merit) -->
    <g id="scale_pan_left">
      <!-- Cords -->
      <line x1="75" y1="98" x2="45" y2="230" stroke="url(#scale_gold)" stroke-width="1.8"/>
      <line x1="75" y1="98" x2="105" y2="230" stroke="url(#scale_gold)" stroke-width="1.8"/>
      <!-- Pan Bowl -->
      <path d="M 35 230 Q 75 270 115 230 Z" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2.5"/>
      <!-- Glowing Ruby Jewel in Pan -->
      <circle cx="75" cy="225" r="10" fill="#16a34a" stroke="#fef08a" stroke-width="1.5"/>
    </g>

    <!-- RIGHT SCALE PAN (Paap / Karma Reckoning) -->
    <g id="scale_pan_right">
      <!-- Cords -->
      <line x1="325" y1="98" x2="295" y2="230" stroke="url(#scale_gold)" stroke-width="1.8"/>
      <line x1="325" y1="98" x2="355" y2="230" stroke="url(#scale_gold)" stroke-width="1.8"/>
      <!-- Pan Bowl -->
      <path d="M 285 230 Q 325 270 365 230 Z" fill="url(#scale_gold)" stroke="#451a03" stroke-width="2.5"/>
      <!-- Glowing Jewel in Pan -->
      <circle cx="325" cy="225" r="10" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
    </g>
  </g>
</svg>
