<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Ember Crimson & Gold Backlight Gradients -->
    <radialGradient id="ember_titan_aura" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#C84B31" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#8B1E0F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ember_rim_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="35%" stop-color="#C84B31" />
      <stop offset="70%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="titan_armor_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1215" />
      <stop offset="50%" stop-color="#0F0A0D" />
      <stop offset="100%" stop-color="#060406" />
    </linearGradient>
    <filter id="ember-radiance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Geometric Energy Halo & Ember Radiance -->
  <g id="char_aura">
    <circle cx="400" cy="360" r="350" fill="url(#ember_titan_aura)" />
    <!-- Jagged Yantra Wheel (10 Cardinal Spikes) -->
    <g id="char_mandala" transform-origin="400 360">
      <circle cx="400" cy="360" r="290" fill="none" stroke="#C84B31" stroke-width="2" stroke-dasharray="14 8" opacity="0.6" />
      <circle cx="400" cy="360" r="260" fill="none" stroke="#E5B869" stroke-width="1.5" opacity="0.4" />
      <polygon points="400,80 460,260 640,160 520,320 680,360 520,400 640,560 460,460 400,640 340,460 160,560 280,400 120,360 280,320 160,160 340,260" fill="none" stroke="#C84B31" stroke-width="1.8" opacity="0.35" />
    </g>
  </g>

  <!-- 2. Colossal Muscular Torso & Sharp Armor Plates -->
  <g id="char_body" transform-origin="400 700">
    <!-- Massive Silhouette Torso Mass -->
    <path d="M 230,440 L 570,440 L 530,900 L 270,900 Z" fill="url(#titan_armor_grad)" />

    <!-- Jagged Pauldrons (Spiked Shoulder Armor) -->
    <!-- Left Pauldron -->
    <path d="M 250,440 L 150,380 L 180,480 L 140,520 L 240,540 Z" fill="#0C080A" stroke="#E5B869" stroke-width="2" filter="url(#ember-radiance)" />
    <path d="M 180,430 L 140,370" fill="none" stroke="#FF7A59" stroke-width="2.5" />
    <!-- Right Pauldron -->
    <path d="M 550,440 L 650,380 L 620,480 L 660,520 L 560,540 Z" fill="#0C080A" stroke="#E5B869" stroke-width="2" filter="url(#ember-radiance)" />
    <path d="M 620,430 L 660,370" fill="none" stroke="#FF7A59" stroke-width="2.5" />

    <!-- Gilded Chest Plate Strata (Asura Cuirass) -->
    <path d="M 310,470 L 400,530 L 490,470 L 400,600 Z" fill="#0E080B" stroke="#E5B869" stroke-width="2.5" />
    <circle cx="400" cy="530" r="14" fill="#C84B31" stroke="#FFF4DC" stroke-width="2" filter="url(#ember-radiance)" />
    <path d="M 330,620 L 400,670 L 470,620" fill="none" stroke="#E5B869" stroke-width="2" />
    <path d="M 350,690 L 400,730 L 450,690" fill="none" stroke="#E5B869" stroke-width="2" opacity="0.7" />

    <!-- War Skirt / Armor Tassets -->
    <path d="M 260,890 L 400,940 L 540,890 L 510,1180 L 290,1180 Z" fill="#0A0608" stroke="#C84B31" stroke-width="1.5" />
    <path d="M 400,940 L 400,1180" fill="none" stroke="#E5B869" stroke-width="2" stroke-dasharray="8 6" />
  </g>

  <!-- 3. Iconic Ten-Crowned Titan Head Silhouette -->
  <g id="char_head" transform-origin="400 320">
    <!-- Powerful Muscular Neck with Ember Rim -->
    <path d="M 350,390 L 350,450 L 450,450 L 450,390 Z" fill="#0A0608" stroke="#C84B31" stroke-width="2" />

    <!-- Majestic Shadow-Theater Silhouette of 10 Symmetrical Crowns -->
    <!-- Crown Spikes (Outer Far Left to Outer Far Right) -->
    <g id="ten_crown_spikes" stroke="#E5B869" stroke-width="2" filter="url(#ember-radiance)">
      <!-- Far Left Crowns (4) -->
      <polygon points="210,270 240,240 250,290" fill="#0E0709" />
      <polygon points="245,250 280,210 290,270" fill="#0E0709" />
      <polygon points="285,230 320,180 330,250" fill="#0E0709" />
      <polygon points="325,210 360,150 370,230" fill="#0E0709" />

      <!-- Central Sovereign Crown (Grand Peak) -->
      <polygon points="365,190 400,90 435,190" fill="#14080B" stroke="#FFF4DC" stroke-width="2.5" />
      <circle cx="400" cy="115" r="7" fill="#C84B31" />

      <!-- Far Right Crowns (4) -->
      <polygon points="370,230 440,150 475,210" fill="#0E0709" />
      <polygon points="470,250 480,180 515,230" fill="#0E0709" />
      <polygon points="510,270 520,210 555,250" fill="#0E0709" />
      <polygon points="550,290 560,240 590,270" fill="#0E0709" />
    </g>

    <!-- Sculptured Central Fierce Visage Silhouette (Chiseled Jaw, No Cartoon Eyes) -->
    <path d="
      M 370,260
      Q 400,245 430,260
      L 445,300
      Q 455,325 440,350
      L 425,380
      L 400,395
      L 375,380
      L 360,350
      Q 345,325 355,300 Z
    " fill="#080406" stroke="url(#ember_rim_grad)" stroke-width="3" filter="url(#ember-radiance)" />

    <!-- Fierce Third-Eye Ruby Gem / Agni Mark -->
    <path d="M 400,290 L 406,305 L 400,320 L 394,305 Z" fill="#FF4D2E" filter="url(#ember-radiance)" />
    <!-- Golden Diadem Band -->
    <path d="M 360,285 Q 400,270 440,285" fill="none" stroke="#E5B869" stroke-width="3" />
  </g>

  <!-- 4. Raised Weapon Arm (Chandrahas Sword / Cosmic Spear Silhouette) -->
  <g id="arm_right" transform-origin="580 440">
    <path d="M 560,440 L 680,310 L 710,340 L 590,470 Z" fill="#0D0709" stroke="#E5B869" stroke-width="2" />
    <!-- Weapon Hilt & Blade -->
    <path d="M 670,300 L 780,130" stroke="#FFF4DC" stroke-width="4.5" filter="url(#ember-radiance)" />
    <path d="M 680,140 L 785,125 L 770,230" fill="none" stroke="#E5B869" stroke-width="2.5" />
  </g>
</svg>
