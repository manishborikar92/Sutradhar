<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" id="ancient_scholar_puppet_rig">
  <defs>
    <!-- Warm Terracotta & Olive Skin Gradients -->
    <linearGradient id="scholar_skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa978"/>
      <stop offset="50%" stop-color="#c98a53"/>
      <stop offset="100%" stop-color="#9e6231"/>
    </linearGradient>
    <linearGradient id="scholar_skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#945826"/>
      <stop offset="100%" stop-color="#5c310c"/>
    </linearGradient>

    <!-- Ivory & Golden Ochre Silk Robes -->
    <linearGradient id="scholar_ivory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef7"/>
      <stop offset="50%" stop-color="#f5e9c9"/>
      <stop offset="100%" stop-color="#d4bf8c"/>
    </linearGradient>
    <linearGradient id="scholar_ochre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e09228"/>
      <stop offset="50%" stop-color="#ad680e"/>
      <stop offset="100%" stop-color="#693c00"/>
    </linearGradient>

    <!-- Antique Brass Astrolabe -->
    <linearGradient id="brass_astrolabe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b3"/>
      <stop offset="40%" stop-color="#e6b839"/>
      <stop offset="80%" stop-color="#997014"/>
      <stop offset="100%" stop-color="#4d3500"/>
    </linearGradient>

    <!-- Palm-Leaf Manuscript (Tala-Patra) -->
    <linearGradient id="palm_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede3be"/>
      <stop offset="50%" stop-color="#d6c694"/>
      <stop offset="100%" stop-color="#a8955f"/>
    </linearGradient>

    <!-- Brass Rivet Pin -->
    <radialGradient id="scholar_rivet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="30%" stop-color="#f59f00"/>
      <stop offset="75%" stop-color="#975a16"/>
      <stop offset="100%" stop-color="#3b2003"/>
    </radialGradient>

    <!-- Torso ClipPath -->
    <clipPath id="scholar_torso_clip">
      <path d="M 270 465 Q 245 625 295 705 L 505 705 Q 555 625 530 465 Z"/>
    </clipPath>

    <!-- Puppet Pin -->
    <g id="scholar_pin">
      <circle cx="0" cy="0" r="10" fill="#2d1d05"/>
      <circle cx="0" cy="0" r="8" fill="url(#scholar_rivet)" stroke="#442a08" stroke-width="1.5"/>
      <circle cx="-2.5" cy="-2.5" r="2.2" fill="#fffbe6" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#2d1d05"/>
    </g>
  </defs>

  <style>
    #scholar_thigh_left_rot, #thigh_left_rot, #thigh_l_rot { transform: rotate(var(--rot-thigh-l, var(--rot-thigh-left, 0deg))); transform-origin: 0px 0px; }
    #scholar_shin_left_rot, #shin_left_rot, #calf_l_rot { transform: rotate(var(--rot-calf-l, var(--rot-shin-left, 0deg))); transform-origin: 0px 0px; }
    #scholar_thigh_right_rot, #thigh_right_rot, #thigh_r_rot { transform: rotate(var(--rot-thigh-r, var(--rot-thigh-right, 0deg))); transform-origin: 0px 0px; }
    #scholar_shin_right_rot, #shin_right_rot, #calf_r_rot { transform: rotate(var(--rot-calf-r, var(--rot-shin-right, 0deg))); transform-origin: 0px 0px; }

    #scholar_shoulder_left_rot, #shoulder_front_left_rot, #shoulder_l_rot { transform: rotate(var(--rot-shoulder-l, var(--rot-shoulder-front-left, 0deg))); transform-origin: 0px 0px; }
    #scholar_elbow_left_rot, #elbow_front_left_rot, #elbow_l_rot { transform: rotate(var(--rot-elbow-l, var(--rot-elbow-front-left, 0deg))); transform-origin: 0px 0px; }
    #scholar_wrist_left_rot, #wrist_front_left_rot, #wrist_l_rot { transform: rotate(var(--rot-wrist-l, var(--rot-wrist-front-left, 0deg))); transform-origin: 0px 0px; }

    #scholar_shoulder_right_rot, #shoulder_front_right_rot, #shoulder_r_rot { transform: rotate(var(--rot-shoulder-r, var(--rot-shoulder-front-right, 0deg))); transform-origin: 0px 0px; }
    #scholar_elbow_right_rot, #elbow_front_right_rot, #elbow_r_rot { transform: rotate(var(--rot-elbow-r, var(--rot-elbow-front-right, 0deg))); transform-origin: 0px 0px; }
    #scholar_wrist_right_rot, #wrist_front_right_rot, #wrist_r_rot { transform: rotate(var(--rot-wrist-r, var(--rot-wrist-front-right, 0deg))); transform-origin: 0px 0px; }

    #scholar_torso_group, #torso_group { transform: translate(var(--trans-torso-x, 0px), var(--trans-torso-y, 0px)) rotate(var(--rot-torso, 0deg)); transform-origin: 400px 700px; }
    #scholar_head_group, #head_center, #head_group { transform: rotate(var(--rot-head, 0deg)); transform-origin: 0px 0px; }
  </style>

  <!-- GEOMETRIC SAGE AURA -->
  <g id="scholar_aura" transform="translate(400, 310)">
    <circle cx="0" cy="0" r="220" fill="url(#scholar_ochre)" opacity="0.18"/>
    <!-- Subtle Astrological Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#brass_astrolabe)" stroke-width="2.5" stroke-dasharray="16 12" opacity="0.5"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#fff4cc" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- LOWER BODY -->
  <g id="scholar_lower_body">
    <!-- Left Leg -->
    <g id="hip_left_joint" transform="translate(340, 770)">
      <g id="thigh_left_rot">
        <path d="M -22 -10 L -38 150 L 16 155 L 22 -10 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
        <g id="knee_left_joint" transform="translate(-12, 150)">
          <g id="shin_left_rot">
            <path d="M -18 0 Q -30 75 -20 160 L 22 160 Q 30 75 18 0 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="2.5"/>
            <ellipse cx="1" cy="155" rx="24" ry="9" fill="url(#brass_astrolabe)" stroke="#593c00" stroke-width="2"/>
            <path d="M -20 158 L -65 188 C -45 208 6 208 22 158 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
            <use href="#scholar_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#scholar_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Leg -->
    <g id="hip_right_joint" transform="translate(460, 770)">
      <g id="thigh_right_rot">
        <path d="M -22 -10 L -16 155 L 38 150 L 22 -10 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
        <g id="knee_right_joint" transform="translate(12, 150)">
          <g id="shin_right_rot">
            <path d="M -18 0 Q -30 75 -22 160 L 20 160 Q 30 75 18 0 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="2.5"/>
            <ellipse cx="-1" cy="155" rx="24" ry="9" fill="url(#brass_astrolabe)" stroke="#593c00" stroke-width="2"/>
            <path d="M 20 158 L 65 188 C 45 208 -6 208 -22 158 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
            <use href="#scholar_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#scholar_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Ivory & Ochre Pleated Dhoti -->
    <g id="dhoti_skirt">
      <path d="M 270 700 Q 400 735 530 700 L 565 925 Q 400 970 235 925 Z" fill="url(#scholar_ivory)" stroke="#4a3000" stroke-width="3"/>
      <path d="M 312 715 L 275 920 M 352 722 L 335 940 M 400 728 L 400 960 M 448 722 L 465 940 M 488 715 L 525 920" stroke="#ad8847" stroke-width="3" stroke-linecap="round"/>
      <!-- Deep Ochre Border -->
      <path d="M 235 925 Q 400 970 565 925 L 570 955 Q 400 1000 230 955 Z" fill="url(#scholar_ochre)" stroke="#4a2600" stroke-width="2"/>
      <path d="M 360 710 L 350 965 L 400 1005 L 450 965 L 440 710 Z" fill="url(#scholar_ochre)" stroke="#e09228" stroke-width="2.5"/>
    </g>

    <!-- Waistband -->
    <g id="kamarband">
      <rect x="268" y="685" width="264" height="34" rx="8" fill="url(#brass_astrolabe)" stroke="#593c00" stroke-width="2.5"/>
      <circle cx="400" cy="702" r="14" fill="#523100" stroke="url(#brass_astrolabe)" stroke-width="3"/>
      <circle cx="400" cy="702" r="5" fill="#fff5cc"/>
      <use href="#scholar_pin" x="305" y="702"/>
      <use href="#scholar_pin" x="495" y="702"/>
    </g>
  </g>

  <!-- UPPER BODY / TORSO -->
  <g id="torso_group">
    <path d="M 270 465 Q 245 625 295 705 L 505 705 Q 555 625 530 465 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="3"/>

    <!-- Clipped Draped Angavastram -->
    <g clip-path="url(#scholar_torso_clip)">
      <!-- Golden Ochre Draped Shawl across Chest -->
      <path d="M 265 470 Q 370 560 525 675 L 490 705 Q 350 590 250 495 Z" fill="url(#scholar_ochre)" stroke="#4d2c00" stroke-width="2.5"/>
      <!-- Sacred Thread -->
      <path d="M 290 470 Q 380 575 480 690" stroke="#ffffff" stroke-width="3.5" fill="none"/>
      <!-- Carved Sandalwood Amulet -->
      <circle cx="400" cy="515" r="12" fill="#784210" stroke="url(#brass_astrolabe)" stroke-width="2"/>
    </g>

    <!-- LEFT ARM (Viewer's Left - Holding Palm-Leaf Manuscript) -->
    <g id="shoulder_front_left_anchor" transform="translate(290, 480)">
      <g id="shoulder_front_left_joint">
        <g id="shoulder_front_left_rot">
          <path d="M 0 0 L -50 85 L -18 95 L 18 10 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
          <g id="elbow_front_left_joint" transform="translate(-35, 90)">
            <g id="elbow_front_left_rot">
              <path d="M 0 0 L 20 85 L 50 75 L 18 0 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="2.5"/>
              <g id="wrist_front_left_joint" transform="translate(30, 80)">
                <g id="wrist_front_left_rot">
                  <path d="M -8 0 L -10 30 L 12 30 L 8 0 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2"/>
                  <!-- Palm-Leaf Manuscript (Tala-Patra Bundle) -->
                  <g id="tala_patra" transform="translate(0, 15) rotate(15)">
                    <rect x="-15" y="-60" width="140" height="24" rx="4" fill="url(#palm_leaf)" stroke="#473a1d" stroke-width="2"/>
                    <rect x="-18" y="-56" width="140" height="24" rx="4" fill="url(#palm_leaf)" stroke="#473a1d" stroke-width="2"/>
                    <!-- Binding Cord -->
                    <circle cx="20" cy="-44" r="3.5" fill="#800000"/>
                    <circle cx="80" cy="-44" r="3.5" fill="#800000"/>
                    <line x1="-10" y1="-44" x2="110" y2="-44" stroke="#800000" stroke-width="1.5" stroke-dasharray="4 4"/>
                  </g>
                  <use href="#scholar_pin" x="0" y="0"/>
                </g>
              </g>
              <use href="#scholar_pin" x="0" y="0"/>
            </g>
          </g>
          <use href="#scholar_pin" x="0" y="0"/>
        </g>
      </g>
    </g>

    <!-- RIGHT ARM (Viewer's Right - Holding Brass Astrolabe / Sight Ring) -->
    <g id="shoulder_front_right_anchor" transform="translate(510, 480)">
      <g id="shoulder_front_right_joint">
        <g id="shoulder_front_right_rot">
          <path d="M 0 0 L 50 85 L 18 95 L -18 10 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
          <g id="elbow_front_right_joint" transform="translate(35, 90)">
            <g id="elbow_front_right_rot">
              <path d="M 0 0 L -20 85 L -50 75 L -18 0 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="2.5"/>
              <g id="wrist_front_right_joint" transform="translate(-30, 80)">
                <g id="wrist_front_right_rot">
                  <path d="M -8 0 L -10 30 L 12 30 L 8 0 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2"/>
                  <!-- Brass Astrolabe / Armillary Ring -->
                  <g id="scholar_astrolabe" transform="translate(0, 15)">
                    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#brass_astrolabe)" stroke-width="4.5"/>
                    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#brass_astrolabe)" stroke-width="2.5"/>
                    <line x1="-36" y1="0" x2="36" y2="0" stroke="url(#brass_astrolabe)" stroke-width="3"/>
                    <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#brass_astrolabe)" stroke-width="3"/>
                    <circle cx="0" cy="0" r="6" fill="#fff5cc" stroke="#593c00" stroke-width="1.5"/>
                  </g>
                  <use href="#scholar_pin" x="0" y="0"/>
                </g>
              </g>
              <use href="#scholar_pin" x="0" y="0"/>
            </g>
          </g>
          <use href="#scholar_pin" x="0" y="0"/>
        </g>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="neck_mount" transform="translate(400, 465)">
      <path d="M -20 0 L -22 -50 L 22 -50 L 20 0 Z" fill="url(#scholar_skin_shadow)" stroke="#4a2608" stroke-width="2.5"/>
      <g id="head_center" transform="translate(0, -45)">
        <g id="scholar_head_group">
          <!-- Dignified Sage Face -->
          <path d="M -40 -50 C -48 10 -36 50 0 55 C 36 50 48 10 40 -50 Z" fill="url(#scholar_skin_base)" stroke="#4a2608" stroke-width="3"/>

          <!-- Eyes -->
          <g id="eyes_normal">
            <ellipse cx="-18" cy="-6" rx="13" ry="7" fill="#ffffff" stroke="#4a2608" stroke-width="2"/>
            <circle cx="-18" cy="-6" r="4.5" fill="#42250d"/>
            <circle cx="-19" cy="-7" r="1.5" fill="#ffffff"/>
            <ellipse cx="18" cy="-6" rx="13" ry="7" fill="#ffffff" stroke="#4a2608" stroke-width="2"/>
            <circle cx="18" cy="-6" r="4.5" fill="#42250d"/>
            <circle cx="17" cy="-7" r="1.5" fill="#ffffff"/>
          </g>
          <g id="eyes_wrath" opacity="0">
            <ellipse cx="-18" cy="-6" rx="14" ry="8" fill="#fff5cc" stroke="#8a0000" stroke-width="2.5"/>
            <circle cx="-18" cy="-6" r="5" fill="#a82000"/>
            <ellipse cx="18" cy="-6" rx="14" ry="8" fill="#fff5cc" stroke="#8a0000" stroke-width="2.5"/>
            <circle cx="18" cy="-6" r="5" fill="#a82000"/>
          </g>
          <g id="eyes_fear" opacity="0">
            <ellipse cx="-18" cy="-5" rx="15" ry="10" fill="#ffffff" stroke="#4a2608" stroke-width="2.5"/>
            <circle cx="-18" cy="-4" r="3" fill="#42250d"/>
            <ellipse cx="18" cy="-5" rx="15" ry="10" fill="#ffffff" stroke="#4a2608" stroke-width="2.5"/>
            <circle cx="18" cy="-4" r="3" fill="#42250d"/>
          </g>
          <g id="eyes_joy" opacity="0">
            <path d="M -28 -4 Q -18 -12 -8 -4" stroke="#4a2608" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M 8 -4 Q 18 -12 28 -4" stroke="#4a2608" stroke-width="3" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Brows -->
          <g id="brows_neutral">
            <path d="M -30 -18 Q -18 -26 -6 -18" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 30 -18 Q 18 -26 6 -18" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <g id="brows_angry" opacity="0">
            <path d="M -30 -14 L -6 -24" stroke="#6e0000" stroke-width="4" stroke-linecap="round"/>
            <path d="M 30 -14 L 6 -24" stroke="#6e0000" stroke-width="4" stroke-linecap="round"/>
          </g>
          <g id="brows_fear" opacity="0">
            <path d="M -30 -26 Q -18 -18 -6 -26" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 30 -26 Q 18 -18 6 -26" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <g id="brows_joy" opacity="0">
            <path d="M -30 -22 Q -18 -30 -6 -20" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 30 -22 Q 18 -30 6 -20" stroke="#2e1704" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Nose -->
          <path d="M 0 -16 L 3 10 L -4 12" stroke="#4a2608" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

          <!-- Distinguished Moustache & Trim Beard -->
          <path d="M -24 20 Q 0 16 24 20 Q 15 28 0 26 Q -15 28 -24 20 Z" fill="#241405" stroke="#120800" stroke-width="1.5"/>
          <path d="M -20 28 Q 0 68 20 28 Q 12 60 0 60 Q -12 60 -20 28 Z" fill="#241405" stroke="#120800" stroke-width="2"/>
          <!-- Silver streaks in beard -->
          <line x1="-5" y1="32" x2="-2" y2="52" stroke="#d4d4d4" stroke-width="1.2"/>
          <line x1="5" y1="32" x2="2" y2="52" stroke="#d4d4d4" stroke-width="1.2"/>

          <!-- Switchable Mouth -->
          <g id="mouth_calm">
            <path d="M -12 24 Q 0 28 12 24" stroke="#4a2608" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </g>
          <g id="mouth_talk" opacity="0">
            <ellipse cx="0" cy="26" rx="8" ry="5" fill="#3d1400" stroke="#4a2608" stroke-width="2"/>
            <path d="M -6 24 Q 0 26 6 24" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>
          <g id="mouth_shout" opacity="0">
            <path d="M -12 23 Q 0 19 12 23 Q 9 35 0 35 Q -9 35 -12 23 Z" fill="#4d1000" stroke="#4a2608" stroke-width="2"/>
            <path d="M -8 25 Q 0 27 8 25" stroke="#ffffff" stroke-width="2" fill="none"/>
          </g>
          <g id="mouth_fear" opacity="0">
            <ellipse cx="0" cy="28" rx="8" ry="6" fill="#331000" stroke="#4a2608" stroke-width="2"/>
            <path d="M -5 26 Q 0 28 5 26" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>
          <g id="mouth_joy" opacity="0">
            <path d="M -14 24 Q 0 34 14 24 Q 0 38 -14 24 Z" fill="#4d1000" stroke="#4a2608" stroke-width="2"/>
            <path d="M -10 26 Q 0 29 10 26" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>

          <!-- Tilak: White Sandalwood Crescent & Dot -->
          <path d="M -10 -25 Q 0 -20 10 -25" stroke="#ffffff" stroke-width="3" fill="none"/>
          <circle cx="0" cy="-30" r="2.5" fill="#ad3a00"/>

          <!-- Topknot / Tied Ascetic Hair with silver highlights -->
          <path d="M -30 -48 Q -40 -105 0 -115 Q 40 -105 30 -48 Z" fill="#241405" stroke="#120800" stroke-width="2.5"/>
          <path d="M -15 -85 Q 0 -105 15 -85" stroke="#d4d4d4" stroke-width="2" fill="none"/>
          <!-- Wooden/Bone Hairpin -->
          <line x1="-35" y1="-80" x2="35" y2="-80" stroke="url(#brass_astrolabe)" stroke-width="4"/>

          <!-- Simple Gold Kundals -->
          <circle cx="-42" cy="0" r="7" fill="url(#brass_astrolabe)" stroke="#593c00" stroke-width="1.8"/>
          <circle cx="42" cy="0" r="7" fill="url(#brass_astrolabe)" stroke="#593c00" stroke-width="1.8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
