<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" id="shiva_puppet_rig">
  <defs>
    <!-- Sacred Ash-Smeared Pale Blue/Grey Skin -->
    <linearGradient id="shiva_skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="shiva_skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Neelkantha (Sacred Deep Blue Throat) -->
    <radialGradient id="shiva_throat_blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <!-- Tiger Skin Garment -->
    <linearGradient id="shiva_tiger_skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Iron & Gold Trishul Metal -->
    <linearGradient id="shiva_trishul_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="shiva_iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Brass Rivet -->
    <radialGradient id="shiva_rivet_metal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Torso ClipPath -->
    <clipPath id="shiva_torso_clip">
      <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z"/>
    </clipPath>

    <!-- Joint Pin Template -->
    <g id="shiva_pin">
      <circle cx="0" cy="0" r="9.5" fill="#181308"/>
      <circle cx="0" cy="0" r="7.5" fill="url(#shiva_rivet_metal)" stroke="#451a03" stroke-width="1.4"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Sacred Trishul with Attached Damru Prop -->
    <g id="sacred_trishul_damru">
      <!-- Iron Shaft -->
      <rect x="-7" y="-210" width="14" height="420" rx="3" fill="url(#shiva_iron)" stroke="#0f172a" stroke-width="2"/>
      <!-- Gold Bands -->
      <rect x="-10" y="-120" width="20" height="12" rx="2" fill="url(#shiva_trishul_gold)"/>
      <rect x="-10" y="120" width="20" height="12" rx="2" fill="url(#shiva_trishul_gold)"/>
      <!-- Trishul Trident Head -->
      <g id="trident_head" transform="translate(0, -210)">
        <circle cx="0" cy="0" r="14" fill="url(#shiva_trishul_gold)" stroke="#451a03" stroke-width="2"/>
        <!-- Central Spear Blade -->
        <path d="M -8 0 L 0 -95 L 8 0 Z" fill="url(#shiva_trishul_gold)" stroke="#451a03" stroke-width="2"/>
        <!-- Left Curved Prong -->
        <path d="M -10 0 C -45 -25 -45 -70 -20 -90 C -25 -60 -15 -35 0 -10 Z" fill="url(#shiva_trishul_gold)" stroke="#451a03" stroke-width="2"/>
        <!-- Right Curved Prong -->
        <path d="M 10 0 C 45 -25 45 -70 20 -90 C 25 -60 15 -35 0 -10 Z" fill="url(#shiva_trishul_gold)" stroke="#451a03" stroke-width="2"/>
      </g>
      <!-- Damru (Hourglass Drum) attached to shaft -->
      <g id="sacred_damru" transform="translate(0, -100)">
        <path d="M -16 -18 L 16 -18 L -16 18 L 16 18 Z" fill="#78350f" stroke="url(#shiva_trishul_gold)" stroke-width="2"/>
        <line x1="-16" y1="-18" x2="16" y2="-18" stroke="#fef08a" stroke-width="2"/>
        <line x1="-16" y1="18" x2="16" y2="18" stroke="#fef08a" stroke-width="2"/>
        <!-- Drum Beater Cord -->
        <circle cx="18" cy="6" r="3.5" fill="#fef08a"/>
      </g>
    </g>
  </defs>

  <style>
    /* CSS Joint Rotations (Hierarchical Rivet Rig) */
    #shiva_thigh_left_rot, #thigh_left_rot, #thigh_l_rot { transform: rotate(var(--rot-thigh-l, var(--rot-thigh-left, 0deg))); transform-origin: 0px 0px; }
    #shiva_shin_left_rot, #shin_left_rot, #calf_l_rot { transform: rotate(var(--rot-calf-l, var(--rot-shin-left, 0deg))); transform-origin: 0px 0px; }
    #shiva_thigh_right_rot, #thigh_right_rot, #thigh_r_rot { transform: rotate(var(--rot-thigh-r, var(--rot-thigh-right, 0deg))); transform-origin: 0px 0px; }
    #shiva_shin_right_rot, #shin_right_rot, #calf_r_rot { transform: rotate(var(--rot-calf-r, var(--rot-shin-right, 0deg))); transform-origin: 0px 0px; }

    #shiva_shoulder_left_rot, #shoulder_front_left_rot, #shoulder_l_rot { transform: rotate(var(--rot-shoulder-l, var(--rot-shoulder-front-left, 0deg))); transform-origin: 0px 0px; }
    #shiva_elbow_left_rot, #elbow_front_left_rot, #elbow_l_rot { transform: rotate(var(--rot-elbow-l, var(--rot-elbow-front-left, 0deg))); transform-origin: 0px 0px; }
    #shiva_wrist_left_rot, #wrist_front_left_rot, #wrist_l_rot { transform: rotate(var(--rot-wrist-l, var(--rot-wrist-front-left, 0deg))); transform-origin: 0px 0px; }

    #shiva_shoulder_right_rot, #shoulder_front_right_rot, #shoulder_r_rot { transform: rotate(var(--rot-shoulder-r, var(--rot-shoulder-front-right, 0deg))); transform-origin: 0px 0px; }
    #shiva_elbow_right_rot, #elbow_front_right_rot, #elbow_r_rot { transform: rotate(var(--rot-elbow-r, var(--rot-elbow-front-right, 0deg))); transform-origin: 0px 0px; }
    #shiva_wrist_right_rot, #wrist_front_right_rot, #wrist_r_rot { transform: rotate(var(--rot-wrist-r, var(--rot-wrist-front-right, 0deg))); transform-origin: 0px 0px; }

    #shiva_torso_group, #torso_group { transform: translate(var(--trans-torso-x, 0px), var(--trans-torso-y, 0px)) rotate(var(--rot-torso, 0deg)); transform-origin: 400px 700px; }
    #shiva_head_group, #head_center, #head_group { transform: rotate(var(--rot-head, 0deg)); transform-origin: 0px 0px; }
  </style>

  <!-- LOWER BODY -->
  <g id="shiva_lower_body">
    <!-- Left Leg -->
    <g id="hip_left_joint" transform="translate(340, 720)">
      <g id="shiva_thigh_left_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
        <g id="knee_left_joint" transform="translate(0, 110)">
          <g id="shiva_shin_left_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
            <!-- Rudraksha Anklet -->
            <circle cx="0" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <circle cx="-8" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <circle cx="8" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2"/>
            <use href="#shiva_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#shiva_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Leg -->
    <g id="hip_right_joint" transform="translate(460, 720)">
      <g id="shiva_thigh_right_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
        <g id="knee_right_joint" transform="translate(0, 110)">
          <g id="shiva_shin_right_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
            <circle cx="0" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <circle cx="-8" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <circle cx="8" cy="115" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2"/>
            <use href="#shiva_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#shiva_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Tiger Skin Dhoti (Vyaghrambara) -->
    <g id="shiva_tiger_dhoti">
      <path d="M 290 705 Q 400 715 510 705 L 530 840 Q 400 860 270 840 Z" fill="url(#shiva_tiger_skin)" stroke="#451a03" stroke-width="3"/>
      <!-- Tiger Stripes -->
      <path d="M 310 730 Q 330 740 315 765 Q 340 760 320 780" stroke="#1c1917" stroke-width="3" fill="none"/>
      <path d="M 480 730 Q 460 740 475 765 Q 450 760 470 780" stroke="#1c1917" stroke-width="3" fill="none"/>
      <path d="M 390 750 Q 400 770 410 750 Q 400 790 395 820" stroke="#1c1917" stroke-width="3.5" fill="none"/>
    </g>
  </g>

  <!-- TORSO & ARMS -->
  <g id="shiva_torso_group">
    <!-- Serene Ascetic Torso -->
    <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="3"/>

    <!-- Clipped Ornaments -->
    <g clip-path="url(#shiva_torso_clip)">
      <!-- Rudraksha Waist Mala -->
      <path d="M 270 675 Q 400 710 530 675 L 530 715 L 270 715 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
      <!-- Sacred Snake Vasuki Coiled around Chest/Torso -->
      <path d="M 280 480 Q 420 560 520 530 Q 400 640 320 620" stroke="#15803d" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M 280 480 Q 420 560 520 530 Q 400 640 320 620" stroke="#fef08a" stroke-width="2" fill="none" stroke-dasharray="6 8"/>
      <!-- Rudraksha Yajnopavita / Sacred Garland -->
      <path d="M 310 470 L 470 715" stroke="#78350f" stroke-width="5" stroke-dasharray="8 6"/>
    </g>

    <!-- Left Arm in Abhaya / Blessing Mudra -->
    <g id="shoulder_front_left_joint" transform="translate(275, 485)">
      <g id="shiva_shoulder_left_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
        <g id="elbow_front_left_joint" transform="translate(0, 105)">
          <g id="shiva_elbow_left_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
            <!-- Rudraksha Bracelet -->
            <circle cx="0" cy="85" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1"/>
            <g id="wrist_front_left_joint" transform="translate(0, 95)">
              <g id="shiva_wrist_left_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2"/>
                <use href="#shiva_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#shiva_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#shiva_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Arm Holding the Trishul & Damru -->
    <g id="shoulder_front_right_joint" transform="translate(525, 485)">
      <g id="shiva_shoulder_right_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
        <g id="elbow_front_right_joint" transform="translate(0, 105)">
          <g id="shiva_elbow_right_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2.5"/>
            <circle cx="0" cy="85" r="4.5" fill="#78350f" stroke="#451a03" stroke-width="1"/>
            <g id="wrist_front_right_joint" transform="translate(0, 95)">
              <g id="shiva_wrist_right_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="2"/>
                <!-- Trishul & Damru firmly held -->
                <g id="trishul_mount" transform="translate(0, 15) rotate(-8)">
                  <use href="#sacred_trishul_damru"/>
                </g>
                <use href="#shiva_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#shiva_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#shiva_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="neck_mount" transform="translate(400, 470)">
      <!-- Neelkantha Blue Throat Patch -->
      <path d="M -22 0 L -24 -52 L 24 -52 L 22 0 Z" fill="url(#shiva_throat_blue)" stroke="#1e293b" stroke-width="2.5"/>
      <g id="head_center" transform="translate(0, -48)">
        <g id="shiva_head_group">
          <!-- Serene Head Contour -->
          <path d="M -42 -55 C -50 10 -38 52 0 58 C 38 52 50 10 42 -55 Z" fill="url(#shiva_skin_base)" stroke="#1e293b" stroke-width="3"/>

          <!-- Expressive Eyes (4 States) -->
          <!-- 1. Normal / Deep Meditative Calm -->
          <g id="eyes_normal">
            <ellipse cx="-19" cy="-7" rx="14" ry="7" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
            <circle cx="-19" cy="-7" r="4.5" fill="#334155"/>
            <circle cx="-20" cy="-8" r="1.5" fill="#ffffff"/>
            <ellipse cx="19" cy="-7" rx="14" ry="7" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
            <circle cx="19" cy="-7" r="4.5" fill="#334155"/>
            <circle cx="18" cy="-8" r="1.5" fill="#ffffff"/>
          </g>
          <!-- 2. Wrath / Rudra Roar -->
          <g id="eyes_wrath" opacity="0">
            <ellipse cx="-19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="-19" cy="-7" r="5.5" fill="#dc2626"/>
            <ellipse cx="19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="19" cy="-7" r="5.5" fill="#dc2626"/>
          </g>
          <!-- 3. Fear (Distress / Serious Cosmic Concern) -->
          <g id="eyes_fear" opacity="0">
            <ellipse cx="-19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
            <circle cx="-19" cy="-5" r="3.2" fill="#334155"/>
            <ellipse cx="19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
            <circle cx="19" cy="-5" r="3.2" fill="#334155"/>
          </g>
          <!-- 4. Joy / Bholenath Benevolent Grace -->
          <g id="eyes_joy" opacity="0">
            <path d="M -31 -5 Q -19 -14 -7 -5" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <path d="M 7 -5 Q 19 -14 31 -5" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Eyebrows (4 States) -->
          <!-- 1. Neutral -->
          <g id="brows_neutral">
            <path d="M -32 -19 Q -18 -28 -6 -19" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -19 Q 18 -28 6 -19" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Angry / Rudra Frown -->
          <g id="brows_angry" opacity="0">
            <path d="M -32 -14 L -6 -25" stroke="#b91c1c" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M 32 -14 L 6 -25" stroke="#b91c1c" stroke-width="4.5" stroke-linecap="round"/>
          </g>
          <!-- 3. Fear -->
          <g id="brows_fear" opacity="0">
            <path d="M -32 -26 Q -18 -17 -6 -26" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -26 Q 18 -17 6 -26" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 4. Joy -->
          <g id="brows_joy" opacity="0">
            <path d="M -32 -22 Q -18 -32 -6 -22" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -22 Q 18 -32 6 -22" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Nose -->
          <path d="M 0 -16 L 4 12 L -4 14" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

          <!-- Switchable Mouth (5 States) -->
          <!-- 1. Calm -->
          <g id="mouth_calm">
            <path d="M -14 28 Q 0 34 14 28" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Talk -->
          <g id="mouth_talk" opacity="0">
            <ellipse cx="0" cy="30" rx="9" ry="6" fill="#1e1b4b" stroke="#1e293b" stroke-width="2"/>
            <path d="M -7 28 Q 0 30 7 28" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          </g>
          <!-- 3. Shout / Tandava Roar -->
          <g id="mouth_shout" opacity="0">
            <path d="M -15 27 Q 0 22 15 27 Q 12 42 0 42 Q -12 42 -15 27 Z" fill="#1e1b4b" stroke="#1e293b" stroke-width="2.5"/>
            <path d="M -10 29 Q 0 31 10 29" stroke="#ffffff" stroke-width="2.2" fill="none"/>
          </g>
          <!-- 4. Fear -->
          <g id="mouth_fear" opacity="0">
            <ellipse cx="0" cy="32" rx="9" ry="8" fill="#1e1b4b" stroke="#1e293b" stroke-width="2"/>
            <path d="M -6 30 Q 0 33 6 30" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>
          <!-- 5. Joy / Divine Smirk -->
          <g id="mouth_joy" opacity="0">
            <path d="M -16 26 Q 0 40 16 26 Q 0 45 -16 26 Z" fill="#1e3a8a" stroke="#1e293b" stroke-width="2.5"/>
            <path d="M -11 28 Q 0 31 11 28" stroke="#ffffff" stroke-width="2" fill="none"/>
          </g>

          <!-- Sacred Ash Tripundra (3 White Horizontal Stripes) -->
          <line x1="-16" y1="-28" x2="16" y2="-28" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-18" y1="-23" x2="18" y2="-23" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-16" y1="-18" x2="16" y2="-18" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Vertical Third Eye (Trinetra) in Red/Gold -->
          <ellipse cx="0" cy="-23" rx="3.5" ry="7" fill="#dc2626" stroke="#fbbf24" stroke-width="1.2"/>

          <!-- Matted Jata Topknot with Crescent Moon (Chandra) -->
          <path d="M -35 -50 Q -45 -140 0 -160 Q 45 -140 35 -50 Z" fill="#1c1917" stroke="#0f172a" stroke-width="2.5"/>
          <!-- Crescent Moon on Left of Topknot -->
          <path d="M -22 -110 Q -38 -125 -22 -140 Q -30 -125 -22 -110 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
          <!-- Sacred Ganga Crest Mark on Top of Jata -->
          <circle cx="0" cy="-160" r="5" fill="#38bdf8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
