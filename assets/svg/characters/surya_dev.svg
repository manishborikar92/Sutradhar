<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" id="surya_dev_puppet_rig">
  <defs>
    <!-- Radiant Solar Skin Gradients -->
    <linearGradient id="surya_skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="surya_skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Solar Gold Gradients -->
    <linearGradient id="surya_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Royal Vermilion / Saffron Robes -->
    <linearGradient id="surya_robes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Radiant Solar Prabhavali Halo -->
    <radialGradient id="surya_halo_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rivet -->
    <radialGradient id="surya_rivet_metal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Torso ClipPath -->
    <clipPath id="surya_torso_clip">
      <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z"/>
    </clipPath>

    <!-- Joint Pin Template -->
    <g id="surya_pin">
      <circle cx="0" cy="0" r="9.5" fill="#181308"/>
      <circle cx="0" cy="0" r="7.5" fill="url(#surya_rivet_metal)" stroke="#451a03" stroke-width="1.4"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Single Lotus Prop -->
    <g id="sacred_lotus">
      <!-- Petals -->
      <path d="M 0 0 C -15 -25 -25 -40 0 -65 C 25 -40 15 -25 0 0 Z" fill="#fb7185" stroke="#be123c" stroke-width="1.5"/>
      <path d="M 0 0 C -25 -15 -45 -25 -35 -50 C -15 -45 -5 -25 0 0 Z" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/>
      <path d="M 0 0 C 25 -15 45 -25 35 -50 C 15 -45 5 -25 0 0 Z" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/>
      <!-- Gold Stem -->
      <line x1="0" y1="0" x2="0" y2="40" stroke="url(#surya_gold)" stroke-width="3"/>
    </g>
  </defs>

  <style>
    /* CSS Joint Rotations (Hierarchical Rivet Rig) */
    #surya_thigh_left_rot, #thigh_left_rot, #thigh_l_rot { transform: rotate(var(--rot-thigh-l, var(--rot-thigh-left, 0deg))); transform-origin: 0px 0px; }
    #surya_shin_left_rot, #shin_left_rot, #calf_l_rot { transform: rotate(var(--rot-calf-l, var(--rot-shin-left, 0deg))); transform-origin: 0px 0px; }
    #surya_thigh_right_rot, #thigh_right_rot, #thigh_r_rot { transform: rotate(var(--rot-thigh-r, var(--rot-thigh-right, 0deg))); transform-origin: 0px 0px; }
    #surya_shin_right_rot, #shin_right_rot, #calf_r_rot { transform: rotate(var(--rot-calf-r, var(--rot-shin-right, 0deg))); transform-origin: 0px 0px; }

    #surya_shoulder_left_rot, #shoulder_front_left_rot, #shoulder_l_rot { transform: rotate(var(--rot-shoulder-l, var(--rot-shoulder-front-left, 0deg))); transform-origin: 0px 0px; }
    #surya_elbow_left_rot, #elbow_front_left_rot, #elbow_l_rot { transform: rotate(var(--rot-elbow-l, var(--rot-elbow-front-left, 0deg))); transform-origin: 0px 0px; }
    #surya_wrist_left_rot, #wrist_front_left_rot, #wrist_l_rot { transform: rotate(var(--rot-wrist-l, var(--rot-wrist-front-left, 0deg))); transform-origin: 0px 0px; }

    #surya_shoulder_right_rot, #shoulder_front_right_rot, #shoulder_r_rot { transform: rotate(var(--rot-shoulder-r, var(--rot-shoulder-front-right, 0deg))); transform-origin: 0px 0px; }
    #surya_elbow_right_rot, #elbow_front_right_rot, #elbow_r_rot { transform: rotate(var(--rot-elbow-r, var(--rot-elbow-front-right, 0deg))); transform-origin: 0px 0px; }
    #surya_wrist_right_rot, #wrist_front_right_rot, #wrist_r_rot { transform: rotate(var(--rot-wrist-r, var(--rot-wrist-front-right, 0deg))); transform-origin: 0px 0px; }

    #surya_torso_group, #torso_group { transform: translate(var(--trans-torso-x, 0px), var(--trans-torso-y, 0px)) rotate(var(--rot-torso, 0deg)); transform-origin: 400px 700px; }
    #surya_head_group, #head_center, #head_group { transform: rotate(var(--rot-head, 0deg)); transform-origin: 0px 0px; }
  </style>

  <!-- RADIANT SOLAR PRABHAVALI (Aura) -->
  <g id="surya_prabhavali_mount" transform="translate(400, 310)">
    <circle cx="0" cy="0" r="280" fill="url(#surya_halo_grad)"/>
    <!-- 12 Radiating Sunrays -->
    <g stroke="url(#surya_gold)" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-210" x2="0" y2="-270"/>
      <line x1="105" y1="-181" x2="135" y2="-233"/>
      <line x1="181" y1="-105" x2="233" y2="-135"/>
      <line x1="210" y1="0" x2="270" y2="0"/>
      <line x1="181" y1="105" x2="233" y2="135"/>
      <line x1="105" y1="181" x2="135" y2="233"/>
      <line x1="0" y1="210" x2="0" y2="270"/>
      <line x1="-105" y1="181" x2="-135" y2="233"/>
      <line x1="-181" y1="105" x2="-233" y2="135"/>
      <line x1="-210" y1="0" x2="-270" y2="0"/>
      <line x1="-181" y1="-105" x2="-233" y2="-135"/>
      <line x1="-105" y1="-181" x2="-135" y2="-233"/>
    </g>
  </g>

  <!-- LOWER BODY -->
  <g id="surya_lower_body">
    <!-- Left Leg -->
    <g id="hip_left_joint" transform="translate(340, 720)">
      <g id="surya_thigh_left_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <g id="knee_left_joint" transform="translate(0, 110)">
          <g id="surya_shin_left_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <!-- Golden Paduka / Footwear -->
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
            <use href="#surya_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#surya_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Leg -->
    <g id="hip_right_joint" transform="translate(460, 720)">
      <g id="surya_thigh_right_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <g id="knee_right_joint" transform="translate(0, 110)">
          <g id="surya_shin_right_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
            <use href="#surya_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#surya_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Saffron Dhoti & Brocade Apron -->
    <g id="surya_dhoti_skirt">
      <path d="M 290 705 Q 400 715 510 705 L 530 840 Q 400 860 270 840 Z" fill="url(#surya_robes)" stroke="#7c2d12" stroke-width="3"/>
      <!-- Golden Pleats -->
      <path d="M 360 710 L 350 845" stroke="url(#surya_gold)" stroke-width="2.5"/>
      <path d="M 400 715 L 400 850" stroke="url(#surya_gold)" stroke-width="3"/>
      <path d="M 440 710 L 450 845" stroke="url(#surya_gold)" stroke-width="2.5"/>
    </g>
  </g>

  <!-- TORSO & ARMS -->
  <g id="surya_torso_group">
    <!-- Golden Muscular Torso -->
    <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="3"/>

    <!-- Clipped Ornaments -->
    <g clip-path="url(#surya_torso_clip)">
      <!-- Gold Waistband (Kamarband) -->
      <path d="M 270 675 Q 400 710 530 675 L 530 715 L 270 715 Z" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
      <!-- Saffron Sash -->
      <path d="M 270 480 L 530 690 L 515 715 L 255 505 Z" fill="url(#surya_robes)" opacity="0.85"/>
      <!-- Radiant Sun Jewel Pendant -->
      <circle cx="400" cy="555" r="22" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
      <circle cx="400" cy="555" r="10" fill="#dc2626"/>
    </g>

    <!-- Left Arm holding Sacred Lotus -->
    <g id="shoulder_front_left_joint" transform="translate(275, 485)">
      <g id="surya_shoulder_left_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <!-- Golden Armlet (Keyur) -->
        <rect x="-17" y="45" width="34" height="14" rx="2" fill="url(#surya_gold)" stroke="#713f12" stroke-width="1.5"/>
        <g id="elbow_front_left_joint" transform="translate(0, 105)">
          <g id="surya_elbow_left_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <g id="wrist_front_left_joint" transform="translate(0, 95)">
              <g id="surya_wrist_left_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2"/>
                <!-- Sacred Lotus in Left Hand -->
                <g id="lotus_left" transform="translate(0, 20)">
                  <use href="#sacred_lotus"/>
                </g>
                <use href="#surya_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#surya_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#surya_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Arm holding Sacred Lotus -->
    <g id="shoulder_front_right_joint" transform="translate(525, 485)">
      <g id="surya_shoulder_right_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <rect x="-17" y="45" width="34" height="14" rx="2" fill="url(#surya_gold)" stroke="#713f12" stroke-width="1.5"/>
        <g id="elbow_front_right_joint" transform="translate(0, 105)">
          <g id="surya_elbow_right_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <g id="wrist_front_right_joint" transform="translate(0, 95)">
              <g id="surya_wrist_right_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="2"/>
                <g id="lotus_right" transform="translate(0, 20)">
                  <use href="#sacred_lotus"/>
                </g>
                <use href="#surya_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#surya_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#surya_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="neck_mount" transform="translate(400, 470)">
      <path d="M -22 0 L -24 -52 L 24 -52 L 22 0 Z" fill="url(#surya_skin_shadow)" stroke="#78350f" stroke-width="2.5"/>
      <g id="head_center" transform="translate(0, -48)">
        <g id="surya_head_group">
          <!-- Head Contour -->
          <path d="M -42 -55 C -50 10 -38 52 0 58 C 38 52 50 10 42 -55 Z" fill="url(#surya_skin_base)" stroke="#78350f" stroke-width="3"/>

          <!-- Expressive Solar Eyes (4 States) -->
          <!-- 1. Normal / Regal Calm -->
          <g id="eyes_normal">
            <ellipse cx="-19" cy="-7" rx="14" ry="7.5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
            <circle cx="-19" cy="-7" r="4.8" fill="#b45309"/>
            <circle cx="-20" cy="-8" r="1.6" fill="#ffffff"/>
            <ellipse cx="19" cy="-7" rx="14" ry="7.5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
            <circle cx="19" cy="-7" r="4.8" fill="#b45309"/>
            <circle cx="18" cy="-8" r="1.6" fill="#ffffff"/>
          </g>
          <!-- 2. Wrath / Scorching Glare -->
          <g id="eyes_wrath" opacity="0">
            <ellipse cx="-19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="-19" cy="-7" r="5.8" fill="#dc2626"/>
            <circle cx="-19" cy="-7" r="2.8" fill="#ffffff"/>
            <ellipse cx="19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="19" cy="-7" r="5.8" fill="#dc2626"/>
            <circle cx="19" cy="-7" r="2.8" fill="#ffffff"/>
          </g>
          <!-- 3. Fear / Shock -->
          <g id="eyes_fear" opacity="0">
            <ellipse cx="-19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="-19" cy="-5" r="3.5" fill="#b45309"/>
            <ellipse cx="19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="19" cy="-5" r="3.5" fill="#b45309"/>
          </g>
          <!-- 4. Joy / Solar Radiance -->
          <g id="eyes_joy" opacity="0">
            <path d="M -31 -5 Q -19 -14 -7 -5" stroke="#78350f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <path d="M 7 -5 Q 19 -14 31 -5" stroke="#78350f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Eyebrows (4 States) -->
          <!-- 1. Neutral -->
          <g id="brows_neutral">
            <path d="M -32 -19 Q -18 -28 -6 -19" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -19 Q 18 -28 6 -19" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Angry / Stern -->
          <g id="brows_angry" opacity="0">
            <path d="M -32 -14 L -6 -25" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M 32 -14 L 6 -25" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
          </g>
          <!-- 3. Fear -->
          <g id="brows_fear" opacity="0">
            <path d="M -32 -26 Q -18 -17 -6 -26" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -26 Q 18 -17 6 -26" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 4. Joy -->
          <g id="brows_joy" opacity="0">
            <path d="M -32 -22 Q -18 -32 -6 -22" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -22 Q 18 -32 6 -22" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Nose -->
          <path d="M 0 -16 L 4 12 L -4 14" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

          <!-- Switchable Mouth (5 States) -->
          <!-- 1. Calm -->
          <g id="mouth_calm">
            <path d="M -14 28 Q 0 34 14 28" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Talk -->
          <g id="mouth_talk" opacity="0">
            <ellipse cx="0" cy="30" rx="9" ry="6" fill="#450a0a" stroke="#78350f" stroke-width="2"/>
            <path d="M -7 28 Q 0 30 7 28" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          </g>
          <!-- 3. Shout -->
          <g id="mouth_shout" opacity="0">
            <path d="M -15 27 Q 0 22 15 27 Q 12 42 0 42 Q -12 42 -15 27 Z" fill="#450a0a" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -10 29 Q 0 31 10 29" stroke="#ffffff" stroke-width="2.2" fill="none"/>
          </g>
          <!-- 4. Fear -->
          <g id="mouth_fear" opacity="0">
            <ellipse cx="0" cy="32" rx="9" ry="8" fill="#3b0707" stroke="#78350f" stroke-width="2"/>
            <path d="M -6 30 Q 0 33 6 30" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>
          <!-- 5. Joy -->
          <g id="mouth_joy" opacity="0">
            <path d="M -16 26 Q 0 40 16 26 Q 0 45 -16 26 Z" fill="#9a3412" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -11 28 Q 0 31 11 28" stroke="#ffffff" stroke-width="2" fill="none"/>
          </g>

          <!-- Saffron Tilak with Sun Crest -->
          <circle cx="0" cy="-16" r="3.5" fill="#dc2626"/>
          <line x1="0" y1="-28" x2="0" y2="-6" stroke="url(#surya_gold)" stroke-width="3"/>

          <!-- Grand 7-Tier Solar Mukut (Crown) -->
          <path d="M -48 -50 L 48 -50 L 38 -140 L 0 -185 L -38 -140 Z" fill="url(#surya_gold)" stroke="#713f12" stroke-width="3"/>
          <polygon points="0,-175 -15,-140 15,-140" fill="#dc2626" stroke="url(#surya_gold)" stroke-width="1.5"/>
          <circle cx="0" cy="-90" r="12" fill="#dc2626" stroke="url(#surya_gold)" stroke-width="2.5"/>
          <circle cx="0" cy="-90" r="5" fill="#fef08a"/>

          <!-- Ornate Gold Earrings (Kundal) -->
          <circle cx="-46" cy="0" r="10" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
          <circle cx="46" cy="0" r="10" fill="url(#surya_gold)" stroke="#713f12" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
