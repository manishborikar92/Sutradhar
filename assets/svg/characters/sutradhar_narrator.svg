<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Theatrical Folk-Art Gradients -->
    <radialGradient id="sutra_halo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1c0505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skin_warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b88a" />
      <stop offset="50%" stop-color="#c99365" />
      <stop offset="100%" stop-color="#9a673d" />
    </linearGradient>
    <linearGradient id="robe_crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="gold_trim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <!-- Rivet Pin Style -->
    <radialGradient id="brass_rivet_sutra" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291003" />
    </radialGradient>
  </defs>

  <!-- 1. Background Halo & Astrolabe -->
  <g id="char_aura">
    <circle cx="400" cy="380" r="320" fill="url(#sutra_halo)" />
    <!-- Sacred Folk-Art Wheel -->
    <circle cx="400" cy="380" r="260" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 16" opacity="0.8" />
    <circle cx="400" cy="380" r="240" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6" />
  </g>

  <!-- 2. Lower Body & Robes -->
  <g id="sutra_lower_body">
    <path d="M 280,680 L 180,1180 L 620,1180 L 520,680 Z" fill="url(#robe_crimson)" stroke="#78350f" stroke-width="4" />
    <!-- Pleated Robe Accents -->
    <path d="M 360,680 L 340,1180 L 460,1180 L 440,680 Z" fill="#b91c1c" stroke="#f59e0b" stroke-width="3" />
    <path d="M 400,680 L 400,1180" stroke="#fef08a" stroke-width="2" stroke-dasharray="10 8" />
  </g>

  <!-- 3. Torso & Upper Robes -->
  <g id="sutra_torso">
    <path d="M 300,460 Q 400,480 500,460 L 520,700 L 280,700 Z" fill="url(#robe_crimson)" stroke="#78350f" stroke-width="4" />
    <!-- Gold Embroidered Sash (Angavastram) -->
    <path d="M 330,460 Q 410,560 300,700 L 350,710 Q 450,560 480,460 Z" fill="url(#gold_trim)" stroke="#78350f" stroke-width="2" />
    <!-- White Janeu Sacred Thread -->
    <path d="M 360,460 Q 430,580 320,700" fill="none" stroke="#fffbeb" stroke-width="3" stroke-dasharray="6 3" />
    <!-- Golden Necklace Choker -->
    <path d="M 350,460 Q 400,500 450,460" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 4. Storyteller's Hands (Mudras) -->
  <g id="sutra_arms">
    <!-- Left Hand Holding Sacred Palm-Leaf Manuscript (Pothi) -->
    <g id="hand_left">
      <path d="M 290,520 Q 230,600 250,720" fill="none" stroke="url(#skin_warm)" stroke-width="32" stroke-linecap="round" />
      <!-- Pothi Scripture Leaves -->
      <rect x="200" y="700" width="110" height="35" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="3" transform="rotate(-15 255 715)" />
      <line x1="210" y1="712" x2="295" y2="712" stroke="#b45309" stroke-width="2" transform="rotate(-15 255 715)" stroke-dasharray="4 4" />
      <circle cx="290" cy="520" r="10" fill="url(#brass_rivet_sutra)" stroke="#451a03" stroke-width="2" />
    </g>
    <!-- Right Hand in Chin-Mudra / Teaching Gesture -->
    <g id="hand_right">
      <path d="M 510,520 Q 570,600 540,680" fill="none" stroke="url(#skin_warm)" stroke-width="32" stroke-linecap="round" />
      <circle cx="538" cy="695" r="18" fill="url(#skin_warm)" stroke="#78350f" stroke-width="2" />
      <!-- Teaching Gesture Fingers -->
      <circle cx="540" cy="682" r="7" fill="url(#skin_warm)" />
      <circle cx="510" cy="520" r="10" fill="url(#brass_rivet_sutra)" stroke="#451a03" stroke-width="2" />
    </g>
  </g>

  <!-- 5. Storyteller Head & Expressive Features -->
  <g id="sutra_head">
    <!-- Neck -->
    <path d="M 370,410 L 370,470 L 430,470 L 430,410 Z" fill="url(#skin_warm)" stroke="#78350f" stroke-width="3" />
    <!-- Head Base -->
    <ellipse cx="400" cy="350" rx="65" ry="75" fill="url(#skin_warm)" stroke="#78350f" stroke-width="3.5" />
    <!-- Tilak / Tripundra -->
    <g id="tilak">
      <path d="M 390,305 L 410,305" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
      <path d="M 388,312 L 412,312" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="318" r="3.5" fill="#dc2626" />
    </g>
    <!-- Eyes -->
    <g id="eyes_sutra">
      <!-- Left Eye -->
      <ellipse cx="375" cy="345" rx="14" ry="9" fill="#fffbeb" stroke="#451a03" stroke-width="2" />
      <circle cx="376" cy="345" r="5" fill="#1c1917" />
      <path d="M 362,335 Q 375,330 388,335" stroke="#1c1917" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <!-- Right Eye -->
      <ellipse cx="425" cy="345" rx="14" ry="9" fill="#fffbeb" stroke="#451a03" stroke-width="2" />
      <circle cx="424" cy="345" r="5" fill="#1c1917" />
      <path d="M 412,335 Q 425,330 438,335" stroke="#1c1917" stroke-width="3.5" fill="none" stroke-linecap="round" />
    </g>
    <!-- Mustache & Beard -->
    <path d="M 380,380 Q 400,386 420,380 Q 430,374 435,380 Q 415,395 400,387 Q 385,395 365,380 Q 370,374 380,380 Z" fill="#1c1917" />
    <!-- Switchable Mouth -->
    <g id="mouth_calm">
      <path d="M 390,392 Q 400,398 410,392" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>
    <g id="mouth_talk" style="display: none;">
      <ellipse cx="400" cy="394" rx="8" ry="6" fill="#450a0a" stroke="#78350f" stroke-width="2" />
    </g>
    <!-- Ornate Turban (Pagdi) with Kalgi -->
    <g id="turban">
      <path d="M 330,320 Q 400,240 470,320 Q 450,230 400,220 Q 350,230 330,320 Z" fill="url(#gold_trim)" stroke="#78350f" stroke-width="3.5" />
      <path d="M 340,300 Q 400,260 460,300" stroke="#b45309" stroke-width="4" fill="none" />
      <!-- Ruby Gem Brooch -->
      <ellipse cx="400" cy="275" rx="10" ry="14" fill="#dc2626" stroke="#fef08a" stroke-width="2.5" />
      <!-- Peacock Feather Kalgi -->
      <path d="M 400,260 Q 405,190 395,140 Q 415,170 405,260" fill="#15803d" stroke="#fef08a" stroke-width="2" />
      <circle cx="398" cy="170" r="8" fill="#1d4ed8" stroke="#f59e0b" stroke-width="2" />
    </g>
    <!-- Brass Joint Rivet Pin at Base of Neck -->
    <circle cx="400" cy="460" r="10" fill="url(#brass_rivet_sutra)" stroke="#451a03" stroke-width="2" />
  </g>
</svg>
