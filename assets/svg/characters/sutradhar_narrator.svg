<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Gilded Rim & Mandala Gradients -->
    <radialGradient id="solar_mandala_glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#E5B869" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#C8963E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold_rim_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4DC" />
      <stop offset="35%" stop-color="#E5B869" />
      <stop offset="70%" stop-color="#9A742A" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sculpture_drape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A29" />
      <stop offset="40%" stop-color="#0C101A" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>
    <linearGradient id="filigree_line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B0" />
      <stop offset="50%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#805C1B" stop-opacity="0.4" />
    </linearGradient>
    <filter id="gold-radiance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Celestial Mandala & Geometric Astrolabe -->
  <g id="char_aura">
    <!-- Outer Radial Radiance -->
    <circle cx="400" cy="380" r="340" fill="url(#solar_mandala_glow)" />

    <!-- Sacred Astrolabe Rings -->
    <g id="char_mandala" transform-origin="400 380">
      <!-- Outer Dial Ring with Cardinal Hash Marks -->
      <circle cx="400" cy="380" r="280" fill="none" stroke="#E5B869" stroke-width="2.5" stroke-dasharray="4 12" opacity="0.65" />
      <circle cx="400" cy="380" r="260" fill="none" stroke="#C8963E" stroke-width="1.5" opacity="0.45" />

      <!-- Concentric 12-Ray Solar Star -->
      <g stroke="#E5B869" stroke-width="1.5" opacity="0.5">
        <line x1="400" y1="110" x2="400" y2="650" />
        <line x1="130" y1="380" x2="670" y2="380" />
        <line x1="209" y1="189" x2="591" y2="571" />
        <line x1="209" y1="571" x2="591" y2="189" />
        <line x1="265" y1="145" x2="535" y2="615" transform="rotate(30 400 380)" />
        <line x1="265" y1="145" x2="535" y2="615" transform="rotate(60 400 380)" />
        <line x1="265" y1="145" x2="535" y2="615" transform="rotate(120 400 380)" />
        <line x1="265" y1="145" x2="535" y2="615" transform="rotate(150 400 380)" />
      </g>

      <!-- Sacred Interlocking Hexagon Yantra -->
      <polygon points="400,160 590,490 210,490" fill="none" stroke="#E5B869" stroke-width="2" opacity="0.4" />
      <polygon points="400,600 590,270 210,270" fill="none" stroke="#E5B869" stroke-width="2" opacity="0.4" />
      <circle cx="400" cy="380" r="140" fill="none" stroke="#FFF4DC" stroke-width="2" stroke-dasharray="16 8" opacity="0.6" />
    </g>
  </g>

  <!-- 2. Sculptural Silhouette Body & Classical Robes -->
  <g id="char_body" transform-origin="400 700">
    <!-- Deep Obsidian Base Mass -->
    <path d="M 280,480 Q 220,620 180,820 L 170,1180 L 630,1180 L 620,820 Q 580,620 520,480 Z" fill="url(#sculpture_drape)" />

    <!-- Flowing Classical Robe Folds (Layered Shadow Contours) -->
    <path d="M 280,500 Q 360,680 240,1050 L 320,1180 Q 420,820 400,520 Z" fill="#090D15" stroke="#E5B869" stroke-width="1.2" opacity="0.9" />
    <path d="M 520,500 Q 440,680 560,1050 L 480,1180 Q 380,820 400,520 Z" fill="#0B101A" stroke="#E5B869" stroke-width="1.2" opacity="0.9" />

    <!-- Gilded Shoulder Sash & Filigree Embroidery -->
    <path d="M 330,480 Q 400,600 310,880 L 370,920 Q 440,650 470,480 Z" fill="none" stroke="url(#filigree_line)" stroke-width="3" filter="url(#gold-radiance)" />
    <path d="M 310,540 Q 400,660 300,940" fill="none" stroke="#E5B869" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />
    <path d="M 350,520 Q 420,640 330,900" fill="none" stroke="#E5B869" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />

    <!-- Sculptured Chest/Drape Contours -->
    <path d="M 320,490 Q 400,580 480,490" fill="none" stroke="#E5B869" stroke-width="2.5" />
    <path d="M 340,560 Q 400,640 460,560" fill="none" stroke="#E5B869" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- 3. Sculpted Dignified Head & Crown Silhouette -->
  <g id="char_head" transform-origin="400 320">
    <!-- Sculptured Neck with Gilded Rim Light -->
    <path d="M 370,410 L 370,480 Q 400,510 430,480 L 430,410 Z" fill="#0C101A" stroke="#E5B869" stroke-width="1.5" />

    <!-- Dignified Profile Silhouette (Noble Ascetic / Scholar) -->
    <path d="
      M 400,220
      Q 450,220 460,260
      Q 465,280 460,300
      L 470,330
      Q 472,345 460,355
      L 458,370
      Q 448,390 435,405
      L 400,420
      L 365,405
      Q 352,390 342,370
      L 340,355
      Q 328,345 330,330
      L 340,300
      Q 335,280 340,260
      Q 350,220 400,220 Z
    " fill="#0A0D15" stroke="url(#gold_rim_grad)" stroke-width="3" filter="url(#gold-radiance)" />

    <!-- Ascetic Gilded Topknot / Crown (Jata Mukuta) -->
    <path d="
      M 375,225
      C 370,170 385,140 400,125
      C 415,140 430,170 425,225
      Z
    " fill="#080B12" stroke="#E5B869" stroke-width="2.5" />
    <circle cx="400" cy="125" r="9" fill="#FFF4DC" stroke="#E5B869" stroke-width="2" filter="url(#gold-radiance)" />
    <!-- Intricate Crown Filigree Bands -->
    <path d="M 373,200 Q 400,190 427,200" fill="none" stroke="#E5B869" stroke-width="2" />
    <path d="M 378,175 Q 400,165 422,175" fill="none" stroke="#E5B869" stroke-width="2" />

    <!-- Third-Eye Wisdom Mark (Tilak Flame) -->
    <path d="M 400,290 Q 404,305 400,315 Q 396,305 400,290 Z" fill="#FFE8B0" filter="url(#gold-radiance)" />
  </g>

  <!-- 4. Expressive Gesturing Hand (Holding Celestial Compass/Lotus) -->
  <g id="arm_right" transform-origin="500 500">
    <!-- Sculptured Right Forearm (Reaching Gracefully Forward) -->
    <path d="M 480,500 Q 560,580 540,680 L 515,670 Q 530,590 460,530 Z" fill="#0B101A" stroke="#E5B869" stroke-width="1.8" />

    <!-- Stylized Hand Silhouette in Mudra (Chin Mudra / Blessing) -->
    <g transform="translate(540, 680)">
      <path d="
        M 0,0
        Q 25,-10 35,-30
        Q 38,-35 45,-30
        Q 40,-10 20,15
        L -10,25 Z
      " fill="#0C101A" stroke="#E5B869" stroke-width="2" />
      <!-- Radiant Pointer Spark -->
      <circle cx="40" cy="-32" r="5" fill="#FFF4DC" filter="url(#gold-radiance)" />
    </g>
  </g>

  <!-- 5. Atmospheric Base Mist Silhouette -->
  <g id="char_base_mist" opacity="0.8">
    <path d="M 100,1200 Q 250,1100 400,1130 Q 550,1160 700,1200 Z" fill="#07090F" />
  </g>
</svg>
