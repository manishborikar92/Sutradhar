<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" id="indra_dev_puppet_rig">
  <defs>
    <!-- Royal Deva Skin Gradients -->
    <linearGradient id="indra_skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="indra_skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Celestial Gold -->
    <linearGradient id="indra_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Royal Svarga Midnight Blue Silk -->
    <linearGradient id="indra_robes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Rivet Metal -->
    <radialGradient id="indra_rivet_metal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Torso ClipPath -->
    <clipPath id="indra_torso_clip">
      <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z"/>
    </clipPath>

    <!-- Joint Pin Template -->
    <g id="indra_pin">
      <circle cx="0" cy="0" r="9.5" fill="#181308"/>
      <circle cx="0" cy="0" r="7.5" fill="url(#indra_rivet_metal)" stroke="#451a03" stroke-width="1.4"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Sacred Thunderbolt (Vajra) Prop -->
    <g id="sacred_vajra">
      <!-- Central Grip Spheres -->
      <circle cx="0" cy="0" r="14" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#fef08a"/>
      <!-- Upper 3-Pronged Lotus Blade -->
      <path d="M 0 -14 L 0 -95" stroke="url(#indra_gold)" stroke-width="6" stroke-linecap="round"/>
      <path d="M -12 -14 Q -28 -55 0 -95" stroke="url(#indra_gold)" stroke-width="4.5" fill="none"/>
      <path d="M 12 -14 Q 28 -55 0 -95" stroke="url(#indra_gold)" stroke-width="4.5" fill="none"/>
      <!-- Lower 3-Pronged Lotus Blade -->
      <path d="M 0 14 L 0 95" stroke="url(#indra_gold)" stroke-width="6" stroke-linecap="round"/>
      <path d="M -12 14 Q -28 55 0 95" stroke="url(#indra_gold)" stroke-width="4.5" fill="none"/>
      <path d="M 12 14 Q 28 55 0 95" stroke="url(#indra_gold)" stroke-width="4.5" fill="none"/>
    </g>
  </defs>

  <style>
    /* CSS Joint Rotations (Hierarchical Rivet Rig) */
    #indra_thigh_left_rot, #thigh_left_rot, #thigh_l_rot { transform: rotate(var(--rot-thigh-l, var(--rot-thigh-left, 0deg))); transform-origin: 0px 0px; }
    #indra_shin_left_rot, #shin_left_rot, #calf_l_rot { transform: rotate(var(--rot-calf-l, var(--rot-shin-left, 0deg))); transform-origin: 0px 0px; }
    #indra_thigh_right_rot, #thigh_right_rot, #thigh_r_rot { transform: rotate(var(--rot-thigh-r, var(--rot-thigh-right, 0deg))); transform-origin: 0px 0px; }
    #indra_shin_right_rot, #shin_right_rot, #calf_r_rot { transform: rotate(var(--rot-calf-r, var(--rot-shin-right, 0deg))); transform-origin: 0px 0px; }

    #indra_shoulder_left_rot, #shoulder_front_left_rot, #shoulder_l_rot { transform: rotate(var(--rot-shoulder-l, var(--rot-shoulder-front-left, 0deg))); transform-origin: 0px 0px; }
    #indra_elbow_left_rot, #elbow_front_left_rot, #elbow_l_rot { transform: rotate(var(--rot-elbow-l, var(--rot-elbow-front-left, 0deg))); transform-origin: 0px 0px; }
    #indra_wrist_left_rot, #wrist_front_left_rot, #wrist_l_rot { transform: rotate(var(--rot-wrist-l, var(--rot-wrist-front-left, 0deg))); transform-origin: 0px 0px; }

    #indra_shoulder_right_rot, #shoulder_front_right_rot, #shoulder_r_rot { transform: rotate(var(--rot-shoulder-r, var(--rot-shoulder-front-right, 0deg))); transform-origin: 0px 0px; }
    #indra_elbow_right_rot, #elbow_front_right_rot, #elbow_r_rot { transform: rotate(var(--rot-elbow-r, var(--rot-elbow-front-right, 0deg))); transform-origin: 0px 0px; }
    #indra_wrist_right_rot, #wrist_front_right_rot, #wrist_r_rot { transform: rotate(var(--rot-wrist-r, var(--rot-wrist-front-right, 0deg))); transform-origin: 0px 0px; }

    #indra_torso_group, #torso_group { transform: translate(var(--trans-torso-x, 0px), var(--trans-torso-y, 0px)) rotate(var(--rot-torso, 0deg)); transform-origin: 400px 700px; }
    #indra_head_group, #head_center, #head_group { transform: rotate(var(--rot-head, 0deg)); transform-origin: 0px 0px; }
  </style>

  <!-- LOWER BODY -->
  <g id="indra_lower_body">
    <!-- Left Leg -->
    <g id="hip_left_joint" transform="translate(340, 720)">
      <g id="indra_thigh_left_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <g id="knee_left_joint" transform="translate(0, 110)">
          <g id="indra_shin_left_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
            <use href="#indra_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#indra_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Leg -->
    <g id="hip_right_joint" transform="translate(460, 720)">
      <g id="indra_thigh_right_rot">
        <path d="M -20 0 L -24 110 L 22 110 L 20 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <g id="knee_right_joint" transform="translate(0, 110)">
          <g id="indra_shin_right_rot">
            <path d="M -18 0 L -14 120 L 14 120 L 18 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -14 120 L -12 145 L 30 145 Q 32 130 14 120 Z" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
            <use href="#indra_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#indra_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Royal Midnight Blue Dhoti -->
    <g id="indra_dhoti_skirt">
      <path d="M 290 705 Q 400 715 510 705 L 535 845 Q 400 865 265 845 Z" fill="url(#indra_robes)" stroke="#1e1b4b" stroke-width="3"/>
      <!-- Gold Brocade Borders -->
      <path d="M 350 710 L 340 850" stroke="url(#indra_gold)" stroke-width="2.5"/>
      <path d="M 400 715 L 400 855" stroke="url(#indra_gold)" stroke-width="3.5"/>
      <path d="M 450 710 L 460 850" stroke="url(#indra_gold)" stroke-width="2.5"/>
    </g>
  </g>

  <!-- TORSO & ARMS -->
  <g id="indra_torso_group">
    <!-- Royal Torso -->
    <path d="M 270 470 Q 245 625 295 705 L 505 705 Q 555 625 530 470 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="3"/>

    <!-- Clipped Ornaments -->
    <g clip-path="url(#indra_torso_clip)">
      <!-- Gold Kamarband -->
      <path d="M 270 675 Q 400 710 530 675 L 530 715 L 270 715 Z" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
      <!-- Royal Pearl Yajnopavita / Janeu -->
      <path d="M 290 470 L 465 715 L 445 715 L 270 480 Z" fill="#ffffff" stroke="url(#indra_gold)" stroke-width="1.5"/>
      <!-- Multi-tier Gold Necklace with Blue Sapphire Jewel -->
      <path d="M 320 475 Q 400 580 480 475" stroke="url(#indra_gold)" stroke-width="8" fill="none"/>
      <circle cx="400" cy="570" r="12" fill="#1e40af" stroke="url(#indra_gold)" stroke-width="2.5"/>
    </g>

    <!-- Left Arm (Royal Scepter / Gesture Hand) -->
    <g id="shoulder_front_left_joint" transform="translate(275, 485)">
      <g id="indra_shoulder_left_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <rect x="-17" y="45" width="34" height="14" rx="2" fill="url(#indra_gold)" stroke="#451a03" stroke-width="1.5"/>
        <g id="elbow_front_left_joint" transform="translate(0, 105)">
          <g id="indra_elbow_left_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <g id="wrist_front_left_joint" transform="translate(0, 95)">
              <g id="indra_wrist_left_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2"/>
                <use href="#indra_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#indra_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#indra_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Arm Clutching the Sacred Thunderbolt (Vajra) -->
    <g id="shoulder_front_right_joint" transform="translate(525, 485)">
      <g id="indra_shoulder_right_rot">
        <path d="M -16 0 L -18 105 L 18 105 L 16 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
        <rect x="-17" y="45" width="34" height="14" rx="2" fill="url(#indra_gold)" stroke="#451a03" stroke-width="1.5"/>
        <g id="elbow_front_right_joint" transform="translate(0, 105)">
          <g id="indra_elbow_right_rot">
            <path d="M -15 0 L -13 95 L 13 95 L 15 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2.5"/>
            <g id="wrist_front_right_joint" transform="translate(0, 95)">
              <g id="indra_wrist_right_rot">
                <path d="M -10 0 L -12 36 L 12 36 L 10 0 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="2"/>
                <!-- Vajra held firmly in right hand -->
                <g id="vajra_mount" transform="translate(0, 18) rotate(15)">
                  <use href="#sacred_vajra"/>
                </g>
                <use href="#indra_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#indra_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#indra_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="neck_mount" transform="translate(400, 470)">
      <path d="M -22 0 L -24 -52 L 24 -52 L 22 0 Z" fill="url(#indra_skin_shadow)" stroke="#78350f" stroke-width="2.5"/>
      <g id="head_center" transform="translate(0, -48)">
        <g id="indra_head_group">
          <!-- Head Contour -->
          <path d="M -42 -55 C -50 10 -38 52 0 58 C 38 52 50 10 42 -55 Z" fill="url(#indra_skin_base)" stroke="#78350f" stroke-width="3"/>

          <!-- Expressive Eyes (4 States) -->
          <!-- 1. Normal -->
          <g id="eyes_normal">
            <ellipse cx="-19" cy="-7" rx="14" ry="7.5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
            <circle cx="-19" cy="-7" r="4.8" fill="#1e3a8a"/>
            <circle cx="-20" cy="-8" r="1.6" fill="#ffffff"/>
            <ellipse cx="19" cy="-7" rx="14" ry="7.5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
            <circle cx="19" cy="-7" r="4.8" fill="#1e3a8a"/>
            <circle cx="18" cy="-8" r="1.6" fill="#ffffff"/>
          </g>
          <!-- 2. Wrath / Thunderous Fury -->
          <g id="eyes_wrath" opacity="0">
            <ellipse cx="-19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="-19" cy="-7" r="5.8" fill="#dc2626"/>
            <ellipse cx="19" cy="-7" rx="15" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="2.5"/>
            <circle cx="19" cy="-7" r="5.8" fill="#dc2626"/>
          </g>
          <!-- 3. Fear / Anxious Dread -->
          <g id="eyes_fear" opacity="0">
            <ellipse cx="-19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="-19" cy="-5" r="3.5" fill="#1e3a8a"/>
            <ellipse cx="19" cy="-6" rx="16" ry="11" fill="#ffffff" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="19" cy="-5" r="3.5" fill="#1e3a8a"/>
          </g>
          <!-- 4. Joy / Triumphant Smirk -->
          <g id="eyes_joy" opacity="0">
            <path d="M -31 -5 Q -19 -14 -7 -5" stroke="#78350f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <path d="M 7 -5 Q 19 -14 31 -5" stroke="#78350f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Eyebrows (4 States) -->
          <!-- 1. Neutral -->
          <g id="brows_neutral">
            <path d="M -32 -19 Q -18 -28 -6 -19" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -19 Q 18 -28 6 -19" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Angry / Stern -->
          <g id="brows_angry" opacity="0">
            <path d="M -32 -14 L -6 -25" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M 32 -14 L 6 -25" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
          </g>
          <!-- 3. Fear -->
          <g id="brows_fear" opacity="0">
            <path d="M -32 -26 Q -18 -17 -6 -26" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -26 Q 18 -17 6 -26" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 4. Joy -->
          <g id="brows_joy" opacity="0">
            <path d="M -32 -22 Q -18 -32 -6 -22" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 32 -22 Q 18 -32 6 -22" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Nose -->
          <path d="M 0 -16 L 4 12 L -4 14" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

          <!-- Switchable Mouth (5 States) -->
          <!-- 1. Calm -->
          <g id="mouth_calm">
            <path d="M -14 28 Q 0 34 14 28" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Talk -->
          <g id="mouth_talk" opacity="0">
            <ellipse cx="0" cy="30" rx="9" ry="6" fill="#450a0a" stroke="#78350f" stroke-width="2"/>
            <path d="M -7 28 Q 0 30 7 28" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          </g>
          <!-- 3. Shout -->
          <g id="mouth_shout" opacity="0">
            <path d="M -15 27 Q 0 22 15 27 Q 12 42 0 42 Q -12 42 -15 27 Z" fill="#450a0a" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -10 29 Q 0 31 10 29" stroke="#ffffff" stroke-width="2.2" fill="none"/>
          </g>
          <!-- 4. Fear -->
          <g id="mouth_fear" opacity="0">
            <ellipse cx="0" cy="32" rx="9" ry="8" fill="#3b0707" stroke="#78350f" stroke-width="2"/>
            <path d="M -6 30 Q 0 33 6 30" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>
          <!-- 5. Joy -->
          <g id="mouth_joy" opacity="0">
            <path d="M -16 26 Q 0 40 16 26 Q 0 45 -16 26 Z" fill="#312e81" stroke="#78350f" stroke-width="2.5"/>
            <path d="M -11 28 Q 0 31 11 28" stroke="#ffffff" stroke-width="2" fill="none"/>
          </g>

          <!-- Royal Red Bindi & Gold Mark -->
          <circle cx="0" cy="-16" r="3" fill="#dc2626"/>

          <!-- High King Mukut with Peacock Feather Motif -->
          <path d="M -48 -50 L 48 -50 L 40 -150 L 0 -195 L -40 -150 Z" fill="url(#indra_gold)" stroke="#451a03" stroke-width="3"/>
          <!-- Peacock Feather Plume on Crown -->
          <ellipse cx="0" cy="-215" rx="14" ry="24" fill="#047857" stroke="url(#indra_gold)" stroke-width="2"/>
          <ellipse cx="0" cy="-215" rx="8" ry="14" fill="#1e40af"/>
          <circle cx="0" cy="-215" r="4" fill="#fbbf24"/>

          <!-- Blue Sapphire Center Stone -->
          <circle cx="0" cy="-100" r="12" fill="#1e40af" stroke="url(#indra_gold)" stroke-width="2.5"/>
          <circle cx="0" cy="-100" r="5" fill="#93c5fd"/>

          <!-- Gold Earrings (Kundal) -->
          <circle cx="-46" cy="0" r="10" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
          <circle cx="46" cy="0" r="10" fill="url(#indra_gold)" stroke="#451a03" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
