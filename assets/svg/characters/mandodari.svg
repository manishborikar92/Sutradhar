<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" id="mandodari_puppet_rig">
  <defs>
    <!-- Fair Peach/Sand Skin Gradients -->
    <linearGradient id="mandodari_skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba471"/>
    </linearGradient>
    <linearGradient id="mandodari_skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fba471"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Royal Magenta & Crimson Silk Lehenga -->
    <linearGradient id="mandodari_lehenga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="mandodari_choli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Warm Folk Gold -->
    <linearGradient id="mandodari_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Brass Rivet -->
    <radialGradient id="mandodari_rivet_metal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Torso ClipPath -->
    <clipPath id="mandodari_torso_clip">
      <path d="M 290 480 Q 275 620 310 705 L 490 705 Q 525 620 510 480 Z"/>
    </clipPath>

    <!-- Joint Pin Template -->
    <g id="mandodari_pin">
      <circle cx="0" cy="0" r="9" fill="#181308"/>
      <circle cx="0" cy="0" r="7" fill="url(#mandodari_rivet_metal)" stroke="#451a03" stroke-width="1.2"/>
      <circle cx="-2" cy="-2" r="2" fill="#fff9e6" opacity="0.9"/>
    </g>
  </defs>

  <style>
    /* CSS Joint Rotations (Hierarchical Rivet Rig) */
    #mandodari_thigh_left_rot, #thigh_left_rot, #thigh_l_rot { transform: rotate(var(--rot-thigh-l, var(--rot-thigh-left, 0deg))); transform-origin: 0px 0px; }
    #mandodari_shin_left_rot, #shin_left_rot, #calf_l_rot { transform: rotate(var(--rot-calf-l, var(--rot-shin-left, 0deg))); transform-origin: 0px 0px; }
    #mandodari_thigh_right_rot, #thigh_right_rot, #thigh_r_rot { transform: rotate(var(--rot-thigh-r, var(--rot-thigh-right, 0deg))); transform-origin: 0px 0px; }
    #mandodari_shin_right_rot, #shin_right_rot, #calf_r_rot { transform: rotate(var(--rot-calf-r, var(--rot-shin-right, 0deg))); transform-origin: 0px 0px; }

    #mandodari_shoulder_left_rot, #shoulder_front_left_rot, #shoulder_l_rot { transform: rotate(var(--rot-shoulder-l, var(--rot-shoulder-front-left, 0deg))); transform-origin: 0px 0px; }
    #mandodari_elbow_left_rot, #elbow_front_left_rot, #elbow_l_rot { transform: rotate(var(--rot-elbow-l, var(--rot-elbow-front-left, 0deg))); transform-origin: 0px 0px; }
    #mandodari_wrist_left_rot, #wrist_front_left_rot, #wrist_l_rot { transform: rotate(var(--rot-wrist-l, var(--rot-wrist-front-left, 0deg))); transform-origin: 0px 0px; }

    #mandodari_shoulder_right_rot, #shoulder_front_right_rot, #shoulder_r_rot { transform: rotate(var(--rot-shoulder-r, var(--rot-shoulder-front-right, 0deg))); transform-origin: 0px 0px; }
    #mandodari_elbow_right_rot, #elbow_front_right_rot, #elbow_r_rot { transform: rotate(var(--rot-elbow-r, var(--rot-elbow-front-right, 0deg))); transform-origin: 0px 0px; }
    #mandodari_wrist_right_rot, #wrist_front_right_rot, #wrist_r_rot { transform: rotate(var(--rot-wrist-r, var(--rot-wrist-front-right, 0deg))); transform-origin: 0px 0px; }

    #mandodari_torso_group, #torso_group { transform: translate(var(--trans-torso-x, 0px), var(--trans-torso-y, 0px)) rotate(var(--rot-torso, 0deg)); transform-origin: 400px 700px; }
    #mandodari_head_group, #head_center, #head_group { transform: rotate(var(--rot-head, 0deg)); transform-origin: 0px 0px; }
  </style>

  <!-- LOWER BODY (Royal Lehenga Skirt & Legs) -->
  <g id="mandodari_lower_body">
    <!-- Left Leg -->
    <g id="hip_left_joint" transform="translate(360, 720)">
      <g id="mandodari_thigh_left_rot">
        <path d="M -16 0 L -18 100 L 18 100 L 16 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
        <g id="knee_left_joint" transform="translate(0, 100)">
          <g id="mandodari_shin_left_rot">
            <path d="M -15 0 L -12 110 L 12 110 L 15 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <!-- Golden Payal / Anklet -->
            <rect x="-14" y="95" width="28" height="8" rx="2" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1.2"/>
            <!-- Dainty Foot -->
            <path d="M -12 110 L -10 135 L 24 135 Q 26 122 12 110 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <use href="#mandodari_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#mandodari_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Leg -->
    <g id="hip_right_joint" transform="translate(440, 720)">
      <g id="mandodari_thigh_right_rot">
        <path d="M -16 0 L -18 100 L 18 100 L 16 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
        <g id="knee_right_joint" transform="translate(0, 100)">
          <g id="mandodari_shin_right_rot">
            <path d="M -15 0 L -12 110 L 12 110 L 15 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <rect x="-14" y="95" width="28" height="8" rx="2" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1.2"/>
            <path d="M -12 110 L -10 135 L 24 135 Q 26 122 12 110 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <use href="#mandodari_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#mandodari_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Wide Flaring Royal Silk Lehenga -->
    <g id="mandodari_lehenga_skirt">
      <path d="M 310 705 Q 400 715 490 705 L 560 970 Q 400 990 240 970 Z" fill="url(#mandodari_lehenga)" stroke="#500724" stroke-width="3"/>
      <!-- Gold Brocade Hem Border -->
      <path d="M 240 970 Q 400 990 560 970 L 555 940 Q 400 960 245 940 Z" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="2"/>
      <!-- Vertical Silk Pleat Lines -->
      <path d="M 350 710 Q 340 850 330 960" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 400 715 L 400 975" stroke="#f472b6" stroke-width="2.5" fill="none" opacity="0.7"/>
      <path d="M 450 710 Q 460 850 470 960" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- TORSO & ARMS -->
  <g id="mandodari_torso_group">
    <!-- Silk Choli & Fitted Bodice -->
    <path d="M 290 480 Q 275 620 310 705 L 490 705 Q 525 620 510 480 Z" fill="url(#mandodari_choli)" stroke="#450a0a" stroke-width="3"/>

    <!-- Clipped Gold Ornaments inside Bodice -->
    <g clip-path="url(#mandodari_torso_clip)">
      <!-- Gold Waistband (Kamarband) -->
      <path d="M 280 680 Q 400 715 520 680 L 520 715 L 280 715 Z" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="2"/>
      <!-- Ornate Pearl & Gold Haar (Necklace) -->
      <path d="M 330 480 Q 400 570 470 480" stroke="url(#mandodari_gold)" stroke-width="7" fill="none"/>
      <circle cx="400" cy="565" r="9" fill="#991b1b" stroke="url(#mandodari_gold)" stroke-width="2"/>
    </g>

    <!-- Left Arm (Graceful Lotus / Mudra) -->
    <g id="shoulder_front_left_joint" transform="translate(295, 495)">
      <g id="mandodari_shoulder_left_rot">
        <path d="M -13 0 L -15 95 L 15 95 L 13 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
        <g id="elbow_front_left_joint" transform="translate(0, 95)">
          <g id="mandodari_elbow_left_rot">
            <path d="M -12 0 L -10 90 L 10 90 L 12 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <!-- Gold Bangles -->
            <rect x="-12" y="75" width="24" height="12" rx="2" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1.2"/>
            <g id="wrist_front_left_joint" transform="translate(0, 90)">
              <g id="mandodari_wrist_left_rot">
                <!-- Slender Hand with Red Henna Palm Accent -->
                <path d="M -8 0 L -10 32 Q 0 42 10 32 L 8 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="1.8"/>
                <circle cx="0" cy="18" r="4" fill="#991b1b" opacity="0.8"/>
                <use href="#mandodari_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#mandodari_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#mandodari_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- Right Arm (Graceful Blessing / Reassuring Mudra) -->
    <g id="shoulder_front_right_joint" transform="translate(505, 495)">
      <g id="mandodari_shoulder_right_rot">
        <path d="M -13 0 L -15 95 L 15 95 L 13 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
        <g id="elbow_front_right_joint" transform="translate(0, 95)">
          <g id="mandodari_elbow_right_rot">
            <path d="M -12 0 L -10 90 L 10 90 L 12 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2"/>
            <rect x="-12" y="75" width="24" height="12" rx="2" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1.2"/>
            <g id="wrist_front_right_joint" transform="translate(0, 90)">
              <g id="mandodari_wrist_right_rot">
                <path d="M -8 0 L -10 32 Q 0 42 10 32 L 8 0 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="1.8"/>
                <circle cx="0" cy="18" r="4" fill="#991b1b" opacity="0.8"/>
                <use href="#mandodari_pin" x="0" y="0"/>
              </g>
            </g>
            <use href="#mandodari_pin" x="0" y="0"/>
          </g>
        </g>
        <use href="#mandodari_pin" x="0" y="0"/>
      </g>
    </g>

    <!-- HEAD & NECK -->
    <g id="neck_mount" transform="translate(400, 480)">
      <path d="M -18 0 L -20 -48 L 20 -48 L 18 0 Z" fill="url(#mandodari_skin_shadow)" stroke="#451a03" stroke-width="2"/>
      <g id="head_center" transform="translate(0, -42)">
        <g id="mandodari_head_group">
          <!-- Long Dark Braided Hair in Back -->
          <path d="M -35 -40 Q -45 60 -18 180 L -8 180 Q -32 60 -25 -40 Z" fill="#1c1917" stroke="#0c0a09" stroke-width="2"/>

          <!-- Delicate Oval Face Contour -->
          <path d="M -36 -45 C -44 10 -32 46 0 52 C 32 46 44 10 36 -45 Z" fill="url(#mandodari_skin_base)" stroke="#451a03" stroke-width="2.5"/>

          <!-- Expressive Eyes (4 Switchable States) -->
          <!-- 1. Normal / Calm -->
          <g id="eyes_normal">
            <ellipse cx="-16" cy="-6" rx="12" ry="6.5" fill="#ffffff" stroke="#451a03" stroke-width="1.8"/>
            <circle cx="-16" cy="-6" r="4.2" fill="#3f2314"/>
            <circle cx="-17" cy="-7" r="1.4" fill="#ffffff"/>
            <ellipse cx="16" cy="-6" rx="12" ry="6.5" fill="#ffffff" stroke="#451a03" stroke-width="1.8"/>
            <circle cx="16" cy="-6" r="4.2" fill="#3f2314"/>
            <circle cx="15" cy="-7" r="1.4" fill="#ffffff"/>
          </g>
          <!-- 2. Wrath / Distress -->
          <g id="eyes_wrath" opacity="0">
            <ellipse cx="-16" cy="-6" rx="13" ry="7.5" fill="#fee2e2" stroke="#991b1b" stroke-width="2.2"/>
            <circle cx="-16" cy="-6" r="5" fill="#b91c1c"/>
            <ellipse cx="16" cy="-6" rx="13" ry="7.5" fill="#fee2e2" stroke="#991b1b" stroke-width="2.2"/>
            <circle cx="16" cy="-6" r="5" fill="#b91c1c"/>
          </g>
          <!-- 3. Fear / Anxious Concern -->
          <g id="eyes_fear" opacity="0">
            <ellipse cx="-16" cy="-5" rx="14" ry="9" fill="#ffffff" stroke="#451a03" stroke-width="2.2"/>
            <circle cx="-16" cy="-4" r="3" fill="#3f2314"/>
            <ellipse cx="16" cy="-5" rx="14" ry="9" fill="#ffffff" stroke="#451a03" stroke-width="2.2"/>
            <circle cx="16" cy="-4" r="3" fill="#3f2314"/>
          </g>
          <!-- 4. Joy / Serene Smile -->
          <g id="eyes_joy" opacity="0">
            <path d="M -26 -4 Q -16 -12 -6 -4" stroke="#451a03" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <path d="M 6 -4 Q 16 -12 26 -4" stroke="#451a03" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Eyebrows (4 Switchable States) -->
          <!-- 1. Neutral -->
          <g id="brows_neutral">
            <path d="M -28 -16 Q -16 -24 -6 -16" stroke="#291307" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <path d="M 28 -16 Q 16 -24 6 -16" stroke="#291307" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Angry / Stern -->
          <g id="brows_angry" opacity="0">
            <path d="M -28 -12 L -6 -21" stroke="#7f1d1d" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M 28 -12 L 6 -21" stroke="#7f1d1d" stroke-width="3.2" stroke-linecap="round"/>
          </g>
          <!-- 3. Fear / Pleading Sorrow -->
          <g id="brows_fear" opacity="0">
            <path d="M -28 -22 Q -16 -14 -6 -22" stroke="#451a03" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <path d="M 28 -22 Q 16 -14 6 -22" stroke="#451a03" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 4. Joy -->
          <g id="brows_joy" opacity="0">
            <path d="M -28 -19 Q -16 -28 -6 -19" stroke="#291307" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <path d="M 28 -19 Q 16 -28 6 -19" stroke="#291307" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Slender Nose & Gold Nath (Nose Ring) -->
          <path d="M 0 -14 L 3 8 L -3 10" stroke="#451a03" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <circle cx="-5" cy="8" r="3" fill="none" stroke="url(#mandodari_gold)" stroke-width="1.2"/>

          <!-- Switchable Mouth (5 States) -->
          <!-- 1. Calm -->
          <g id="mouth_calm">
            <path d="M -12 26 Q 0 32 12 26" stroke="#991b1b" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          </g>
          <!-- 2. Talk -->
          <g id="mouth_talk" opacity="0">
            <ellipse cx="0" cy="27" rx="8" ry="5" fill="#450a0a" stroke="#991b1b" stroke-width="1.8"/>
            <path d="M -5 25 Q 0 27 5 25" stroke="#ffffff" stroke-width="1.4" fill="none"/>
          </g>
          <!-- 3. Shout -->
          <g id="mouth_shout" opacity="0">
            <path d="M -12 24 Q 0 20 12 24 Q 9 36 0 36 Q -9 36 -12 24 Z" fill="#450a0a" stroke="#991b1b" stroke-width="2"/>
            <path d="M -8 26 Q 0 28 8 26" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          </g>
          <!-- 4. Fear -->
          <g id="mouth_fear" opacity="0">
            <ellipse cx="0" cy="28" rx="7" ry="6" fill="#3b0707" stroke="#991b1b" stroke-width="1.8"/>
            <path d="M -4 26 Q 0 28 4 26" stroke="#ffffff" stroke-width="1.2" fill="none"/>
          </g>
          <!-- 5. Joy -->
          <g id="mouth_joy" opacity="0">
            <path d="M -13 25 Q 0 36 13 25 Q 0 40 -13 25 Z" fill="#831843" stroke="#991b1b" stroke-width="2"/>
            <path d="M -9 26 Q 0 29 9 26" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          </g>

          <!-- Royal Crimson Bindi & Forehead Maang-Tikka -->
          <circle cx="0" cy="-14" r="3" fill="#dc2626"/>
          <line x1="0" y1="-44" x2="0" y2="-18" stroke="url(#mandodari_gold)" stroke-width="2"/>
          <circle cx="0" cy="-18" r="2.5" fill="url(#mandodari_gold)"/>

          <!-- Royal Gold Circlet Headdress -->
          <path d="M -40 -44 Q 0 -58 40 -44 L 36 -62 Q 0 -76 -36 -62 Z" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="2"/>
          <circle cx="0" cy="-66" r="5" fill="#dc2626" stroke="url(#mandodari_gold)" stroke-width="1.5"/>

          <!-- Gold Jhumka Earrings -->
          <g id="jhumka_left" transform="translate(-42, 6)">
            <circle cx="0" cy="0" r="4" fill="url(#mandodari_gold)"/>
            <polygon points="-5,5 5,5 0,14" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1"/>
          </g>
          <g id="jhumka_right" transform="translate(42, 6)">
            <circle cx="0" cy="0" r="4" fill="url(#mandodari_gold)"/>
            <polygon points="-5,5 5,5 0,14" fill="url(#mandodari_gold)" stroke="#78350f" stroke-width="1"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
