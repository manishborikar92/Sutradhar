<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" id="vfx_sunburst">
  <defs>
    <radialGradient id="sunCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="primaryRayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="secondaryRayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </linearGradient>

    <!-- Master Single Major Ray Definition -->
    <g id="master_major_ray">
      <polygon points="400,20 416,180 408,310 392,310 384,180" fill="url(#primaryRayGrad)" />
      <!-- Diamond Ray Tip -->
      <polygon points="400,0 408,20 400,32 392,20" fill="#ffffff" />
    </g>

    <!-- Master Single Minor Ray Definition -->
    <g id="master_minor_ray">
      <polygon points="400,90 412,210 405,310 395,310 388,210" fill="url(#secondaryRayGrad)" />
      <!-- Flame Curl -->
      <circle cx="400" cy="80" r="5" fill="#fef08a" />
    </g>
  </defs>

  <!-- MASTER ROTATING SUNBURST GROUP -->
  <g id="sunburst_rotating_group" transform-origin="400 400">
    <!-- Atmospheric Corona Disc -->
    <circle cx="400" cy="400" r="390" fill="url(#sunCenterGrad)" opacity="0.35" />

    <!-- 16 MAJOR SOLAR RAYS (Every 22.5 deg) -->
    <g id="major_rays_group">
      <use href="#master_major_ray" />
      <use href="#master_major_ray" transform="rotate(22.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(45 400 400)" />
      <use href="#master_major_ray" transform="rotate(67.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(90 400 400)" />
      <use href="#master_major_ray" transform="rotate(112.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(135 400 400)" />
      <use href="#master_major_ray" transform="rotate(157.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(180 400 400)" />
      <use href="#master_major_ray" transform="rotate(202.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(225 400 400)" />
      <use href="#master_major_ray" transform="rotate(247.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(270 400 400)" />
      <use href="#master_major_ray" transform="rotate(292.5 400 400)" />
      <use href="#master_major_ray" transform="rotate(315 400 400)" />
      <use href="#master_major_ray" transform="rotate(337.5 400 400)" />
    </g>

    <!-- 16 INTERLEAVED MINOR FLAME RAYS (Offset by 11.25 deg) -->
    <g id="minor_rays_group" opacity="0.85">
      <use href="#master_minor_ray" transform="rotate(11.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(33.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(56.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(78.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(101.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(123.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(146.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(168.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(191.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(213.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(236.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(258.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(281.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(303.75 400 400)" />
      <use href="#master_minor_ray" transform="rotate(326.25 400 400)" />
      <use href="#master_minor_ray" transform="rotate(348.75 400 400)" />
    </g>

    <!-- ORNAMENTAL INNER RING (Folk Petals) -->
    <g id="inner_petals" fill="#f59e0b" stroke="#78350f" stroke-width="2">
      <circle cx="400" cy="400" r="145" fill="none" stroke="#fbbf24" stroke-width="4" />
      <circle cx="400" cy="400" r="125" fill="#451a03" stroke="#fef08a" stroke-width="2" />
    </g>

    <!-- GLOWING LUMINOUS SOLAR CORE -->
    <circle id="sunburst_core" cx="400" cy="400" r="95" fill="url(#sunCenterGrad)" />
    <circle cx="400" cy="400" r="45" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
