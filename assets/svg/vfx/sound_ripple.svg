<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" id="vfx_sound_ripple">
  <defs>
    <radialGradient id="rippleCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rippleRingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="rippleRingGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- MASTER RIPPLE CONTAINER -->
  <g id="sound_ripple_group" transform-origin="540 540">
    <!-- Center Epicenter Glow -->
    <circle id="ripple_center_pulse" cx="540" cy="540" r="75" fill="url(#rippleCenterGrad)" />
    <circle cx="540" cy="540" r="28" fill="#ffffff" />

    <!-- RING 1: Core Harmonic Shockwave -->
    <circle id="ripple_ring_1" cx="540" cy="540" r="130" fill="none" stroke="url(#rippleRingGrad1)" stroke-width="5" opacity="0.95" />
    <!-- Subtle Inner Petal Markers -->
    <g id="ripple_ring_1_markers" stroke="#fef08a" stroke-width="2">
      <line x1="540" y1="395" x2="540" y2="420" />
      <line x1="540" y1="660" x2="540" y2="685" />
      <line x1="395" y1="540" x2="420" y2="540" />
      <line x1="660" y1="540" x2="685" y2="540" />
    </g>

    <!-- RING 2: Middle Rhythmic Acoustic Wave -->
    <circle id="ripple_ring_2" cx="540" cy="540" r="250" fill="none" stroke="url(#rippleRingGrad2)" stroke-width="4" stroke-dasharray="24 12 8 12" opacity="0.85" />

    <!-- RING 3: Outer Resonance Wave -->
    <circle id="ripple_ring_3" cx="540" cy="540" r="380" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="40 18" opacity="0.65" />

    <!-- RING 4: Ambient Dissipation Perimeter -->
    <circle id="ripple_ring_4" cx="540" cy="540" r="500" fill="none" stroke="#d97706" stroke-width="2" opacity="0.4" />

    <!-- RADIATING HARMONIC WHISKER ARCS -->
    <g id="harmonic_whiskers" stroke="#fef08a" stroke-width="1.5" opacity="0.75">
      <!-- 45-degree diagonal shockwave nodes -->
      <circle cx="632" cy="448" r="4" fill="#ffffff" />
      <circle cx="448" cy="448" r="4" fill="#ffffff" />
      <circle cx="448" cy="632" r="4" fill="#ffffff" />
      <circle cx="632" cy="632" r="4" fill="#ffffff" />

      <!-- Major Axis Concentric Beaded Points -->
      <circle cx="540" cy="290" r="3" fill="#fef08a" />
      <circle cx="540" cy="790" r="3" fill="#fef08a" />
      <circle cx="290" cy="540" r="3" fill="#fef08a" />
      <circle cx="790" cy="540" r="3" fill="#fef08a" />
    </g>
  </g>
</svg>
