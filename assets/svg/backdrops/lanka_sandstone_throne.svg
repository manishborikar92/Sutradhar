<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="lanka_fullbleed_svg">
  <defs>
    <!-- Warm Royal Twilight Sky (Midnight Obsidian to Sandstone Amber) -->
    <linearGradient id="lanka_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="35%" stop-color="#0b1a30"/>
      <stop offset="65%" stop-color="#142846"/>
      <stop offset="85%" stop-color="#3d352a"/>
      <stop offset="100%" stop-color="#7c4a1e"/>
    </linearGradient>

    <!-- Golden Sandstone Palace Gradient -->
    <linearGradient id="sandstone_palace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Warm Glowing Window Light -->
    <linearGradient id="window_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Reflective Golden Courtyard Water Gradient -->
    <linearGradient id="courtyard_water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="30%" stop-color="#0a2240"/>
      <stop offset="65%" stop-color="#07162c"/>
      <stop offset="100%" stop-color="#030b18"/>
    </linearGradient>

    <!-- Carved Sandstone Pillar Gradient -->
    <linearGradient id="pillar_stone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Brass Diya Metal -->
    <linearGradient id="brass_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#ca8a04"/>
      <stop offset="85%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3b1c02"/>
    </linearGradient>

    <!-- Diya Flame Glow -->
    <radialGradient id="diya_flame" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1080" height="1920" fill="url(#lanka_sky)"/>

  <!-- DISTANT GOLDEN MOUNTAIN RIDGES & CLIFFS OF LANKA -->
  <g id="lanka_mountains">
    <path d="M 0 780 L 140 680 L 320 740 L 480 640 L 680 720 L 890 620 L 1080 710 L 1080 1400 L 0 1400 Z" fill="#141c2b" opacity="0.85"/>
    <path d="M 0 880 L 180 790 L 420 850 L 620 760 L 840 830 L 1080 750 L 1080 1400 L 0 1400 Z" fill="#0d131f"/>
  </g>

  <!-- GOLDEN CITADEL & SPIRES (Swarna Lanka Architecture) -->
  <g id="citadel_spires" transform="translate(0, 150)">
    <!-- Central Tower (Vimana) -->
    <polygon points="540,320 460,780 620,780" fill="url(#sandstone_palace)"/>
    <polygon points="540,320 460,780 540,780" fill="#78350f" opacity="0.5"/>
    <polygon points="540,240 525,320 555,320" fill="url(#brass_metal)"/>
    <circle cx="540" cy="235" r="7" fill="url(#brass_metal)"/>

    <!-- Left Flanking Spires -->
    <polygon points="340,420 280,820 400,820" fill="url(#sandstone_palace)"/>
    <polygon points="340,420 280,820 340,820" fill="#78350f" opacity="0.5"/>
    <polygon points="340,360 330,420 350,420" fill="url(#brass_metal)"/>

    <polygon points="200,510 150,860 250,860" fill="url(#sandstone_palace)"/>
    <polygon points="200,510 150,860 200,860" fill="#78350f" opacity="0.5"/>

    <!-- Right Flanking Spires -->
    <polygon points="740,420 680,820 800,820" fill="url(#sandstone_palace)"/>
    <polygon points="740,420 680,820 740,820" fill="#78350f" opacity="0.5"/>
    <polygon points="740,360 730,420 750,420" fill="url(#brass_metal)"/>

    <polygon points="880,510 830,860 930,860" fill="url(#sandstone_palace)"/>
    <polygon points="880,510 830,860 880,860" fill="#78350f" opacity="0.5"/>

    <!-- Citadel Walls & Tiered Battlement Corridors -->
    <rect x="180" y="740" width="720" height="240" fill="url(#sandstone_palace)" stroke="#2b0e03" stroke-width="4"/>
    <!-- Ornate Jharokha Arched Glowing Windows -->
    <g id="citadel_windows">
      <path d="M 280 820 Q 310 770 340 820 L 340 870 L 280 870 Z" fill="url(#window_glow)"/>
      <path d="M 510 790 Q 540 730 570 790 L 570 850 L 510 850 Z" fill="url(#window_glow)"/>
      <path d="M 740 820 Q 770 770 800 820 L 800 870 L 740 870 Z" fill="url(#window_glow)"/>
      <!-- Lower Row of Windows -->
      <path d="M 390 910 Q 415 875 440 910 L 440 945 L 390 945 Z" fill="url(#window_glow)"/>
      <path d="M 640 910 Q 665 875 690 910 L 690 945 L 640 945 Z" fill="url(#window_glow)"/>
    </g>

    <!-- Massive Lower Bastion Wall with Stepped Cornice -->
    <path d="M 60 960 L 1020 960 L 1050 1180 L 30 1180 Z" fill="#451a03" stroke="#1c0701" stroke-width="5"/>
    <line x1="60" y1="990" x2="1020" y2="990" stroke="#f59e0b" stroke-width="6"/>
    <line x1="45" y1="1040" x2="1035" y2="1040" stroke="#b45309" stroke-width="4"/>
  </g>

  <!-- LOWER THIRD: REFLECTIVE GOLDEN COURTYARD WATERS (Defect 5 Fix: Eliminates 50% Black Void) -->
  <g id="courtyard_waters">
    <rect x="0" y="1280" width="1080" height="640" fill="url(#courtyard_water)"/>
    <!-- Water Ripples with Golden Light Reflections -->
    <g stroke="url(#window_glow)" stroke-width="2" opacity="0.65" stroke-linecap="round">
      <line x1="480" y1="1340" x2="600" y2="1340"/>
      <line x1="420" y1="1380" x2="660" y2="1380" stroke-width="3"/>
      <line x1="360" y1="1430" x2="720" y2="1430" stroke-width="2.5"/>
      <line x1="260" y1="1490" x2="820" y2="1490" stroke-width="3.5"/>
      <line x1="180" y1="1560" x2="900" y2="1560" stroke-width="3"/>
      <line x1="120" y1="1640" x2="960" y2="1640" stroke-width="4"/>
      <line x1="80" y1="1730" x2="1000" y2="1730" stroke-width="3.5"/>
      <line x1="40" y1="1820" x2="1040" y2="1820" stroke-width="4.5"/>
    </g>
    <!-- Stepped Sandstone Courtyard Terrace Border -->
    <rect x="0" y="1280" width="1080" height="30" fill="url(#sandstone_palace)" stroke="#2b0e03" stroke-width="3"/>
  </g>

  <!-- THEATRICAL FOREGROUND: CARVED FLUTED SANDSTONE PILLARS (Framing Shot 1 & 2) -->
  <g id="theatrical_pillars">
    <!-- Left Sandstone Pillar -->
    <g id="pillar_left">
      <!-- Base Plinth -->
      <path d="M 0 1780 L 180 1780 L 160 1920 L 0 1920 Z" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="4"/>
      <!-- Fluted Column Shaft -->
      <rect x="20" y="120" width="130" height="1660" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="3"/>
      <!-- Vertical Fluting Grooves -->
      <line x1="45" y1="140" x2="45" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <line x1="65" y1="140" x2="65" y2="1760" stroke="#fef08a" stroke-width="2.5"/>
      <line x1="85" y1="140" x2="85" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <line x1="105" y1="140" x2="105" y2="1760" stroke="#fef08a" stroke-width="2.5"/>
      <line x1="125" y1="140" x2="125" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <!-- Ornate Capital at Top -->
      <path d="M 0 120 L 170 120 L 195 40 L -10 40 Z" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="4"/>
    </g>

    <!-- Right Sandstone Pillar -->
    <g id="pillar_right">
      <!-- Base Plinth -->
      <path d="M 900 1780 L 1080 1780 L 1080 1920 L 920 1920 Z" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="4"/>
      <!-- Fluted Column Shaft -->
      <rect x="930" y="120" width="130" height="1660" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="3"/>
      <!-- Vertical Fluting Grooves -->
      <line x1="955" y1="140" x2="955" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <line x1="975" y1="140" x2="975" y2="1760" stroke="#fef08a" stroke-width="2.5"/>
      <line x1="995" y1="140" x2="995" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <line x1="1015" y1="140" x2="1015" y2="1760" stroke="#fef08a" stroke-width="2.5"/>
      <line x1="1035" y1="140" x2="1035" y2="1760" stroke="#451a03" stroke-width="3.5"/>
      <!-- Ornate Capital at Top -->
      <path d="M 910 120 L 1080 120 L 1090 40 L 885 40 Z" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="4"/>
    </g>

    <!-- TOP ARCH & DRAPED MARIGOLD TORAN GARLANDS -->
    <g id="marigold_toran">
      <!-- Sandstone Arch Cornice -->
      <path d="M 0 40 L 1080 40 L 1080 0 L 0 0 Z" fill="url(#pillar_stone)" stroke="#2b0e03" stroke-width="4"/>
      <!-- Draped Floral Catenary Swags -->
      <path d="M 120 70 Q 320 160 540 85 Q 760 160 960 70" fill="none" stroke="#ca8a04" stroke-width="6"/>
      <!-- Secondary Swag -->
      <path d="M 120 95 Q 320 205 540 120 Q 760 205 960 95" fill="none" stroke="#ea580c" stroke-width="5"/>
      
      <!-- Alternating Orange & Gold Marigold Blossoms -->
      <g id="blossoms">
        <!-- Main Swag 1 Blossoms -->
        <circle cx="160" cy="85" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="210" cy="110" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="260" cy="130" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="310" cy="142" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="360" cy="145" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="410" cy="138" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="460" cy="122" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="510" cy="98" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="540" cy="88" r="17" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
        <circle cx="570" cy="98" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="620" cy="122" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="670" cy="138" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="720" cy="145" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="770" cy="142" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="820" cy="130" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <circle cx="870" cy="110" r="14" fill="#ea580c" stroke="#78350f" stroke-width="2"/>
        <circle cx="920" cy="85" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
      </g>
    </g>

    <!-- BRASS HANGING DIYA OIL LAMPS (Left & Right Flanks) -->
    <g id="diyas">
      <!-- Left Hanging Diya -->
      <g id="diya_left" transform="translate(190, 780)">
        <line x1="0" y1="-700" x2="0" y2="0" stroke="url(#brass_metal)" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="42" ry="16" fill="url(#brass_metal)" stroke="#3b1c02" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="#991b1b"/>
        <!-- Golden Diya Flame -->
        <path d="M -8 -8 Q 0 -45 0 -55 Q 0 -45 8 -8 Q 0 4 -8 -8 Z" fill="url(#diya_flame)"/>
        <circle cx="0" cy="-22" r="35" fill="url(#diya_flame)" opacity="0.45"/>
      </g>

      <!-- Right Hanging Diya -->
      <g id="diya_right" transform="translate(890, 780)">
        <line x1="0" y1="-700" x2="0" y2="0" stroke="url(#brass_metal)" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="42" ry="16" fill="url(#brass_metal)" stroke="#3b1c02" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="#991b1b"/>
        <!-- Golden Diya Flame -->
        <path d="M -8 -8 Q 0 -45 0 -55 Q 0 -45 8 -8 Q 0 4 -8 -8 Z" fill="url(#diya_flame)"/>
        <circle cx="0" cy="-22" r="35" fill="url(#diya_flame)" opacity="0.45"/>
      </g>
    </g>
  </g>
</svg>