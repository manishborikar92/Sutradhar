<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="celestial_cosmos_court">
  <defs>
    <!-- Deep Midnight Cosmos Gradient -->
    <linearGradient id="cosmos_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="35%" stop-color="#0c0e1f"/>
      <stop offset="70%" stop-color="#141830"/>
      <stop offset="100%" stop-color="#1e1838"/>
    </linearGradient>

    <!-- Warm Golden Stellar Dust -->
    <radialGradient id="nebula_glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#b88614" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#4d2266" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Imperial Gold Arch Gradients -->
    <linearGradient id="arch_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="30%" stop-color="#e6b839"/>
      <stop offset="70%" stop-color="#997014"/>
      <stop offset="100%" stop-color="#422e00"/>
    </linearGradient>

    <!-- Dark Celestial Sandstone -->
    <linearGradient id="celestial_stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2842"/>
      <stop offset="50%" stop-color="#1c182b"/>
      <stop offset="100%" stop-color="#0c0a14"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: DEEP COSMIC SKY (#bg_sky) -->
  <g id="bg_sky">
    <rect width="1080" height="1920" fill="url(#cosmos_sky)"/>
    <rect width="1080" height="1920" fill="url(#nebula_glow)"/>

    <!-- Constellation Stars & Nodes -->
    <g id="stars_field" fill="#fff9db">
      <circle cx="140" cy="220" r="2.5" opacity="0.8"/>
      <circle cx="280" cy="180" r="3.5" opacity="0.9"/>
      <circle cx="390" cy="260" r="2" opacity="0.6"/>
      <circle cx="540" cy="140" r="4" opacity="0.95"/>
      <circle cx="680" cy="210" r="2.5" opacity="0.7"/>
      <circle cx="820" cy="160" r="3" opacity="0.85"/>
      <circle cx="940" cy="240" r="2" opacity="0.6"/>

      <circle cx="210" cy="380" r="3" opacity="0.8"/>
      <circle cx="340" cy="460" r="2.5" opacity="0.7"/>
      <circle cx="510" cy="420" r="4.5" opacity="1"/>
      <circle cx="730" cy="480" r="2" opacity="0.6"/>
      <circle cx="870" cy="390" r="3.5" opacity="0.85"/>

      <!-- Constellation Link Lines -->
      <polyline points="140,220 280,180 390,260 540,140 680,210 820,160 940,240" 
                stroke="#ffe699" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" fill="none"/>
      <polyline points="210,380 340,460 510,420 730,480 870,390" 
                stroke="#ffe699" stroke-width="1" stroke-dasharray="4 6" opacity="0.35" fill="none"/>
      <line x1="280" y1="180" x2="210" y2="380" stroke="#ffe699" stroke-width="0.8" opacity="0.3"/>
      <line x1="540" y1="140" x2="510" y2="420" stroke="#ffe699" stroke-width="1.2" opacity="0.45"/>
      <line x1="820" y1="160" x2="870" y2="390" stroke="#ffe699" stroke-width="0.8" opacity="0.3"/>
    </g>
  </g>

  <!-- LAYER 2: FAR CELESTIAL ASTROLABE RINGS (#bg_far) -->
  <g id="bg_far" transform="translate(540, 680)">
    <!-- Monumental Celestial Armillary Spheres -->
    <circle cx="0" cy="0" r="460" fill="none" stroke="url(#arch_gold)" stroke-width="3" stroke-dasharray="16 12" opacity="0.4"/>
    <circle cx="0" cy="0" r="380" fill="none" stroke="url(#arch_gold)" stroke-width="4" opacity="0.55"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#ffe699" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#arch_gold)" stroke-width="3" opacity="0.45"/>

    <!-- Orbital Cardinal Axes -->
    <line x1="-480" y1="0" x2="480" y2="0" stroke="url(#arch_gold)" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="-480" x2="0" y2="480" stroke="url(#arch_gold)" stroke-width="2" opacity="0.4"/>
    <line x1="-340" y1="-340" x2="340" y2="340" stroke="url(#arch_gold)" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.3"/>
    <line x1="-340" y1="340" x2="340" y2="-340" stroke="url(#arch_gold)" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.3"/>

    <!-- Planetary Orbs -->
    <circle cx="-270" cy="-270" r="16" fill="url(#arch_gold)" stroke="#fff5cc" stroke-width="2" opacity="0.85"/>
    <circle cx="270" cy="270" r="12" fill="#ffd56b" opacity="0.8"/>
    <circle cx="300" cy="0" r="14" fill="url(#arch_gold)" opacity="0.85"/>
    <circle cx="-380" cy="0" r="20" fill="#4d2266" stroke="url(#arch_gold)" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- LAYER 3: MIDGROUND COLONNADES & ARCHWAY (#bg_mid) -->
  <g id="bg_mid">
    <!-- Grand Cosmic Court Archway -->
    <path d="M 120 1920 L 120 850 Q 540 460 960 850 L 960 1920" fill="none" stroke="url(#celestial_stone)" stroke-width="64"/>
    <path d="M 150 1920 L 150 870 Q 540 500 930 870 L 930 1920" fill="none" stroke="url(#arch_gold)" stroke-width="8" opacity="0.75"/>
    <!-- Carved Arch Medallions -->
    <circle cx="540" cy="490" r="42" fill="url(#celestial_stone)" stroke="url(#arch_gold)" stroke-width="5"/>
    <circle cx="540" cy="490" r="16" fill="#ffd56b"/>
  </g>

  <!-- LAYER 4: NEAR COURT BALUSTRADE & PILLARS (#bg_near) -->
  <g id="bg_near">
    <!-- Left Column Base & Capital -->
    <rect x="0" y="700" width="160" height="1220" fill="url(#celestial_stone)" stroke="#05060f" stroke-width="4"/>
    <rect x="-10" y="760" width="180" height="30" fill="url(#arch_gold)" opacity="0.8"/>
    <rect x="-10" y="1600" width="180" height="40" fill="url(#arch_gold)" opacity="0.8"/>

    <!-- Right Column Base & Capital -->
    <rect x="920" y="700" width="160" height="1220" fill="url(#celestial_stone)" stroke="#05060f" stroke-width="4"/>
    <rect x="910" y="760" width="180" height="30" fill="url(#arch_gold)" opacity="0.8"/>
    <rect x="910" y="1600" width="180" height="40" fill="url(#arch_gold)" opacity="0.8"/>

    <!-- Court Pavement Base with carved lotus motif -->
    <rect x="0" y="1680" width="1080" height="240" fill="#0c0a14" stroke="url(#arch_gold)" stroke-width="6"/>
    <path d="M 0 1720 L 1080 1720" stroke="url(#arch_gold)" stroke-width="3" opacity="0.6"/>
    <!-- Central Stage Inlay -->
    <ellipse cx="540" cy="1800" rx="360" ry="80" fill="none" stroke="url(#arch_gold)" stroke-width="4" stroke-dasharray="14 10" opacity="0.7"/>
    <ellipse cx="540" cy="1800" rx="200" ry="45" fill="none" stroke="#ffe699" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
