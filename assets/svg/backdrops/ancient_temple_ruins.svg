<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Deep Sanctuary Twilight Gradient -->
    <linearGradient id="sanctuary_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="35%" stop-color="#0A0E18" />
      <stop offset="70%" stop-color="#141B2B" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <!-- Celestial Aperture Light Shafts -->
    <linearGradient id="temple_sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#E5B869" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#E5B869" stop-opacity="0" />
    </linearGradient>

    <!-- Stone Pillar Textures -->
    <linearGradient id="pillar_stone_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="30%" stop-color="#0F1420" />
      <stop offset="70%" stop-color="#090C14" />
      <stop offset="100%" stop-color="#1F283D" />
    </linearGradient>

    <filter id="temple-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Distant Sanctuary Sky & Stars -->
  <g id="bg_far_sky">
    <rect width="1080" height="1920" fill="url(#sanctuary_sky)" />
    <!-- Distant Celestial Constellations -->
    <g opacity="0.8">
      <circle cx="210" cy="180" r="1.5" fill="#FFF4DC" />
      <circle cx="430" cy="120" r="2.2" fill="#E5B869" />
      <circle cx="680" cy="150" r="1.8" fill="#FFF4DC" />
      <circle cx="890" cy="190" r="2.4" fill="#E5B869" />
      <circle cx="540" cy="240" r="1.4" fill="#FFF4DC" />
    </g>
  </g>

  <!-- Layer 2: Celestial Ray Apertures & Floating Sacred Geometry -->
  <g id="bg_mid_architecture">
    <!-- Center Celestial Portal Glow -->
    <circle cx="540" cy="650" r="320" fill="#E5B869" opacity="0.12" filter="url(#temple-bloom)" />

    <!-- Angled Volumetric Beams Streaming From High Apertures -->
    <polygon points="280,0 440,0 720,1350 480,1350" fill="url(#temple_sunbeam)" />
    <polygon points="800,0 960,0 1080,1100 900,1100" fill="url(#temple_sunbeam)" opacity="0.6" />
    <polygon points="120,0 220,0 420,1100 280,1100" fill="url(#temple_sunbeam)" opacity="0.6" />

    <!-- Floating Sacred Geometry Mandalas -->
    <g transform="translate(540, 650)">
      <circle cx="0" cy="0" r="180" fill="none" stroke="#E5B869" stroke-width="2" stroke-dasharray="14 8" opacity="0.45" />
      <circle cx="0" cy="0" r="120" fill="none" stroke="#FFF4DC" stroke-width="1.5" opacity="0.6" />
      <!-- Star Octagram -->
      <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85" fill="none" stroke="#E5B869" stroke-width="1.8" opacity="0.4" />
      <polygon points="-85,-85 0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0" fill="none" stroke="#E5B869" stroke-width="1.8" opacity="0.4" transform="rotate(22.5)" />
    </g>

    <!-- Monumental Distant Sanctuary Arch -->
    <path d="M 340,1150 L 340,700 Q 540,550 740,700 L 740,1150 Z" fill="#080C14" stroke="#E5B869" stroke-width="2" />
    <path d="M 380,1150 L 380,720 Q 540,590 700,720 L 700,1150 Z" fill="none" stroke="#E5B869" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  </g>

  <!-- Layer 3: Foreground Colossal Monolithic Pillars & Steps -->
  <g id="bg_fg_pillars">
    <!-- Far Left Colossal Pillar -->
    <rect x="20" y="450" width="160" height="1100" fill="url(#pillar_stone_grad)" stroke="#E5B869" stroke-width="1.5" />
    <rect x="0" y="420" width="200" height="40" fill="#141B28" stroke="#E5B869" stroke-width="2" />
    <!-- Pillar Fluting Lines -->
    <line x1="60" y1="460" x2="60" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />
    <line x1="100" y1="460" x2="100" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />
    <line x1="140" y1="460" x2="140" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />

    <!-- Far Right Colossal Pillar -->
    <rect x="900" y="450" width="160" height="1100" fill="url(#pillar_stone_grad)" stroke="#E5B869" stroke-width="1.5" />
    <rect x="880" y="420" width="200" height="40" fill="#141B28" stroke="#E5B869" stroke-width="2" />
    <line x1="940" y1="460" x2="940" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />
    <line x1="980" y1="460" x2="980" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />
    <line x1="1020" y1="460" x2="1020" y2="1550" stroke="#E5B869" stroke-width="1.2" opacity="0.4" />

    <!-- Monumental Courtyard Steps -->
    <polygon points="0,1350 1080,1350 1080,1410 0,1410" fill="#0D121D" stroke="#E5B869" stroke-width="1.5" />
    <polygon points="0,1410 1080,1410 1080,1480 0,1480" fill="#090D15" stroke="#E5B869" stroke-width="1.5" />
    <polygon points="0,1480 1080,1480 1080,1560 0,1560" fill="#06090E" stroke="#E5B869" stroke-width="1.5" />

    <!-- Bottom Action Safe Grounding -->
    <rect x="0" y="1500" width="1080" height="420" fill="#07090F" opacity="0.95" />
  </g>
</svg>
