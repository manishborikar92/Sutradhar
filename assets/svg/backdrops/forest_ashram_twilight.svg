<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="forest_ashram_twilight">
  <defs>
    <!-- Twilight Amber Sky Gradient -->
    <linearGradient id="twilight_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0a1a"/>
      <stop offset="35%" stop-color="#3b1226"/>
      <stop offset="70%" stop-color="#8c2e1f"/>
      <stop offset="100%" stop-color="#e66a20"/>
    </linearGradient>

    <!-- Deep Ancient Wood & Foliage Silhouette -->
    <linearGradient id="banyan_bark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24140a"/>
      <stop offset="50%" stop-color="#140b05"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>

    <!-- Sacred Havan Kund Fire Glow -->
    <radialGradient id="havan_fire_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#ff9900"/>
      <stop offset="65%" stop-color="#cc2900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4d0f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: TWILIGHT SKY & DISTANT MOUNTAIN RIDGES (#bg_sky) -->
  <g id="bg_sky">
    <rect width="1080" height="1920" fill="url(#twilight_sky)"/>
    <!-- Distant Forest Ridges in Mist -->
    <path d="M 0 1200 Q 220 1050 450 1120 Q 720 1020 1080 1150 L 1080 1500 L 0 1500 Z" fill="#30101c" opacity="0.6"/>
    <path d="M 0 1320 Q 300 1200 600 1280 Q 850 1180 1080 1260 L 1080 1600 L 0 1600 Z" fill="#210a12" opacity="0.8"/>
  </g>

  <!-- LAYER 2: FAR DENSE CANOPY & SILHOUETTED ASHRAM KUTIR (#bg_far) -->
  <g id="bg_far">
    <!-- Thatched Hermitage Kutir (Hut) in distance -->
    <polygon points="540,1180 440,1260 640,1260" fill="#170c06"/>
    <rect x="460" y="1260" width="160" height="90" fill="#120804"/>
    <rect x="520" y="1290" width="40" height="60" fill="#2b1408"/>
    <!-- Distant Banyan Foliage Clusters -->
    <circle cx="280" cy="980" r="140" fill="#170c06" opacity="0.9"/>
    <circle cx="820" cy="950" r="160" fill="#170c06" opacity="0.9"/>
  </g>

  <!-- LAYER 3: MIDGROUND SACRED BANYAN TREE & HANGING AERIAL ROOTS (#bg_mid) -->
  <g id="bg_mid">
    <!-- Monumental Ancient Banyan Tree Left -->
    <path d="M -50 0 L 120 0 Q 150 400 80 800 Q 180 1200 0 1920 L -50 1920 Z" fill="url(#banyan_bark)"/>
    <!-- Monumental Ancient Banyan Tree Right -->
    <path d="M 1130 0 L 960 0 Q 930 400 1000 800 Q 900 1200 1080 1920 L 1130 1920 Z" fill="url(#banyan_bark)"/>

    <!-- Overhanging Canopy Arching across top -->
    <path d="M 0 0 Q 540 240 1080 0 L 1080 320 Q 540 520 0 320 Z" fill="#120804"/>

    <!-- Hanging Aerial Roots (Prop Roots) -->
    <path d="M 220 320 Q 200 700 230 1400" stroke="#1c0f07" stroke-width="8" fill="none"/>
    <path d="M 280 340 Q 290 800 270 1350" stroke="#140b05" stroke-width="6" fill="none"/>
    <path d="M 340 360 Q 320 750 350 1250" stroke="#1c0f07" stroke-width="5" fill="none"/>

    <path d="M 860 320 Q 880 700 850 1400" stroke="#1c0f07" stroke-width="8" fill="none"/>
    <path d="M 800 340 Q 790 800 810 1350" stroke="#140b05" stroke-width="6" fill="none"/>
    <path d="M 740 360 Q 760 750 730 1250" stroke="#1c0f07" stroke-width="5" fill="none"/>
  </g>

  <!-- LAYER 4: NEAR ASHRAM GROUND & SACRED HAVAN KUND (#bg_near) -->
  <g id="bg_near">
    <!-- Forest Ashram Soil Ground -->
    <rect x="0" y="1580" width="1080" height="340" fill="#120804" stroke="#4a250f" stroke-width="4"/>

    <!-- Sacred Vedic Havan Kund (Fire Pit) Base -->
    <g id="havan_kund" transform="translate(540, 1720)">
      <!-- Tiered Stepped Terracotta Pit -->
      <polygon points="-180,90 180,90 150,30 -150,30" fill="#4d1f08" stroke="#1a0a03" stroke-width="3"/>
      <polygon points="-150,30 150,30 120,-20 -120,-20" fill="#6e2d0c" stroke="#2e1104" stroke-width="3"/>
      <!-- Sandalwood Logs in Fire -->
      <line x1="-70" y1="-10" x2="60" y2="-30" stroke="#240f04" stroke-width="12" stroke-linecap="round"/>
      <line x1="-50" y1="-30" x2="70" y2="-10" stroke="#240f04" stroke-width="12" stroke-linecap="round"/>

      <!-- Radiant Fire Aura -->
      <circle cx="0" cy="-60" r="160" fill="url(#havan_fire_glow)"/>

      <!-- Stylized Theatrical Fire Flames -->
      <path d="M -45 -25 Q -60 -110 0 -160 Q 60 -110 45 -25 Q 20 -40 0 -25 Q -20 -40 -45 -25 Z" fill="#ff4d00"/>
      <path d="M -30 -25 Q -40 -95 0 -135 Q 40 -95 30 -25 Q 15 -35 0 -25 Q -15 -35 -30 -25 Z" fill="#ffb700"/>
      <path d="M -15 -25 Q -20 -80 0 -110 Q 20 -80 15 -25 Z" fill="#fff5cc"/>
    </g>
  </g>
</svg>
