<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Deep Space Sky Gradient: Obsidian to Deep Indigo -->
    <linearGradient id="cosmos_void" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060A" />
      <stop offset="35%" stop-color="#0B0F19" />
      <stop offset="70%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Volumetric Event Horizon Accretion Halo -->
    <radialGradient id="accretion_core_glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.85" />
      <stop offset="12%" stop-color="#E5B869" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#C84B31" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#1E1638" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Beam Gradients -->
    <linearGradient id="volumetric_beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B869" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#E5B869" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#E5B869" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Spacetime Curvature Grid Pattern -->
    <pattern id="spacetime_grid_pat" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M 90,0 L 0,0 0,90" fill="none" stroke="#E5B869" stroke-width="0.75" opacity="0.12" />
    </pattern>

    <filter id="core-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Base Void & Distant Starfield -->
  <g id="bg_far_sky">
    <rect width="1080" height="1920" fill="url(#cosmos_void)" />

    <!-- Subtle Spacetime Curvature Grid -->
    <rect width="1080" height="1920" fill="url(#spacetime_grid_pat)" opacity="0.7" />

    <!-- Distant Bokeh Starfield (Ivory & Burnished Gold) -->
    <g opacity="0.85">
      <circle cx="110" cy="140" r="1.5" fill="#FFF4DC" />
      <circle cx="280" cy="290" r="2.2" fill="#E5B869" />
      <circle cx="490" cy="90" r="1.2" fill="#FFF4DC" />
      <circle cx="720" cy="180" r="2.5" fill="#E5B869" />
      <circle cx="910" cy="130" r="1.8" fill="#FFF4DC" />
      <circle cx="980" cy="340" r="1.4" fill="#E5B869" />
      <circle cx="160" cy="550" r="2.0" fill="#FFF4DC" />
      <circle cx="860" cy="620" r="1.6" fill="#E5B869" />
      <circle cx="230" cy="850" r="1.8" fill="#FFF4DC" />
      <circle cx="890" cy="980" r="2.2" fill="#E5B869" />
      <circle cx="120" cy="1250" r="1.4" fill="#FFF4DC" />
      <circle cx="780" cy="1380" r="2.4" fill="#E5B869" />
      <circle cx="310" cy="1620" r="1.2" fill="#FFF4DC" />
      <circle cx="850" cy="1710" r="1.8" fill="#E5B869" />
    </g>
  </g>

  <!-- Layer 2: Volumetric Light Shafts & Cosmic Accretion Core -->
  <g id="bg_mid_architecture">
    <!-- Center Accretion Radiance -->
    <circle cx="540" cy="800" r="480" fill="url(#accretion_core_glow)" filter="url(#core-bloom)" />

    <!-- Volumetric Light Shafts Streaming Across Spacetime -->
    <polygon points="540,800 0,200 120,0" fill="url(#volumetric_beam)" />
    <polygon points="540,800 960,0 1080,220" fill="url(#volumetric_beam)" />
    <polygon points="540,800 1080,1100 1080,1400" fill="url(#volumetric_beam)" opacity="0.6" />
    <polygon points="540,800 0,1400 0,1100" fill="url(#volumetric_beam)" opacity="0.6" />

    <!-- Relativistic Warped Photons Ring -->
    <ellipse cx="540" cy="800" rx="380" ry="110" fill="none" stroke="#E5B869" stroke-width="2.5" stroke-dasharray="16 10" opacity="0.55" transform="rotate(-15 540 800)" filter="url(#core-bloom)" />
    <ellipse cx="540" cy="800" rx="260" ry="75" fill="none" stroke="#FFF8E7" stroke-width="3" opacity="0.75" transform="rotate(-15 540 800)" />
  </g>

  <!-- Layer 3: Foreground Celestial Dust Monoliths & Cinematic Framing -->
  <g id="bg_fg_pillars">
    <!-- Curving Horizon Silhouette Strata -->
    <path d="M 0,1350 Q 540,1450 1080,1350 L 1080,1920 L 0,1920 Z" fill="#07090F" opacity="0.95" />
    <path d="M 0,1350 Q 540,1450 1080,1350" fill="none" stroke="#E5B869" stroke-width="1.5" opacity="0.4" />

    <!-- Left & Right Vignette Silhouettes -->
    <path d="M 0,700 Q 180,1050 80,1500 L 0,1500 Z" fill="#04060A" opacity="0.7" />
    <path d="M 1080,680 Q 900,1020 1000,1500 L 1080,1500 Z" fill="#04060A" opacity="0.7" />

    <!-- Bottom Action Safe Grounding Shadow -->
    <rect x="0" y="1500" width="1080" height="420" fill="#07090F" opacity="0.92" />
  </g>
</svg>
