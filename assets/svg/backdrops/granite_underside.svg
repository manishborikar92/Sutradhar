<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800" width="1080" height="800" id="granite_underside_svg">
  <defs>
    <!-- Dark Cosmic Granite Gradient -->
    <linearGradient id="granite_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Granite Chiseled Facet Lit -->
    <linearGradient id="granite_facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Contact Sparks Gradient -->
    <radialGradient id="spark_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- MASSIVE MOUNTAIN UNDERSIDE GRANITE BODY -->
  <g id="mountain_granite_mass">
    <!-- Base Overhead Mountain Mass -->
    <path d="M -40 -50 L 1120 -50 L 1120 480 L 1020 450 L 920 520 L 820 460 L 720 540 L 620 470 L 540 560 L 460 480 L 360 550 L 260 470 L 160 530 L 60 460 L -40 500 Z" fill="url(#granite_dark)" stroke="#020617" stroke-width="6"/>

    <!-- Sharp 3D Chiseled Facets -->
    <polygon points="160,530 260,470 210,320 110,380" fill="url(#granite_facet)"/>
    <polygon points="360,550 460,480 410,290 310,350" fill="url(#granite_facet)"/>
    <polygon points="540,560 620,470 580,260 500,310" fill="url(#granite_facet)"/>
    <polygon points="720,540 820,460 780,280 680,340" fill="url(#granite_facet)"/>
    <polygon points="920,520 1020,450 970,330 870,390" fill="url(#granite_facet)"/>

    <!-- Stepped Horizontal Strata Crevasses -->
    <path d="M 0 180 Q 540 220 1080 180 M 40 280 Q 540 330 1040 280 M 80 390 Q 540 440 1000 390" stroke="#0b1120" stroke-width="7" fill="none"/>
    <path d="M 0 183 Q 540 223 1080 183 M 40 283 Q 540 333 1040 283" stroke="#64748b" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Jagged Hanging Stalactites & Stone Teeth -->
    <polygon points="260,470 290,560 320,490" fill="#0f172a" stroke="#020617" stroke-width="2"/>
    <polygon points="460,480 490,590 520,510" fill="#0f172a" stroke="#020617" stroke-width="2"/>
    <polygon points="620,470 650,580 680,500" fill="#0f172a" stroke="#020617" stroke-width="2"/>
    <polygon points="820,460 850,550 880,480" fill="#0f172a" stroke="#020617" stroke-width="2"/>
  </g>

  <!-- CONTACT FRICTION SPARKS (Where Ravana's Bracing Arms Touch the Granite) -->
  <g id="contact_sparks" opacity="0.9">
    <!-- Left Hand Contact Region (x ~ 420, y ~ 530) -->
    <circle cx="420" cy="530" r="45" fill="url(#spark_glow)"/>
    <line x1="420" y1="530" x2="380" y2="580" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="530" x2="400" y2="610" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="420" y1="530" x2="450" y2="590" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="390" cy="590" r="3" fill="#fff"/>
    <circle cx="410" cy="620" r="2.5" fill="#fef08a"/>

    <!-- Right Hand Contact Region (x ~ 660, y ~ 530) -->
    <circle cx="660" cy="530" r="45" fill="url(#spark_glow)"/>
    <line x1="660" y1="530" x2="700" y2="580" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="660" y1="530" x2="680" y2="610" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="660" y1="530" x2="630" y2="590" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="690" cy="590" r="3" fill="#fff"/>
    <circle cx="670" cy="620" r="2.5" fill="#fef08a"/>
  </g>
</svg>