<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="ocean_sky_horizon">
  <defs>
    <!-- Dramatic Golden-Crimson Sunset Gradient -->
    <linearGradient id="ocean_sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f0515"/>
      <stop offset="30%" stop-color="#5c0d24"/>
      <stop offset="60%" stop-color="#a62420"/>
      <stop offset="85%" stop-color="#e65c00"/>
      <stop offset="100%" stop-color="#ffb733"/>
    </linearGradient>

    <!-- Deep Indian Ocean Indigo Waters -->
    <linearGradient id="ocean_deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="40%" stop-color="#0e1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <!-- Solar Disk & Golden Water Track -->
    <radialGradient id="sun_disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffeaa7"/>
      <stop offset="70%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: VAST SUNSET SKY & SOLAR GLOW (#bg_sky) -->
  <g id="bg_sky">
    <rect width="1080" height="1920" fill="url(#ocean_sunset)"/>

    <!-- Radiant Setting Sun on Horizon -->
    <circle cx="540" cy="1140" r="140" fill="url(#sun_disk)"/>
    <circle cx="540" cy="1140" r="60" fill="#fffdf0"/>

    <!-- Dramatic Cloud Strata -->
    <path d="M 0 520 Q 300 480 620 540 Q 880 500 1080 530 L 1080 610 Q 780 640 420 590 L 0 630 Z" fill="#380918" opacity="0.6"/>
    <path d="M 0 740 Q 380 690 740 760 Q 940 730 1080 750 L 1080 830 Q 700 850 320 800 L 0 840 Z" fill="#520e24" opacity="0.7"/>
    <path d="M 0 920 Q 240 880 560 930 Q 820 900 1080 940 L 1080 990 Q 640 1010 260 970 L 0 1000 Z" fill="#7a1c22" opacity="0.8"/>
  </g>

  <!-- LAYER 2: DISTANT COASTAL CLIFFS & HORIZON LINE (#bg_far) -->
  <g id="bg_far">
    <!-- Distant Misty Coastal Cliffs Left (e.g. Rameshwaram / Kumari promontory) -->
    <polygon points="0,1140 0,1020 180,1060 310,1110 380,1140" fill="#240c14"/>
    <!-- Distant Cliffs Right -->
    <polygon points="1080,1140 1080,1040 920,1070 810,1120 740,1140" fill="#240c14"/>

    <!-- Sharp Ocean Horizon -->
    <line x1="0" y1="1140" x2="1080" y2="1140" stroke="#ffb733" stroke-width="2"/>
  </g>

  <!-- LAYER 3: MIDGROUND ROLLING STYLIZED WAVES (#bg_mid) -->
  <g id="bg_mid">
    <rect x="0" y="1140" width="1080" height="780" fill="url(#ocean_deep)"/>

    <!-- Golden Sun Shimmer on Water -->
    <polygon points="540,1140 420,1920 660,1920" fill="url(#sun_disk)" opacity="0.25"/>

    <!-- Stylized Traditional Folk Wave Crests - Tier 1 (Far) -->
    <path d="M 0 1240 Q 90 1200 180 1240 Q 270 1200 360 1240 Q 450 1200 540 1240 Q 630 1200 720 1240 Q 810 1200 900 1240 Q 990 1200 1080 1240" 
          stroke="#ffb733" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Tier 2 (Mid) -->
    <path d="M 0 1380 Q 135 1320 270 1380 Q 405 1320 540 1380 Q 675 1320 810 1380 Q 945 1320 1080 1380" 
          stroke="#ffeaa7" stroke-width="4.5" fill="none" opacity="0.75"/>

    <!-- Tier 3 (Rolling Breaker) -->
    <path d="M 0 1540 Q 180 1460 360 1540 Q 540 1460 720 1540 Q 900 1460 1080 1540" 
          stroke="#fffdf5" stroke-width="6" fill="none" opacity="0.85"/>
  </g>

  <!-- LAYER 4: NEAR SURF & COASTAL ROCKS (#bg_near) -->
  <g id="bg_near">
    <!-- Massive Foreground Foaming Wave -->
    <path d="M 0 1720 Q 270 1620 540 1720 Q 810 1620 1080 1720 L 1080 1920 L 0 1920 Z" fill="#080c1a" opacity="0.95"/>
    <path d="M 0 1720 Q 270 1620 540 1720 Q 810 1620 1080 1720" stroke="#fffdf5" stroke-width="8" fill="none"/>

    <!-- Foaming Sea Spray Embers / Bubbles -->
    <g fill="#fffdf5" opacity="0.75">
      <circle cx="160" cy="1680" r="4"/>
      <circle cx="280" cy="1660" r="3"/>
      <circle cx="420" cy="1690" r="5"/>
      <circle cx="540" cy="1670" r="4.5"/>
      <circle cx="680" cy="1660" r="3"/>
      <circle cx="820" cy="1690" r="4"/>
      <circle cx="950" cy="1670" r="5"/>
    </g>

    <!-- Foreground Coastal Granite Rocks Left -->
    <polygon points="-40,1920 0,1780 140,1830 220,1920" fill="#05070d" stroke="#240c14" stroke-width="4"/>
    <!-- Foreground Coastal Granite Rocks Right -->
    <polygon points="1120,1920 1080,1760 940,1820 860,1920" fill="#05070d" stroke="#240c14" stroke-width="4"/>
  </g>
</svg>
