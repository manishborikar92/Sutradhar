<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="mehrauli_iron_pillar">
  <defs>
    <!-- Twilight Obsidian to Terracotta Horizon Sky -->
    <linearGradient id="mehrauli_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="68%" stop-color="#271411"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Gupta Red Sandstone Gradients -->
    <linearGradient id="gupta_sandstone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="gupta_sandstone_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c1d0c"/>
      <stop offset="100%" stop-color="#1c0a04"/>
    </linearGradient>

    <!-- Antique Wrought Iron Pillar Shaft (Warm Metallic Sheen + Amber Rim Light) -->
    <linearGradient id="iron_shaft_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="22%" stop-color="#44403c"/>
      <stop offset="45%" stop-color="#a8a29e"/>
      <stop offset="62%" stop-color="#57534e"/>
      <stop offset="88%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Forged Bronze-Iron Bell Capital -->
    <linearGradient id="iron_capital_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="35%" stop-color="#78716c"/>
      <stop offset="55%" stop-color="#d6d3d1"/>
      <stop offset="85%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Golden Protective Aura & Diya Glow -->
    <radialGradient id="amber_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="diya_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Gold Rim Gradient -->
    <linearGradient id="gold_inlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: TWILIGHT SKY & STARS -->
  <g id="bg_sky">
    <rect width="1080" height="1920" fill="url(#mehrauli_sky)"/>
    <!-- Subtle Golden Starfield (within active stage) -->
    <g opacity="0.85">
      <circle cx="190" cy="340" r="2.2" fill="#fef3c7"/>
      <circle cx="310" cy="390" r="1.6" fill="#fbbf24"/>
      <circle cx="410" cy="325" r="2.0" fill="#fef3c7"/>
      <circle cx="670" cy="335" r="2.2" fill="#fbbf24"/>
      <circle cx="790" cy="380" r="1.5" fill="#fef3c7"/>
      <circle cx="885" cy="345" r="2.4" fill="#fbbf24"/>
      <circle cx="350" cy="480" r="1.5" fill="#fef3c7"/>
      <circle cx="730" cy="470" r="1.8" fill="#fbbf24"/>
    </g>
    <!-- Crescent Moon safely below 288px top exclusion -->
    <path d="M 275 340 A 26 26 0 1 0 305 370 A 21 21 0 1 1 275 340 Z" fill="#fef3c7" opacity="0.8"/>
  </g>

  <!-- LAYER 2: DISTANT GUPTA STONE ARCHITECTURE & ARCHES -->
  <g id="bg_architecture">
    <!-- Distant Horizon Ridge & Pavilion Silhouettes -->
    <path d="M 0 1240 L 120 1120 L 220 1120 L 260 1180 L 420 1180 L 450 1090 L 630 1090 L 660 1180 L 820 1180 L 860 1120 L 960 1120 L 1080 1240 L 1080 1440 L 0 1440 Z"
          fill="#1c1917" opacity="0.85"/>

    <!-- Symmetrical Carved Sandstone Colonnade Arches -->
    <path d="M 110 1420 L 110 680 Q 540 310 970 680 L 970 1420"
          fill="none" stroke="url(#gupta_sandstone_dark)" stroke-width="58"/>
    <path d="M 140 1420 L 140 700 Q 540 350 940 700 L 940 1420"
          fill="none" stroke="#d97706" stroke-width="4" opacity="0.7"/>

    <!-- Left & Right Monumental Sandstone Pillars -->
    <rect x="48" y="420" width="125" height="1040" fill="url(#gupta_sandstone)" stroke="#291003" stroke-width="4"/>
    <rect x="38" y="405" width="145" height="32" rx="4" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
    <rect x="38" y="1380" width="145" height="40" rx="4" fill="#b45309" stroke="#451a03" stroke-width="2"/>

    <rect x="907" y="420" width="125" height="1040" fill="url(#gupta_sandstone)" stroke="#291003" stroke-width="4"/>
    <rect x="897" y="405" width="145" height="32" rx="4" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
    <rect x="897" y="1380" width="145" height="40" rx="4" fill="#b45309" stroke="#451a03" stroke-width="2"/>

    <!-- Pillar Vertical Fluting & Carved Lotus Medallions -->
    <line x1="90" y1="445" x2="90" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.45"/>
    <line x1="130" y1="445" x2="130" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.45"/>
    <line x1="950" y1="445" x2="950" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.45"/>
    <line x1="990" y1="445" x2="990" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- LAYER 3: METALLURGICAL PASSIVE SHIELD AURA & MEHRAULI IRON PILLAR -->
  <g id="iron_pillar_monument">
    <!-- Radiant Golden-Amber Protective Field Behind Pillar -->
    <ellipse cx="540" cy="780" rx="220" ry="380" fill="url(#amber_aura)"/>

    <!-- Sacred Geometric Lattice Rings (evoking Misawite crystalline shield) -->
    <g transform="translate(540, 620)" opacity="0.55">
      <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="0" cy="0" r="105" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4 6"/>
      <polygon points="0,-125 108,-62 108,62 0,125 -108,62 -108,-62" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.65"/>
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#d97706" stroke-width="1.8" opacity="0.7"/>
    </g>

    <!-- Stepped Sandstone Plinth Base (grounded at Y = 1280..1415) -->
    <g id="pillar_plinth">
      <rect x="430" y="1365" width="220" height="50" rx="4" fill="url(#gupta_sandstone_dark)" stroke="#b45309" stroke-width="3"/>
      <rect x="455" y="1325" width="170" height="42" rx="4" fill="url(#gupta_sandstone)" stroke="#f59e0b" stroke-width="2.5"/>
      <rect x="480" y="1285" width="120" height="42" rx="4" fill="#5c1d0c" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <!-- Forged Wrought-Iron Shaft (X = 508..572 tapering to 516..564, Y = 505..1285) -->
    <g id="pillar_shaft">
      <polygon points="508,1285 517,505 563,505 572,1285" fill="url(#iron_shaft_grad)" stroke="#1c1917" stroke-width="2.5"/>
      <!-- Warm Specular Vertical Highlight -->
      <line x1="533" y1="510" x2="531" y2="1282" stroke="#e7e5e4" stroke-width="3" opacity="0.55"/>
      <!-- Amber Rim Light on Right Edge -->
      <line x1="562" y1="508" x2="570" y2="1282" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>

      <!-- Forge-Welded Iron Bloom Seams -->
      <line x1="516" y1="580" x2="564" y2="580" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="515" y1="660" x2="565" y2="660" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="514" y1="740" x2="566" y2="740" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="513" y1="900" x2="567" y2="900" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="512" y1="980" x2="568" y2="980" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="511" y1="1060" x2="569" y2="1060" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="510" y1="1140" x2="570" y2="1140" stroke="#78716c" stroke-width="2" opacity="0.6"/>
      <line x1="509" y1="1220" x2="571" y2="1220" stroke="#78716c" stroke-width="2" opacity="0.6"/>

      <!-- Engraved 6-Line Gupta Brahmi Inscription Band (stylized chisel strokes, zero text) -->
      <g id="brahmi_inscription_band" opacity="0.88">
        <rect x="516" y="762" width="48" height="114" rx="2" fill="#1c1917" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
        <line x1="522" y1="778" x2="558" y2="778" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3 8 2"/>
        <line x1="522" y1="796" x2="558" y2="796" stroke="#fef3c7" stroke-width="2.5" stroke-dasharray="7 2 4 3"/>
        <line x1="522" y1="814" x2="558" y2="814" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 3 6 2"/>
        <line x1="522" y1="832" x2="558" y2="832" stroke="#fef3c7" stroke-width="2.5" stroke-dasharray="6 3 5 2"/>
        <line x1="522" y1="850" x2="558" y2="850" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 2 4 3"/>
        <line x1="522" y1="868" x2="558" y2="868" stroke="#fef3c7" stroke-width="2.5" stroke-dasharray="5 2 7 3"/>
      </g>
    </g>

    <!-- Gupta Bell-Shaped Lotus Capital & Chakra Pedestal (Y = 340..505) -->
    <g id="pillar_capital">
      <!-- Neck Collar Rings -->
      <ellipse cx="540" cy="505" rx="28" ry="8" fill="url(#iron_capital_grad)" stroke="#f59e0b" stroke-width="2"/>
      <ellipse cx="540" cy="493" rx="34" ry="8" fill="url(#iron_capital_grad)" stroke="#fbbf24" stroke-width="2"/>

      <!-- Inverted Lotus Bell Body -->
      <path d="M 500 488 Q 492 440 515 415 L 565 415 Q 588 440 580 488 Z"
            fill="url(#iron_capital_grad)" stroke="#1c1917" stroke-width="2.5"/>
      <!-- Fluted Lotus Petal Ribs -->
      <path d="M 516 488 Q 514 445 526 415 M 532 488 Q 532 445 535 415 M 548 488 Q 548 445 545 415 M 564 488 Q 566 445 554 415"
            fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.75"/>

      <!-- Amalaka / Stepped Abacus -->
      <rect x="504" y="395" width="72" height="22" rx="6" fill="url(#iron_capital_grad)" stroke="#fbbf24" stroke-width="2"/>
      <rect x="514" y="375" width="52" height="20" rx="4" fill="#44403c" stroke="#f59e0b" stroke-width="2"/>

      <!-- Vishnudhvaja Solar Disc Crest (Y = 335..375, safely below Y=288px) -->
      <circle cx="540" cy="355" r="22" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <circle cx="540" cy="355" r="10" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
    </g>
  </g>

  <!-- LAYER 4: COURTYARD STAGE FLOOR & OIL DIYAS -->
  <g id="bg_foreground_diyas">
    <!-- Stone Courtyard Floor -->
    <rect x="0" y="1415" width="1080" height="505" fill="url(#gupta_sandstone_dark)" stroke="#7c2d12" stroke-width="4"/>
    <line x1="0" y1="1450" x2="1080" y2="1450" stroke="#b45309" stroke-width="3" opacity="0.75"/>
    <line x1="0" y1="1500" x2="1080" y2="1500" stroke="#7c2d12" stroke-width="2" opacity="0.5"/>

    <!-- Left Pillar Hanging Oil Diya -->
    <g id="diya_left" transform="translate(173, 560)">
      <path d="M 0 0 L 42 12 L 42 22 L 0 16 Z" fill="#291003"/>
      <ellipse cx="45" cy="18" rx="22" ry="8" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
      <circle cx="45" cy="6" r="52" fill="url(#diya_glow)"/>
      <ellipse cx="45" cy="6" rx="8" ry="15" fill="#fef3c7"/>
    </g>

    <!-- Right Pillar Hanging Oil Diya -->
    <g id="diya_right" transform="translate(907, 560)">
      <path d="M 0 0 L -42 12 L -42 22 L 0 16 Z" fill="#291003"/>
      <ellipse cx="-45" cy="18" rx="22" ry="8" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
      <circle cx="-45" cy="6" r="52" fill="url(#diya_glow)"/>
      <ellipse cx="-45" cy="6" rx="8" ry="15" fill="#fef3c7"/>
    </g>
  </g>
</svg>
