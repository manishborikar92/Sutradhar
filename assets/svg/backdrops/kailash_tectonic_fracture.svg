<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="kailash_fracture_svg">
  <defs>
    <!-- Sky & Upper Mountain Atmosphere -->
    <linearGradient id="fracture_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03050c"/>
      <stop offset="35%" stop-color="#0c0e1e"/>
      <stop offset="70%" stop-color="#181428"/>
      <stop offset="100%" stop-color="#2d120a"/>
    </linearGradient>

    <!-- Divine Golden Tectonic Beam & Shockwave -->
    <linearGradient id="divine_shockwave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Fractured Mountain Bedrock Facet Lit -->
    <linearGradient id="shattered_granite_lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3548"/>
      <stop offset="50%" stop-color="#251f30"/>
      <stop offset="100%" stop-color="#120e1a"/>
    </linearGradient>

    <!-- Fractured Mountain Bedrock Facet Shadow -->
    <linearGradient id="shattered_granite_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="50%" stop-color="#0f0c16"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <!-- Glowing Core Impact Radial -->
    <radialGradient id="divine_toe_impact" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#180400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. FULL-BLEED BACKGROUND -->
  <rect width="1080" height="1920" fill="url(#fracture_sky)"/>

  <!-- 2. UPPER MOUNTAIN SILHOUETTE & SUMMIT -->
  <g id="kailash_summit_strata">
    <polygon points="540,120 780,480 300,480" fill="url(#shattered_granite_lit)" stroke="#050308" stroke-width="4"/>
    <polygon points="540,120 780,480 540,480" fill="url(#shattered_granite_shadow)"/>
    <!-- Summit Snow Cap -->
    <polygon points="540,120 620,230 540,260 460,230" fill="#ffffff" opacity="0.95"/>
    <polygon points="540,120 620,230 540,260" fill="#cbd5e1"/>
  </g>

  <!-- 3. DIVINE IMPACT POINT AT SUMMIT (Toe of Mahadev) -->
  <circle cx="540" cy="260" r="280" fill="url(#divine_toe_impact)"/>
  <ellipse cx="540" cy="260" rx="90" ry="24" fill="#ffffff"/>
  <ellipse cx="540" cy="260" rx="140" ry="38" fill="none" stroke="#fef08a" stroke-width="4"/>
  <ellipse cx="540" cy="260" rx="200" ry="54" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- 4. MASSIVE VERTICAL TECTONIC FISSURES SPLITTING DOWNWARD -->
  <g id="tectonic_splits">
    <!-- Main Center Fissure -->
    <path d="M 540 260 L 525 640 L 560 980 L 515 1420 L 540 1920" stroke="#fef08a" stroke-width="8" fill="none"/>
    <path d="M 540 260 L 525 640 L 560 980 L 515 1420 L 540 1920" stroke="#f59e0b" stroke-width="18" fill="none" opacity="0.45"/>
    <!-- Branch Left Fissure -->
    <path d="M 525 640 L 380 920 L 290 1340 L 180 1920" stroke="#fef08a" stroke-width="5" fill="none"/>
    <path d="M 525 640 L 380 920 L 290 1340 L 180 1920" stroke="#f59e0b" stroke-width="12" fill="none" opacity="0.4"/>
    <!-- Branch Right Fissure -->
    <path d="M 560 980 L 690 1260 L 780 1620 L 880 1920" stroke="#fef08a" stroke-width="5" fill="none"/>
    <path d="M 560 980 L 690 1260 L 780 1620 L 880 1920" stroke="#f59e0b" stroke-width="12" fill="none" opacity="0.4"/>
  </g>

  <!-- 5. SHATTERED CHISELED GRANITE BLOCKS FLANKING -->
  <g id="fractured_facets">
    <!-- Left Facets -->
    <polygon points="120,480 380,480 320,840 80,780" fill="url(#shattered_granite_lit)" stroke="#050308" stroke-width="3"/>
    <polygon points="80,780 320,840 260,1260 40,1180" fill="url(#shattered_granite_shadow)" stroke="#050308" stroke-width="3"/>
    <polygon points="40,1180 260,1260 210,1680 0,1620" fill="url(#shattered_granite_lit)" stroke="#050308" stroke-width="3"/>
    <!-- Right Facets -->
    <polygon points="700,480 960,480 1000,780 760,840" fill="url(#shattered_granite_shadow)" stroke="#050308" stroke-width="3"/>
    <polygon points="760,840 1000,780 1040,1180 820,1260" fill="url(#shattered_granite_lit)" stroke="#050308" stroke-width="3"/>
    <polygon points="820,1260 1040,1180 1080,1620 870,1680" fill="url(#shattered_granite_shadow)" stroke="#050308" stroke-width="3"/>
  </g>

  <!-- 6. SACRED FOLK MANDALA SHOCKWAVE EXPANSION -->
  <g id="sacred_shockwave_geometry" opacity="0.6">
    <circle cx="540" cy="960" r="320" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="12 8"/>
    <circle cx="540" cy="960" r="420" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 10"/>
    <circle cx="540" cy="960" r="520" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="16 12"/>
  </g>

  <!-- 7. SUBTERRANEAN BEDROCK PRESSURE CRUST -->
  <g id="crushed_bedrock_base">
    <path d="M 0 1620 Q 540 1560 1080 1620 L 1080 1920 L 0 1920 Z" fill="#140602"/>
    <path d="M 0 1740 Q 540 1690 1080 1740 L 1080 1920 L 0 1920 Z" fill="#2d0b04"/>
    <polygon points="480,1680 540,1620 600,1680 540,1740" fill="#fef08a" opacity="0.7"/>
    <polygon points="280,1720 330,1670 380,1720 330,1770" fill="#f59e0b" opacity="0.5"/>
    <polygon points="700,1720 750,1670 800,1720 750,1770" fill="#f59e0b" opacity="0.5"/>
  </g>
</svg>
