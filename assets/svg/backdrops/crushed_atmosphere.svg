<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="crushed_atmosphere_svg">
  <defs>
    <!-- Crushed Himalayan Night Atmosphere -->
    <linearGradient id="crushed_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="35%" stop-color="#080d1a"/>
      <stop offset="65%" stop-color="#14142b"/>
      <stop offset="85%" stop-color="#241432"/>
      <stop offset="100%" stop-color="#180720"/>
    </linearGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1080" height="1920" fill="url(#crushed_sky)"/>

  <!-- DISTANT STARS & MOON -->
  <g opacity="0.6">
    <circle cx="160" cy="180" r="1.5" fill="#fff"/>
    <circle cx="320" cy="240" r="2" fill="#fff"/>
    <circle cx="780" cy="160" r="1.5" fill="#fef08a"/>
    <circle cx="920" cy="220" r="2" fill="#fff"/>
    <!-- Crescent Moon -->
    <path d="M 880 160 A 35 35 0 1 0 915 210 A 28 28 0 1 1 880 160 Z" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- LOW DISTANT SILHOUETTES AT BASE OF SCREEN (y > 1400) -->
  <g fill="#020306" opacity="0.95">
    <path d="M 0 1480 L 180 1390 L 360 1460 L 580 1380 L 790 1450 L 980 1370 L 1080 1440 L 1080 1920 L 0 1920 Z"/>
    <path d="M 0 1600 L 240 1520 L 490 1580 L 740 1500 L 1080 1590 L 1080 1920 L 0 1920 Z" fill="#000002"/>
  </g>
</svg>