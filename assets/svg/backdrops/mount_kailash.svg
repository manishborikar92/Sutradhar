<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="kailash_folk_art_svg">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="kailash_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Divine Golden Laser Beam Gradient -->
    <linearGradient id="divine_beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Impact Core Glow -->
    <radialGradient id="impact_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Shading Gradients -->
    <linearGradient id="peak_lit_face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="peak_shadow_face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="snow_lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="snow_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Boulder Granite Gradient -->
    <linearGradient id="boulder_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1080" height="1920" fill="url(#kailash_sky)"/>

  <!-- SACRED STARS & CONSTELLATIONS -->
  <g id="sky_stars" opacity="0.75">
    <circle cx="140" cy="180" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="280" cy="110" r="1.5" fill="#fef08a" opacity="0.7"/>
    <circle cx="420" cy="220" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="780" cy="140" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="920" cy="200" r="1.5" fill="#fde047" opacity="0.6"/>
    <circle cx="640" cy="90" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="860" cy="310" r="1.8" fill="#fff" opacity="0.75"/>
    <circle cx="210" cy="340" r="1.5" fill="#fff" opacity="0.7"/>
    <!-- Crescent Moon -->
    <path d="M 880 160 A 42 42 0 1 0 920 220 A 35 35 0 1 1 880 160 Z" fill="#f8fafc" opacity="0.9"/>
    <circle cx="895" cy="185" r="55" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- DISTANT HIMALAYAN RIDGES -->
  <g id="distant_ranges">
    <path d="M 0 980 L 120 890 L 320 950 L 510 860 L 720 940 L 910 870 L 1080 960 L 1080 1920 L 0 1920 Z" fill="#090d16" opacity="0.9"/>
    <path d="M 0 1120 L 180 1020 L 410 1090 L 680 990 L 890 1070 L 1080 1010 L 1080 1920 L 0 1920 Z" fill="#04060b"/>
  </g>

  <!-- SACRED MOUNT KAILASH (FOUR-FACED STEPPED PYRAMID PEAK) -->
  <g id="mount_kailash" transform="translate(540, 940)">
    <!-- Base Foothills & Glacial Slopes -->
    <polygon points="-480,480 0,-340 480,480" fill="url(#peak_shadow_face)"/>

    <!-- Left Shadowed Western Face -->
    <polygon points="-480,480 0,-340 -40,480" fill="url(#peak_shadow_face)"/>
    <!-- Central Ridge Line: (0, -340) to (-40, 480) -->
    
    <!-- Right Lit Southern/Eastern Face -->
    <polygon points="-40,480 0,-340 480,480" fill="url(#peak_lit_face)"/>

    <!-- Horizontal Stepped Rock Strata (Signature Kailash Architecture) -->
    <g id="rock_strata" stroke="#0b1120" stroke-width="6" opacity="0.85">
      <line x1="-120" y1="-120" x2="140" y2="-110"/>
      <line x1="-180" y1="-30" x2="210" y2="-20"/>
      <line x1="-250" y1="70" x2="280" y2="80"/>
      <line x1="-340" y1="180" x2="360" y2="195"/>
      <line x1="-420" y1="310" x2="430" y2="330"/>
    </g>
    <!-- Secondary Fine Rock Layers -->
    <g id="fine_strata" stroke="#1e293b" stroke-width="3" opacity="0.7">
      <line x1="-80" y1="-180" x2="90" y2="-175"/>
      <line x1="-150" y1="-75" x2="170" y2="-68"/>
      <line x1="-215" y1="20" x2="245" y2="30"/>
      <line x1="-295" y1="125" x2="320" y2="138"/>
      <line x1="-380" y1="245" x2="395" y2="260"/>
    </g>

    <!-- PERMANENT SNOW CAP & CREVASSES (Summit Pyramid) -->
    <g id="snow_summit">
      <!-- Shadow Snow on Left -->
      <polygon points="0,-340 -110,-190 -75,-160 -45,-180 -18,-130 0,-140" fill="url(#snow_shadow)"/>
      <polygon points="-110,-190 -160,-110 -125,-85 -75,-160" fill="url(#snow_shadow)"/>
      <!-- Lit Snow on Right Summit -->
      <polygon points="0,-340 120,-185 85,-155 50,-175 0,-140" fill="url(#snow_lit)"/>
      <polygon points="120,-185 180,-105 135,-80 85,-155" fill="url(#snow_lit)"/>
      <!-- Sharp Snow Ridge -->
      <line x1="0" y1="-340" x2="-22" y2="120" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="0" y1="-340" x2="-140" y2="-100" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="0" y1="-340" x2="150" y2="-95" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- CRACKING FAULT LINES (Cosmic Strike Fractures) -->
    <g id="strike_fractures" opacity="0" stroke="#fef08a" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 0 -340 L -30 -260 L -15 -210 L -60 -140 L -45 -80 L -90 10"/>
      <path d="M 0 -340 L 40 -250 L 25 -190 L 75 -120 L 55 -50 L 110 40"/>
      <path d="M -15 -210 L 20 -170 L -10 -120 L 35 -60"/>
    </g>
  </g>

  <!-- DIVINE LASER BEAM (Mahadev's Toe Strike from Heavens) -->
  <g id="divine_laser_beam" opacity="0">
    <!-- Massive vertical column of divine light -->
    <polygon points="520,-20 560,-20 555,600 525,600" fill="url(#divine_beam)"/>
    <line x1="540" y1="0" x2="540" y2="600" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="540" y1="0" x2="540" y2="600" stroke="#fef08a" stroke-width="26" opacity="0.6"/>
    <!-- Expanding Radial Shockwaves at Summit Impact (y = 600) -->
    <ellipse cx="540" cy="600" rx="90" ry="32" fill="url(#impact_glow)"/>
    <ellipse id="shockwave_ring1" cx="540" cy="600" rx="140" ry="45" fill="none" stroke="#fde047" stroke-width="6" opacity="0"/>
    <ellipse id="shockwave_ring2" cx="540" cy="600" rx="260" ry="85" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0"/>
    <ellipse id="shockwave_ring3" cx="540" cy="600" rx="390" ry="125" fill="none" stroke="#d97706" stroke-width="2" opacity="0"/>
  </g>

  <!-- ORGANIC JAGGED FALLING BOULDERS & ROCK SLABS (Defect 3 Fix: Zero Square Bricks) -->
  <g id="falling_boulders" opacity="0">
    <!-- Boulder 1: Jagged Heptagon Slab -->
    <g id="boulder_1" transform="translate(320, 680)">
      <polygon points="-45,-25 10,-48 55,-15 48,32 12,54 -38,42 -58,10" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="2.5"/>
      <polygon points="-45,-25 10,-48 12,54 -38,42" fill="#475569" opacity="0.6"/>
    </g>

    <!-- Boulder 2: Giant Hexagonal Granite Mass -->
    <g id="boulder_2" transform="translate(740, 720)">
      <polygon points="-65,-35 25,-60 85,-18 70,45 -15,70 -75,25" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="3"/>
      <polygon points="25,-60 85,-18 70,45 -15,70" fill="#334155" opacity="0.7"/>
    </g>

    <!-- Boulder 3: Pointed Keystone Shard -->
    <g id="boulder_3" transform="translate(460, 840)">
      <polygon points="-30,-45 40,-20 25,50 -35,35 -50,-10" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- Boulder 4: Heavy Flat Slab -->
    <g id="boulder_4" transform="translate(620, 880)">
      <polygon points="-70,-20 15,-38 85,-12 60,35 -40,42 -85,15" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="2.5"/>
      <polygon points="-70,-20 15,-38 -40,42 -85,15" fill="#475569" opacity="0.5"/>
    </g>

    <!-- Boulder 5: Medium Jagged Fragment -->
    <g id="boulder_5" transform="translate(240, 920)">
      <polygon points="-35,-30 20,-40 45,15 5,45 -40,20" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- Boulder 6: Massive Lower Anchor Rock -->
    <g id="boulder_6" transform="translate(850, 960)">
      <polygon points="-80,-40 30,-55 95,-10 75,55 -20,68 -90,20" fill="url(#boulder_grad)" stroke="#1e293b" stroke-width="3.5"/>
      <polygon points="30,-55 95,-10 75,55 -20,68" fill="#334155" opacity="0.8"/>
    </g>
  </g>

  <!-- FOREGROUND DARK CANYON SILL & SMOKE/DUST HAZE -->
  <g id="foreground_canyon">
    <path d="M 0 1620 L 260 1480 L 480 1560 L 760 1450 L 1080 1580 L 1080 1920 L 0 1920 Z" fill="#020408"/>
    <!-- Subtle Golden Dust Layer -->
    <path d="M 0 1600 Q 540 1480 1080 1600 L 1080 1920 L 0 1920 Z" fill="#d97706" opacity="0.08"/>
  </g>
</svg>