<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="brahmaloka_time_chakra">
  <defs>
    <!-- Deep Celestial Night Gradient: Obsidian to Cosmic Indigo & Warm Terracotta Horizon -->
    <linearGradient id="brahmaloka_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Carved Cosmic Sandstone & Gold Architecture -->
    <linearGradient id="celestial_pillar_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="45%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a04"/>
    </linearGradient>

    <!-- Burnished Vedic Gold & Brass -->
    <linearGradient id="vedic_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="vedic_ochre_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Radiant Brahmaloka Core Glow -->
    <radialGradient id="kalachakra_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.72"/>
      <stop offset="28%" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Diya Flame Glow -->
    <radialGradient id="celestial_diya_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>

    <filter id="chakra_bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: CELESTIAL NIGHT SKY & GOLDEN CONSTELLATIONS -->
  <g id="bg_cosmos_sky">
    <rect width="1080" height="1920" fill="url(#brahmaloka_sky)"/>
    <!-- Golden Nakshatra Starfield (strictly warm gold & ivory, zero cyan/teal) -->
    <g opacity="0.88">
      <circle cx="185" cy="330" r="2.2" fill="#fef3c7"/>
      <circle cx="290" cy="395" r="1.8" fill="#fbbf24"/>
      <circle cx="405" cy="320" r="2.0" fill="#fef3c7"/>
      <circle cx="675" cy="320" r="2.2" fill="#fbbf24"/>
      <circle cx="795" cy="385" r="1.6" fill="#fef3c7"/>
      <circle cx="885" cy="335" r="2.4" fill="#fbbf24"/>
      <circle cx="240" cy="520" r="1.5" fill="#fef3c7"/>
      <circle cx="840" cy="510" r="1.8" fill="#fbbf24"/>
      <circle cx="215" cy="790" r="1.6" fill="#fef3c7"/>
      <circle cx="865" cy="780" r="1.8" fill="#fbbf24"/>
    </g>
    <!-- Crescent Chandra Crest safely below Y=288px -->
    <path d="M 260 345 A 24 24 0 1 0 288 373 A 19 19 0 1 1 260 345 Z" fill="#fef3c7" opacity="0.85"/>
    <circle cx="820" cy="355" r="10" fill="#fbbf24" opacity="0.75"/>
    <circle cx="820" cy="355" r="22" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- LAYER 2: BRAHMALOKA CELESTIAL PAVILION ARCHES & PILLARS -->
  <g id="bg_celestial_court">
    <!-- Distant Horizon Ridge -->
    <path d="M 0 1320 L 140 1210 L 320 1250 L 540 1160 L 760 1250 L 940 1210 L 1080 1320 L 1080 1440 L 0 1440 Z"
          fill="#0f0a1e" opacity="0.85"/>

    <!-- Ornate Cusped Temple Arch Framing the Kalachakra -->
    <path d="M 118 1420 L 118 670 Q 320 420 540 315 Q 760 420 962 670 L 962 1420"
          fill="none" stroke="#1e1b4b" stroke-width="52" opacity="0.9"/>
    <path d="M 118 1420 L 118 670 Q 320 420 540 315 Q 760 420 962 670 L 962 1420"
          fill="none" stroke="url(#vedic_gold)" stroke-width="4" opacity="0.72"/>
    <path d="M 145 1420 L 145 685 Q 335 450 540 350 Q 745 450 935 685 L 935 1420"
          fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.65"/>

    <!-- Left & Right Celestial Pillars -->
    <rect x="48" y="400" width="110" height="1040" fill="url(#celestial_pillar_grad)" stroke="#1c0a04" stroke-width="4"/>
    <rect x="38" y="385" width="130" height="28" rx="4" fill="url(#vedic_gold)" stroke="#451a03" stroke-width="2"/>
    <rect x="38" y="1380" width="130" height="38" rx="4" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
    <line x1="85" y1="425" x2="85" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <line x1="120" y1="425" x2="120" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>

    <rect x="922" y="400" width="110" height="1040" fill="url(#celestial_pillar_grad)" stroke="#1c0a04" stroke-width="4"/>
    <rect x="912" y="385" width="130" height="28" rx="4" fill="url(#vedic_gold)" stroke="#451a03" stroke-width="2"/>
    <rect x="912" y="1380" width="130" height="38" rx="4" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
    <line x1="960" y1="425" x2="960" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <line x1="995" y1="425" x2="995" y2="1370" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- LAYER 3: CENTRAL KALACHAKRA & RELATIVISTIC TIME-DILATION MANDALA (X: 350..730, Y: 340..1380) -->
  <g id="kalachakra_centerpiece">
    <!-- Ambient Golden Radial Aura -->
    <circle cx="540" cy="680" r="290" fill="url(#kalachakra_aura)"/>

    <!-- Sacred Axis Mundi Beam -->
    <line x1="540" y1="340" x2="540" y2="1280" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8" opacity="0.45"/>

    <!-- Outer Earthly Chatur-Yuga Wheel (27 Spokes / Epochs orbiting rapidly) -->
    <g id="outer_yuga_wheel" transform="translate(540, 680)">
      <circle cx="0" cy="0" r="205" fill="none" stroke="url(#vedic_gold)" stroke-width="5" opacity="0.82"/>
      <circle cx="0" cy="0" r="192" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="14 7" opacity="0.6"/>
      <circle cx="0" cy="0" r="168" fill="none" stroke="#b45309" stroke-width="3" opacity="0.8"/>

      <!-- Cardinal & Diagonal Yuga Sector Spokes -->
      <g stroke="#fbbf24" stroke-width="2.2" opacity="0.72">
        <line x1="0" y1="-205" x2="0" y2="-168"/>
        <line x1="0" y1="168" x2="0" y2="205"/>
        <line x1="-205" y1="0" x2="-168" y2="0"/>
        <line x1="168" y1="0" x2="205" y2="0"/>
        <line x1="-145" y1="-145" x2="-119" y2="-119"/>
        <line x1="145" y1="-145" x2="119" y2="-119"/>
        <line x1="-145" y1="145" x2="-119" y2="119"/>
        <line x1="145" y1="145" x2="119" y2="119"/>
        <line x1="-78" y1="-189" x2="-64" y2="-155"/>
        <line x1="78" y1="-189" x2="64" y2="-155"/>
        <line x1="-78" y1="189" x2="-64" y2="155"/>
        <line x1="78" y1="189" x2="64" y2="155"/>
        <line x1="-189" y1="-78" x2="-155" y2="-64"/>
        <line x1="189" y1="-78" x2="155" y2="-64"/>
        <line x1="-189" y1="78" x2="-155" y2="64"/>
        <line x1="189" y1="78" x2="155" y2="64"/>
      </g>

      <!-- Elliptical Relativistic Orbit Rings (Time Curvature) -->
      <ellipse cx="0" cy="0" rx="185" ry="62" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.7" transform="rotate(-24)"/>
      <ellipse cx="0" cy="0" rx="185" ry="62" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="10 6" opacity="0.55" transform="rotate(24)"/>

      <!-- 8-Petal Cosmic Lotus Ring -->
      <g fill="none" stroke="#fbbf24" stroke-width="2.2" opacity="0.8">
        <polygon points="0,-142 100,-100 142,0 100,100 0,142 -100,100 -142,0 -100,-100"/>
        <polygon points="0,-122 86,-86 122,0 86,86 0,122 -86,86 -122,0 -86,-86" transform="rotate(22.5)"/>
      </g>

      <!-- Inner Brahmaloka Stillness Ring (1 Moment = Millions of Years) -->
      <circle cx="0" cy="0" r="88" fill="#1e1b4b" fill-opacity="0.78" stroke="url(#vedic_gold)" stroke-width="4" filter="url(#chakra_bloom)"/>
      <circle cx="0" cy="0" r="68" fill="none" stroke="#fef3c7" stroke-width="1.8" stroke-dasharray="6 4"/>

      <!-- Dual Time-Dilation Hourglass / Damaru Geometry at Core -->
      <polygon points="-34,-44 34,-44 0,0" fill="#fbbf24" fill-opacity="0.85" stroke="#fef3c7" stroke-width="2"/>
      <polygon points="-34,44 34,44 0,0" fill="#f59e0b" fill-opacity="0.75" stroke="#fef3c7" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#fef3c7" filter="url(#chakra_bloom)"/>

      <!-- Orbital Planetary Spheres -->
      <circle cx="185" cy="0" r="11" fill="#fbbf24" stroke="#fef3c7" stroke-width="2"/>
      <circle cx="-185" cy="0" r="9" fill="#d97706" stroke="#fef3c7" stroke-width="2"/>
      <circle cx="0" cy="-192" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    </g>

    <!-- Carved Cosmic Lotus Plinth & Meru Pedestal (Y: 980..1410) -->
    <g id="brahmaloka_pedestal">
      <!-- Golden Support Stem -->
      <polygon points="528,895 552,895 562,1265 518,1265" fill="url(#vedic_ochre_dark)" stroke="#fbbf24" stroke-width="2"/>
      <!-- Stepped Lotus Seat -->
      <path d="M 455 1265 Q 540 1225 625 1265 L 605 1300 L 475 1300 Z" fill="#7c2d12" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="445" y="1300" width="190" height="36" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2.5"/>
      <rect x="415" y="1336" width="250" height="44" rx="4" fill="#291003" stroke="#b45309" stroke-width="3"/>
      <rect x="390" y="1380" width="300" height="38" rx="4" fill="#1c0a04" stroke="#f59e0b" stroke-width="2.5"/>
    </g>
  </g>

  <!-- LAYER 4: STAGE FLOOR & HANGING TEMPLE DIYAS -->
  <g id="bg_foreground_diyas">
    <rect x="0" y="1418" width="1080" height="502" fill="#1c0a04" stroke="#7c2d12" stroke-width="4"/>
    <line x1="0" y1="1450" x2="1080" y2="1450" stroke="#b45309" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="1495" x2="1080" y2="1495" stroke="#7c2d12" stroke-width="2" opacity="0.5"/>

    <!-- Left Hanging Oil Diya -->
    <g id="diya_left" transform="translate(158, 540)">
      <path d="M 0 0 L 42 12 L 42 22 L 0 16 Z" fill="#291003"/>
      <ellipse cx="45" cy="18" rx="22" ry="8" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
      <circle cx="45" cy="6" r="50" fill="url(#celestial_diya_glow)"/>
      <ellipse cx="45" cy="6" rx="8" ry="15" fill="#fef3c7"/>
    </g>

    <!-- Right Hanging Oil Diya -->
    <g id="diya_right" transform="translate(922, 540)">
      <path d="M 0 0 L -42 12 L -42 22 L 0 16 Z" fill="#291003"/>
      <ellipse cx="-45" cy="18" rx="22" ry="8" fill="#b45309" stroke="#fef3c7" stroke-width="1.5"/>
      <circle cx="-45" cy="6" r="50" fill="url(#celestial_diya_glow)"/>
      <ellipse cx="-45" cy="6" rx="8" ry="15" fill="#fef3c7"/>
    </g>
  </g>
</svg>
