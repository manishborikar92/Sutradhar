<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <radialGradient id="dilation_core_gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="70%" stop-color="#111827" />
      <stop offset="100%" stop-color="#C84B31" stop-opacity="0.8" />
    </radialGradient>
    <linearGradient id="gold_curvature_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B869" />
      <stop offset="50%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#C84B31" />
    </linearGradient>
    <filter id="gold_glow_clock" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base: Spacetime Curvature Grid & Gravitational Well Axis -->
  <g id="diagram_base">
    <!-- Outer Astronomical Calibration Ring -->
    <circle class="draw-path" cx="450" cy="450" r="390" fill="none" stroke="#E5B869" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
    <!-- Spacetime Metric Ellipses -->
    <ellipse class="draw-path" cx="450" cy="470" rx="350" ry="120" fill="none" stroke="#E5B869" stroke-width="2" opacity="0.5" />
    <ellipse class="draw-path" cx="450" cy="520" rx="260" ry="85" fill="none" stroke="#E5B869" stroke-width="2" opacity="0.6" stroke-dasharray="8 6" />
    <ellipse class="draw-path" cx="450" cy="580" rx="170" ry="55" fill="none" stroke="#C84B31" stroke-width="2.5" opacity="0.7" />

    <!-- Geodesic Funnel Curvature Profile -->
    <path class="draw-path" d="M 100,470 Q 300,500 450,660 Q 600,500 800,470" fill="none" stroke="url(#gold_curvature_grad)" stroke-width="3" opacity="0.75" />

    <!-- Central Singularity Mass Horizon -->
    <circle cx="450" cy="660" r="42" fill="url(#dilation_core_gold)" stroke="#C84B31" stroke-width="3" />
    <circle class="draw-path" cx="450" cy="660" r="42" fill="none" stroke="#E5B869" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Header Typography -->
    <text x="450" y="80" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="3">TIME DILATION</text>
    <text x="450" y="125" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="600" text-anchor="middle" opacity="0.9">1 SECOND = 1,000 YEARS</text>
  </g>

  <!-- Stage 1: Distant Observer Clock (Normal Proper Time) -->
  <g id="stage_1">
    <!-- Observer Precision Clock Face -->
    <circle class="draw-path" cx="700" cy="240" r="75" fill="#07090F" stroke="#E5B869" stroke-width="3.5" filter="url(#gold_glow_clock)" />
    <!-- Clock Dial Marks -->
    <line class="draw-path" x1="700" y1="170" x2="700" y2="185" stroke="#E5B869" stroke-width="3" />
    <line class="draw-path" x1="770" y1="240" x2="755" y2="240" stroke="#E5B869" stroke-width="3" />
    <line class="draw-path" x1="700" y1="310" x2="700" y2="295" stroke="#E5B869" stroke-width="3" />
    <line class="draw-path" x1="630" y1="240" x2="645" y2="240" stroke="#E5B869" stroke-width="3" />
    <!-- Rapid Hands -->
    <line class="draw-path" x1="700" y1="240" x2="700" y2="185" stroke="#F8F4EC" stroke-width="4" stroke-linecap="round" />
    <line class="draw-path" x1="700" y1="240" x2="738" y2="240" stroke="#E5B869" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="700" cy="240" r="5" fill="#E5B869" />

    <text x="700" y="350" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">OBSERVER TIME</text>
    <text x="700" y="378" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="middle" opacity="0.8">Normal Proper Flow</text>
  </g>

  <!-- Stage 2: Spacetime Gravitational Curvature Gradient -->
  <g id="stage_2">
    <!-- Inward Geodesic Trajectory -->
    <path class="draw-path" d="M 240,240 C 340,360 410,540 450,660" fill="none" stroke="url(#gold_curvature_grad)" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="450,660 442,640 458,644" fill="#C84B31" />
    <text x="210" y="210" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="700">GRAVITY GRADIENT</text>
    <text x="210" y="240" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" opacity="0.85">Spacetime Warping</text>
  </g>

  <!-- Stage 3: Infalling Clock (Frozen Proper Time Near Horizon) -->
  <g id="stage_3">
    <!-- Dilated Slow Clock -->
    <circle class="draw-path" cx="260" cy="520" r="68" fill="#07090F" stroke="#C84B31" stroke-width="3.5" />
    <!-- Clock Hands (Frozen almost at standstill) -->
    <line class="draw-path" x1="260" y1="520" x2="260" y2="470" stroke="#C84B31" stroke-width="4" stroke-linecap="round" />
    <line class="draw-path" x1="260" y1="520" x2="278" y2="510" stroke="#E5B869" stroke-width="3" stroke-linecap="round" />
    <circle cx="260" cy="520" r="5" fill="#C84B31" />

    <text x="260" y="625" fill="#C84B31" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">FROZEN TIME</text>
    <text x="260" y="652" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="middle" opacity="0.85">dτ → 0 at Horizon</text>
  </g>

  <!-- Stage 4: Asymptotic Horizon Boundary -->
  <g id="stage_4">
    <!-- Asymptotic Horizon Line -->
    <line class="draw-path" x1="100" y1="660" x2="800" y2="660" stroke="#E5B869" stroke-width="3" stroke-dasharray="10 8" />
    <text x="450" y="730" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="2">EVENT HORIZON</text>
    <text x="450" y="770" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle" opacity="0.9">Boundary of Infinite Dilation</text>
  </g>

  <!-- Highlight Pulse Energy Ring -->
  <g id="highlight_pulse">
    <circle cx="450" cy="660" r="48" fill="none" stroke="#E5B869" stroke-width="4" opacity="0.9" filter="url(#gold_glow_clock)" />
  </g>
</svg>