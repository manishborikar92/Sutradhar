<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <radialGradient id="kailash_bindu_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B6508" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="meridian_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base: 4-Faceted Cardinal Grid Axis (0°, 90°, 180°, 270°) -->
  <g id="diagram_base">
    <!-- Cosmic Orientation Compass Dial -->
    <circle cx="450" cy="450" r="380" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="450" cy="450" r="280" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" opacity="0.7" />
    <!-- Cardinal Axes -->
    <line x1="450" y1="50" x2="450" y2="850" stroke="#94A3B8" stroke-width="2" />
    <line x1="50" y1="450" x2="850" y2="450" stroke="#94A3B8" stroke-width="2" />
    <!-- Cardinal Direction Labels -->
    <text x="450" y="40" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">NORTH (0°)</text>
    <text x="450" y="880" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">SOUTH (180°)</text>
    <text x="880" y="456" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800">EAST (90°)</text>
    <text x="20" y="456" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800">WEST (270°)</text>
    <!-- Central Cardinal Diamond of Kailash Base -->
    <polygon points="450,310 590,450 450,590 310,450" fill="#0F172A" stroke="#E2E8F0" stroke-width="3" />
    <text x="450" y="455" fill="#FFD700" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AXIS MUNDI</text>
  </g>

  <!-- Stage 1: Planetary Geographic Alignments (Stonehenge, Easter Island, North Pole) -->
  <g id="stage_1">
    <!-- Great Circle Alignment Vectors -->
    <line x1="450" y1="450" x2="200" y2="200" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 4" />
    <circle cx="200" cy="200" r="10" fill="#38BDF8" />
    <text x="110" y="190" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">STONEHENGE (6,666 km)</text>

    <line x1="450" y1="450" x2="700" y2="700" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 4" />
    <circle cx="700" cy="700" r="10" fill="#38BDF8" />
    <text x="590" y="730" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">EASTER ISLAND (13,332 km)</text>
  </g>

  <!-- Stage 2: Subterranean Stepped Granite Pyramid Contours -->
  <g id="stage_2">
    <!-- Concentric Stepped Pyramid Tiers -->
    <polygon points="450,340 560,450 450,560 340,450" fill="none" stroke="#F59E0B" stroke-width="3" />
    <polygon points="450,380 520,450 450,520 380,450" fill="none" stroke="#FBBF24" stroke-width="2.5" />
    <polygon points="450,410 490,450 450,490 410,450" fill="none" stroke="#FDE68A" stroke-width="2" />
    <text x="450" y="280" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">STEPPED GRANITE PYRAMID CORE</text>
  </g>

  <!-- Stage 3: Four Sacred Radial River Outflows -->
  <g id="stage_3">
    <!-- Indus (North/West) -->
    <path d="M 380,380 Q 250,320 180,260" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    <text x="150" y="300" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">INDUS RIVER</text>
    <!-- Brahmaputra (East) -->
    <path d="M 520,450 Q 640,480 780,470" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    <text x="650" y="440" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BRAHMAPUTRA</text>
    <!-- Sutlej (West) -->
    <path d="M 380,450 Q 260,490 140,510" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    <text x="140" y="540" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SUTLEJ RIVER</text>
    <!-- Karnali / Ganges Tributary (South) -->
    <path d="M 450,520 Q 480,650 490,780" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    <text x="500" y="760" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">KARNALI (GANGES)</text>
  </g>

  <!-- Stage 4: Geomagnetic Energy Flux Vectors -->
  <g id="stage_4">
    <!-- Radiant Flux Vectors from Center -->
    <circle cx="450" cy="450" r="180" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="10 6" />
    <path d="M 450,230 L 450,200 M 670,450 L 700,450 M 450,670 L 450,700 M 230,450 L 200,450" stroke="#EC4899" stroke-width="4" stroke-linecap="round" />
    <text x="450" y="640" fill="#EC4899" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">GEOMAGNETIC ENERGY FLUX</text>
  </g>

  <!-- Central Highlight Pulse / Bindu Point -->
  <g id="highlight_pulse">
    <circle cx="450" cy="450" r="24" fill="url(#kailash_bindu_grad)" filter="drop-shadow(0 0 16px #FFD700)" />
    <circle cx="450" cy="450" r="6" fill="#FFF" />
  </g>
</svg>
