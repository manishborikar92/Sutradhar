<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <radialGradient id="kailash_gold_bindu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F4EC" />
      <stop offset="40%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold_axis_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B869" />
      <stop offset="50%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#C84B31" />
    </linearGradient>
    <filter id="gold_glow_kailash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base: 4-Faceted Cardinal Grid Axis & Compass Dial -->
  <g id="diagram_base">
    <!-- Cosmic Orientation Compass Dial -->
    <circle class="draw-path" cx="450" cy="450" r="380" fill="none" stroke="#E5B869" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
    <circle class="draw-path" cx="450" cy="450" r="300" fill="none" stroke="#E5B869" stroke-width="2.5" opacity="0.6" />
    <circle class="draw-path" cx="450" cy="450" r="220" fill="none" stroke="#E5B869" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5" />

    <!-- Cardinal Axes -->
    <line class="draw-path" x1="450" y1="80" x2="450" y2="820" stroke="#E5B869" stroke-width="2.5" />
    <line class="draw-path" x1="80" y1="450" x2="820" y2="450" stroke="#E5B869" stroke-width="2.5" />

    <!-- Cardinal Direction Labels -->
    <text x="450" y="60" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" text-anchor="middle">NORTH (0°)</text>
    <text x="450" y="865" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" text-anchor="middle">SOUTH (180°)</text>
    <text x="835" y="458" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800">EAST</text>
    <text x="65" y="458" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" text-anchor="end">WEST</text>

    <!-- Central Cardinal Diamond Pyramid -->
    <polygon class="draw-path" points="450,330 570,450 450,570 330,450" fill="#111827" stroke="#E5B869" stroke-width="3" />
    
    <text x="450" y="125" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="3">TRUE CARDINAL AXIS</text>
    <text x="450" y="165" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="600" text-anchor="middle" opacity="0.9">EARTH MONUMENT</text>
  </g>

  <!-- Stage 1: Planetary Sacred Geodetic Alignments (6,666 km) -->
  <g id="stage_1">
    <!-- Great Circle Alignment Vectors -->
    <line class="draw-path" x1="450" y1="450" x2="200" y2="200" stroke="#E5B869" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="200" cy="200" r="12" fill="#E5B869" filter="url(#gold_glow_kailash)" />
    <text x="200" y="160" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">STONEHENGE</text>
    <text x="200" y="185" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="800" text-anchor="middle">6,666 KM</text>

    <line class="draw-path" x1="450" y1="450" x2="700" y2="700" stroke="#E5B869" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="700" cy="700" r="12" fill="#E5B869" filter="url(#gold_glow_kailash)" />
    <text x="700" y="745" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NORTH POLE</text>
    <text x="700" y="775" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="800" text-anchor="middle">6,666 KM</text>
  </g>

  <!-- Stage 2: Stepped Granite Pyramid Contours -->
  <g id="stage_2">
    <!-- Concentric Stepped Pyramid Tiers -->
    <polygon class="draw-path" points="450,360 540,450 450,540 360,450" fill="none" stroke="#E5B869" stroke-width="3" />
    <polygon class="draw-path" points="450,390 510,450 450,510 390,450" fill="none" stroke="#F8F4EC" stroke-width="2.5" />
    <polygon class="draw-path" points="450,420 480,450 450,480 420,450" fill="none" stroke="#C84B31" stroke-width="2" />
    
    <text x="450" y="270" fill="#E5B869" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" text-anchor="middle">STEPPED GRANITE CORE</text>
    <text x="450" y="300" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" text-anchor="middle" opacity="0.85">Four Symmetrical Faces</text>
  </g>

  <!-- Stage 3: Sacred Radial River Sources -->
  <g id="stage_3">
    <!-- Indus (North-West) -->
    <path class="draw-path" d="M 390,390 Q 280,330 180,260" fill="none" stroke="#E5B869" stroke-width="4" stroke-linecap="round" />
    <text x="180" y="240" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">INDUS</text>
    
    <!-- Brahmaputra (East) -->
    <path class="draw-path" d="M 510,450 Q 630,480 750,460" fill="none" stroke="#E5B869" stroke-width="4" stroke-linecap="round" />
    <text x="750" y="440" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">BRAHMAPUTRA</text>

    <!-- Sutlej (West) -->
    <path class="draw-path" d="M 390,450 Q 280,490 180,510" fill="none" stroke="#E5B869" stroke-width="4" stroke-linecap="round" />
    <text x="180" y="540" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">SUTLEJ</text>

    <!-- Karnali / Ganges (South) -->
    <path class="draw-path" d="M 450,510 Q 480,620 490,740" fill="none" stroke="#E5B869" stroke-width="4" stroke-linecap="round" />
    <text x="510" y="730" fill="#E5B869" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700">KARNALI</text>
  </g>

  <!-- Stage 4: Geomagnetic Axial Energy Flux -->
  <g id="stage_4">
    <!-- Radiant Harmonic Energy Rings -->
    <circle class="draw-path" cx="450" cy="450" r="160" fill="none" stroke="#C84B31" stroke-width="2.5" stroke-dasharray="10 6" />
    <circle class="draw-path" cx="450" cy="450" r="100" fill="none" stroke="#E5B869" stroke-width="2" stroke-dasharray="6 6" />
    <text x="450" y="630" fill="#C84B31" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" text-anchor="middle">GEOMAGNETIC AXIS</text>
    <text x="450" y="660" fill="#F8F4EC" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" text-anchor="middle" opacity="0.85">Harmonic Earth Grid</text>
  </g>

  <!-- Central Highlight Pulse / Bindu Point -->
  <g id="highlight_pulse">
    <circle cx="450" cy="450" r="28" fill="url(#kailash_gold_bindu)" filter="url(#gold_glow_kailash)" />
    <circle cx="450" cy="450" r="8" fill="#F8F4EC" />
  </g>
</svg>