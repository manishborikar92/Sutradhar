<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="100%" height="100%" id="prop_planetary_staircase_svg">
  <defs>
    <linearGradient id="stair_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stair_iron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="step_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g id="planetary_staircase_group" transform="translate(40, 20)">
    <!-- Base Foundation Stone -->
    <rect x="0" y="620" width="640" height="40" fill="url(#stair_iron)" stroke="url(#stair_gold)" stroke-width="4" rx="4"/>
    <text x="320" y="646" fill="#e2e8f0" font-family="'EB Garamond', serif" font-size="18" font-weight="bold" text-anchor="middle">नवग्रह सोपान (नवग्रहों का सिंहासन सोपान)</text>

    <!-- 9 Horizontal Deity Steps Stacked Upward -->
    <!-- Step 1: Surya (Base / Sun) -->
    <g id="step_1_surya" class="stair-step" transform="translate(0, 560)">
      <rect x="20" y="0" width="600" height="52" fill="#78350f" stroke="url(#stair_gold)" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
      <text x="75" y="32" fill="#fef08a" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">१. सूर्य (प्रथम सोपान)</text>
      <rect x="520" y="8" width="80" height="36" fill="#b45309" rx="3" stroke="#fde047"/>
      <text x="560" y="32" fill="#ffffff" font-family="'EB Garamond', serif" font-size="14" text-anchor="middle">तेज</text>
    </g>

    <!-- Step 2: Chandra (Moon) -->
    <g id="step_2_chandra" class="stair-step" transform="translate(30, 500)">
      <rect x="20" y="0" width="560" height="52" fill="#1e293b" stroke="#cbd5e1" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="75" y="32" fill="#f8fafc" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">२. चन्द्र (द्वितीय सोपान)</text>
    </g>

    <!-- Step 3: Mangala (Mars) -->
    <g id="step_3_mangala" class="stair-step" transform="translate(60, 440)">
      <rect x="20" y="0" width="520" height="52" fill="#881337" stroke="#fb7185" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#e11d48" stroke="#fecdd3" stroke-width="2"/>
      <text x="75" y="32" fill="#ffe4e6" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">३. मंगल (तृतीय सोपान)</text>
    </g>

    <!-- Step 4: Budha (Mercury) -->
    <g id="step_4_budha" class="stair-step" transform="translate(90, 380)">
      <rect x="20" y="0" width="480" height="52" fill="#064e3b" stroke="#34d399" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
      <text x="75" y="32" fill="#ecfdf5" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">४. बुध (चतुर्थ सोपान)</text>
    </g>

    <!-- Step 5: Guru / Brihaspati (Jupiter) -->
    <g id="step_5_guru" class="stair-step" transform="translate(120, 320)">
      <rect x="20" y="0" width="440" height="52" fill="#713f12" stroke="#facc15" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
      <text x="75" y="32" fill="#fef9c3" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">५. गुरु (पंचम सोपान)</text>
    </g>

    <!-- Step 6: Shukra (Venus) -->
    <g id="step_6_shukra" class="stair-step" transform="translate(150, 260)">
      <rect x="20" y="0" width="400" height="52" fill="#1e1b4b" stroke="#c084fc" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#a855f7" stroke="#f3e8ff" stroke-width="2"/>
      <text x="75" y="32" fill="#faf5ff" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">६. शुक्र (षष्ठ सोपान)</text>
    </g>

    <!-- Step 7: Rahu (North Node) -->
    <g id="step_7_rahu" class="stair-step" transform="translate(180, 200)">
      <rect x="20" y="0" width="360" height="52" fill="#0f172a" stroke="#64748b" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <text x="75" y="32" fill="#f1f5f9" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">७. राहु (सप्तम सोपान)</text>
    </g>

    <!-- Step 8: Ketu (South Node) -->
    <g id="step_8_ketu" class="stair-step" transform="translate(210, 140)">
      <rect x="20" y="0" width="320" height="52" fill="#1c1917" stroke="#78716c" stroke-width="3" rx="4" filter="url(#step_shadow)"/>
      <circle cx="50" cy="26" r="14" fill="#44403c" stroke="#a8a29e" stroke-width="2"/>
      <text x="75" y="32" fill="#fafaf9" font-family="'EB Garamond', serif" font-size="18" font-weight="bold">८. केतु (अष्टम सोपान)</text>
    </g>

    <!-- Step 9: Shani Dev (Top Summit Step - The Pivotal 9th Step) -->
    <g id="step_9_shani" class="stair-step summit-step" transform="translate(240, 60)">
      <rect x="20" y="0" width="280" height="68" fill="#090d16" stroke="#38bdf8" stroke-width="4.5" rx="6" filter="url(#step_shadow)"/>
      <circle cx="50" cy="34" r="18" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/>
      <text x="80" y="34" fill="#38bdf8" font-family="'EB Garamond', serif" font-size="20" font-weight="bold">९. शनि देव (अंतिम)</text>
      <text x="80" y="54" fill="#fef08a" font-family="'EB Garamond', serif" font-size="14">कष्ट व न्याय का सोपान</text>
      <!-- Karmic Gaze Indicator -->
      <polygon points="260,20 280,34 260,48" fill="#38bdf8"/>
    </g>
  </g>
</svg>
