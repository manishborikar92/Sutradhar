<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" id="prop_thought_bubble_infant_svg">
  <defs>
    <radialGradient id="bubble_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="aura_gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="thought_bubble_assembly">
    <!-- Connecting Floating Cloud Dots (Leading from Character) -->
    <circle cx="80" cy="420" r="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="120" cy="370" r="20" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="170" cy="310" r="30" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3.5"/>

    <!-- Main Cloud Bubble Container -->
    <g id="main_bubble_body" transform="translate(40, 20)">
      <!-- Cloud Scallop Lobes -->
      <path d="M 120,200 
               A 70,70 0 0,1 200,90 
               A 85,85 0 0,1 330,90 
               A 70,70 0 0,1 410,200 
               A 75,75 0 0,1 380,310 
               A 80,80 0 0,1 250,340 
               A 75,75 0 0,1 140,300 
               A 60,60 0 0,1 120,200 Z" 
            fill="url(#bubble_bg)" stroke="#fbbf24" stroke-width="5" filter="url(#soft_glow)"/>

      <!-- Inner Cosmic Birth Constellation Rings -->
      <circle cx="265" cy="210" r="110" fill="url(#aura_gold)" opacity="0.6"/>
      <circle cx="265" cy="210" r="95" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="6 4"/>

      <!-- Divine Infant (Meghnada) in Golden Silk Swaddle -->
      <g id="infant_cradle" transform="translate(265, 210)">
        <!-- Golden Halo -->
        <circle cx="0" cy="-35" r="30" fill="#fef08a" opacity="0.8" filter="url(#soft_glow)"/>
        <!-- Baby Head -->
        <circle cx="0" cy="-35" r="22" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
        <!-- Crown / Tilak -->
        <polygon points="0,-52 5,-42 -5,-42" fill="#dc2626"/>
        <line x1="0" y1="-42" x2="0" y2="-32" stroke="#ea580c" stroke-width="2"/>
        <!-- Closed Peaceful Eyes -->
        <path d="M -12,-34 Q -7,-30 -2,-34" fill="none" stroke="#7c2d12" stroke-width="2"/>
        <path d="M 2,-34 Q 7,-30 12,-34" fill="none" stroke="#7c2d12" stroke-width="2"/>

        <!-- Swaddling Royal Silk Wrap -->
        <path d="M -30,-15 Q 0,-30 30,-15 Q 38,25 25,50 Q 0,65 -25,50 Q -38,25 -30,-15 Z" 
              fill="#dc2626" stroke="#fef08a" stroke-width="3"/>
        <!-- Gold Brocade Ribbon on Swaddle -->
        <path d="M -22,0 Q 0,10 22,0" fill="none" stroke="#facc15" stroke-width="3"/>
        <path d="M -20,25 Q 0,35 20,25" fill="none" stroke="#facc15" stroke-width="3"/>
      </g>

      <!-- Label Ribbon -->
      <rect x="185" y="315" width="160" height="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="4"/>
      <text x="265" y="337" fill="#38bdf8" font-family="'EB Garamond', serif" font-size="16" font-weight="bold" text-anchor="middle">मेघनाद जन्म लग्न</text>
    </g>
  </g>
</svg>
