<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" id="prop_thought_bubble_chest_vs_back_svg">
  <defs>
    <radialGradient id="chest_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="back_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="medallion_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g id="chest_vs_back_assembly" transform="translate(20, 20)">
    <!-- Theatrical Cloud Border Wrapper -->
    <path d="M 60,230 
             A 65,65 0 0,1 150,110 
             A 85,85 0 0,1 350,110 
             A 65,65 0 0,1 440,230 
             A 75,75 0 0,1 400,350 
             A 80,80 0 0,1 250,380 
             A 75,75 0 0,1 100,350 
             A 60,60 0 0,1 60,230 Z" 
          fill="#0f172a" stroke="#f59e0b" stroke-width="4.5" filter="url(#medallion_shadow)"/>

    <!-- Dual Split Karmic Medallion in Center -->
    <g id="split_medallion" transform="translate(250, 240)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="115" fill="#020617" stroke="#fbbf24" stroke-width="4"/>

      <!-- Left Hemisphere: Front / Chest (वक्षस्थल - Face-Up Gaze) -->
      <path d="M 0,-115 A 115,115 0 0,0 0,115 Z" fill="#0c4a6e" fill-opacity="0.5"/>
      <circle cx="-50" cy="0" r="45" fill="url(#chest_glow)"/>
      <!-- Radiating Gaze Rays -->
      <line x1="-50" y1="-30" x2="-80" y2="-50" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="-50" y1="0" x2="-90" y2="0" stroke="#38bdf8" stroke-width="3"/>
      <line x1="-50" y1="30" x2="-80" y2="50" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Eye Symbol on Chest -->
      <path d="M -75,0 Q -50,-20 -25,0 Q -50,20 -75,0 Z" fill="#0369a1" stroke="#e0f2fe" stroke-width="2"/>
      <circle cx="-50" cy="0" r="8" fill="#fef08a"/>
      <text x="-50" y="55" fill="#7dd3fc" font-family="'EB Garamond', serif" font-size="14" font-weight="bold" text-anchor="middle">वक्षस्थल (मुख)</text>
      <text x="-50" y="72" fill="#e0f2fe" font-family="'EB Garamond', serif" font-size="11" text-anchor="middle">प्रत्यक्ष दृष्टि</text>

      <!-- Center Karmic Dividing Blade -->
      <line x1="0" y1="-115" x2="0" y2="115" stroke="#facc15" stroke-width="3"/>

      <!-- Right Hemisphere: Back / Spine (पृष्ठ - Face-Down Stepped Upon) -->
      <path d="M 0,-115 A 115,115 0 0,1 0,115 Z" fill="#450a0a" fill-opacity="0.5"/>
      <circle cx="50" cy="0" r="45" fill="url(#back_glow)"/>
      <!-- Curved Bowed Spine Symbol -->
      <path d="M 35,-40 Q 65,0 35,40" fill="none" stroke="#f87171" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Vertebrae Markers -->
      <circle cx="37" cy="-30" r="4" fill="#fecaca"/>
      <circle cx="48" cy="-15" r="4" fill="#fecaca"/>
      <circle cx="52" cy="0" r="5" fill="#fef08a"/>
      <circle cx="48" cy="15" r="4" fill="#fecaca"/>
      <circle cx="37" cy="30" r="4" fill="#fecaca"/>
      <!-- Inverted Karmic Gaze Beam (Reaching Downward) -->
      <polygon points="50,15 70,35 60,40" fill="#f87171"/>
      <text x="50" y="55" fill="#fca5a5" font-family="'EB Garamond', serif" font-size="14" font-weight="bold" text-anchor="middle">पृष्ठ भाग (पीठ)</text>
      <text x="50" y="72" fill="#fee2e2" font-family="'EB Garamond', serif" font-size="11" text-anchor="middle">वक्र दृष्टि</text>
    </g>
  </g>
</svg>
