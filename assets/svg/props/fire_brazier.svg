<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%" id="prop_fire_brazier_svg">
  <defs>
    <linearGradient id="bronze_brazier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="fire_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="flame_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="fire_brazier_assembly" transform="translate(50, 40)">
    <!-- Ambient Flame Glow Behind -->
    <ellipse cx="150" cy="180" rx="140" ry="160" fill="url(#fire_glow)"/>

    <!-- Animated Dynamic Flames (Layered Tongues) -->
    <g id="brazier_flames" filter="url(#flame_blur)">
      <!-- Outer Crimson Flame Layer -->
      <path id="flame_outer" d="M 150,20 Q 90,90 90,190 Q 90,260 150,260 Q 210,260 210,190 Q 210,90 150,20 Z" 
            fill="#dc2626" opacity="0.9"/>
      <!-- Mid Orange Flame Layer -->
      <path id="flame_mid" d="M 150,60 Q 110,120 110,200 Q 110,250 150,250 Q 190,250 190,200 Q 190,120 150,60 Z" 
            fill="#f97316" opacity="0.95"/>
      <!-- Core Yellow/White Flame Layer -->
      <path id="flame_core" d="M 150,110 Q 130,160 130,220 Q 130,245 150,245 Q 170,245 170,220 Q 170,160 150,110 Z" 
            fill="#fef08a"/>
      <!-- Floating Sacred Embers / Sparks -->
      <circle cx="130" cy="40" r="4" fill="#fef08a"/>
      <circle cx="170" cy="25" r="3" fill="#f59e0b"/>
      <circle cx="105" cy="80" r="3.5" fill="#fef08a"/>
      <circle cx="195" cy="70" r="3" fill="#f97316"/>
    </g>

    <!-- Bronze Brazier Bowl (Havan Kund) -->
    <g id="brazier_bowl">
      <!-- Charcoal & Incense Bed -->
      <ellipse cx="150" cy="240" rx="100" ry="24" fill="#18181b" stroke="#ea580c" stroke-width="2"/>
      <!-- Glowing Coals -->
      <circle cx="120" cy="240" r="8" fill="#ef4444"/>
      <circle cx="150" cy="242" r="10" fill="#f97316"/>
      <circle cx="180" cy="239" r="7" fill="#ef4444"/>

      <!-- Ornate Hammered Bowl Body -->
      <path d="M 40,240 Q 50,330 150,340 Q 250,330 260,240 Z" fill="url(#bronze_brazier)" stroke="#f59e0b" stroke-width="4"/>
      <!-- Decorative Lotus Rim -->
      <ellipse cx="150" cy="240" rx="110" ry="18" fill="none" stroke="#fef08a" stroke-width="3.5"/>
      <!-- Temple Bosses & Rings -->
      <circle cx="150" cy="285" r="14" fill="#78350f" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="95" cy="275" r="10" fill="#78350f" stroke="#fef08a" stroke-width="2"/>
      <circle cx="205" cy="275" r="10" fill="#78350f" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- Tripod Stand (Elephant-foot style legs) -->
    <g id="brazier_stand">
      <!-- Center Stem -->
      <rect x="138" y="340" width="24" height="70" fill="url(#bronze_brazier)" stroke="#78350f" stroke-width="2"/>
      <!-- Center Base Hub -->
      <ellipse cx="150" cy="410" rx="40" ry="14" fill="#78350f" stroke="#fef08a" stroke-width="2.5"/>
      <!-- Left Splayed Leg -->
      <path d="M 130,410 Q 70,440 50,510 L 80,510 Q 95,450 140,418 Z" fill="url(#bronze_brazier)" stroke="#f59e0b" stroke-width="3"/>
      <!-- Right Splayed Leg -->
      <path d="M 170,410 Q 230,440 250,510 L 220,510 Q 205,450 160,418 Z" fill="url(#bronze_brazier)" stroke="#f59e0b" stroke-width="3"/>
      <!-- Center Back Leg -->
      <path d="M 145,418 L 140,490 L 160,490 L 155,418 Z" fill="#451a03" stroke="#92400e" stroke-width="2"/>
    </g>
  </g>
</svg>
