<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" id="prop_subjugation_boot_svg">
  <defs>
    <linearGradient id="boot_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="boot_iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="crush_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="boot_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g id="subjugation_boot_assembly" filter="url(#boot_shadow)">
    <!-- Crushing Ground Shockwave Rings at the Base -->
    <g id="crush_shockwaves" transform="translate(250, 420)">
      <ellipse cx="0" cy="0" rx="180" ry="30" fill="url(#crush_glow)"/>
      <ellipse cx="0" cy="0" rx="140" ry="20" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
      <ellipse cx="0" cy="0" rx="90" ry="14" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
    </g>

    <!-- Leg Greave Armor (Calf & Shin) -->
    <g id="boot_leg_armor">
      <path d="M 180,40 L 290,40 L 280,240 L 190,240 Z" fill="url(#boot_iron)" stroke="url(#boot_gold)" stroke-width="4"/>
      <!-- Embossed Golden Plates and Rivets -->
      <line x1="200" y1="80" x2="270" y2="80" stroke="#fbbf24" stroke-width="3"/>
      <line x1="195" y1="130" x2="275" y2="130" stroke="#fbbf24" stroke-width="3"/>
      <line x1="192" y1="180" x2="278" y2="180" stroke="#fbbf24" stroke-width="3"/>
      <!-- Brass Rivets -->
      <circle cx="200" cy="80" r="4" fill="#fef08a"/>
      <circle cx="270" cy="80" r="4" fill="#fef08a"/>
      <circle cx="195" cy="130" r="4" fill="#fef08a"/>
      <circle cx="275" cy="130" r="4" fill="#fef08a"/>
      <circle cx="192" cy="180" r="4" fill="#fef08a"/>
      <circle cx="278" cy="180" r="4" fill="#fef08a"/>
    </g>

    <!-- Royal Ankle Guard with Demon/Lion Crest -->
    <g id="boot_ankle_crest">
      <path d="M 170,230 Q 235,260 300,230 L 290,290 Q 235,320 180,290 Z" fill="url(#boot_gold)" stroke="#78350f" stroke-width="3"/>
      <circle cx="235" cy="275" r="16" fill="#7f1d1d" stroke="#fef08a" stroke-width="2.5"/>
      <polygon points="235,265 242,280 228,280" fill="#fef08a"/>
    </g>

    <!-- Foot & Upturned Royal Toe (Mojari style with Spiked Sole) -->
    <g id="boot_foot_sole">
      <!-- Main Foot Shape -->
      <path d="M 180,290 L 290,290 L 330,340 Q 380,360 410,350 Q 430,340 435,310 Q 440,360 390,390 L 150,390 L 150,330 Z" 
            fill="url(#boot_iron)" stroke="url(#boot_gold)" stroke-width="4.5"/>
      <!-- Heavy Iron Sole & Cleats -->
      <path d="M 140,390 L 400,390 L 390,415 L 145,415 Z" fill="#020617" stroke="#94a3b8" stroke-width="3"/>
      <!-- Crushing Cleats on Bottom Sole -->
      <rect x="160" y="415" width="25" height="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="210" y="415" width="25" height="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="260" y="415" width="25" height="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="310" y="415" width="25" height="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="360" y="415" width="20" height="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Spiked Heavy Iron Heel -->
      <rect x="145" y="390" width="45" height="35" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    </g>
  </g>
</svg>
