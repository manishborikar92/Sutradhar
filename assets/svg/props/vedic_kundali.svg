<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" id="prop_vedic_kundali_svg">
  <defs>
    <radialGradient id="kundali_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="gold_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="kundali_assembly" transform="translate(0, 0)">
    <!-- Base Outer Diamond Frame -->
    <rect x="50" y="50" width="500" height="500" fill="url(#kundali_bg)" stroke="url(#gold_border)" stroke-width="6" rx="8" />

    <!-- 4 Shatter Quadrants with Jagged Seam Paths for GSAP fracture animation -->
    <!-- Quadrant 1: Top (House 1 Tanu & House 12 Vyaya) -->
    <g id="kundali_quad_top" class="kundali-fragment">
      <polygon points="50,50 550,50 300,300" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#gold_border)" stroke-width="3" />
      <polygon points="175,175 425,175 300,300" fill="#312e81" fill-opacity="0.5" stroke="#fbbf24" stroke-width="2" />
      <!-- Central Top Diamond (House 1) -->
      <polygon points="300,50 425,175 300,300 175,175" fill="#4338ca" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2.5" />
      <text x="300" y="140" fill="#fef08a" font-family="'EB Garamond', serif" font-size="22" font-weight="bold" text-anchor="middle">१ (लग्न)</text>
      <text x="180" y="100" fill="#93c5fd" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">१२ (व्यय)</text>
      <!-- House 12 Shani Aspect Marker -->
      <circle cx="210" cy="130" r="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" filter="url(#gold_glow)"/>
      <text x="210" y="136" fill="#ffffff" font-family="'EB Garamond', serif" font-size="13" font-weight="bold" text-anchor="middle">शनि</text>
    </g>

    <!-- Quadrant 2: Right (House 11 Ekadash & House 10 Karma) -->
    <g id="kundali_quad_right" class="kundali-fragment">
      <polygon points="550,50 550,550 300,300" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#gold_border)" stroke-width="3" />
      <!-- House 11 Ravana Immortality Seal -->
      <polygon points="425,175 550,300 425,425 300,300" fill="#b45309" fill-opacity="0.4" stroke="#fbbf24" stroke-width="2.5" />
      <text x="440" y="270" fill="#fef08a" font-family="'EB Garamond', serif" font-size="20" font-weight="bold" text-anchor="middle">११ (लाभ)</text>
      <!-- Immortality Infinity Symbol Node -->
      <g id="infinity_glyph" transform="translate(460, 310)">
        <path d="M -15,0 C -15,-8 -5,-8 0,0 C 5,8 15,8 15,0 C 15,-8 5,-8 0,0 C -5,8 -15,8 -15,0 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#gold_glow)"/>
        <text x="0" y="24" fill="#38bdf8" font-family="'EB Garamond', serif" font-size="12" font-weight="bold" text-anchor="middle">अमरता</text>
      </g>
      <text x="470" y="420" fill="#cbd5e1" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">१० (कर्म)</text>
    </g>

    <!-- Quadrant 3: Bottom (Houses 6, 7, 8) -->
    <g id="kundali_quad_bottom" class="kundali-fragment">
      <polygon points="550,550 50,550 300,300" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#gold_border)" stroke-width="3" />
      <polygon points="300,300 425,425 300,550 175,425" fill="#3730a3" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2" />
      <text x="300" y="470" fill="#fef08a" font-family="'EB Garamond', serif" font-size="20" text-anchor="middle">७ (कलत्र)</text>
      <text x="400" y="510" fill="#cbd5e1" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">८ (आयु)</text>
      <text x="200" y="510" fill="#cbd5e1" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">६ (रिपु)</text>
    </g>

    <!-- Quadrant 4: Left (Houses 2, 3, 4, 5) -->
    <g id="kundali_quad_left" class="kundali-fragment">
      <polygon points="50,550 50,50 300,300" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#gold_border)" stroke-width="3" />
      <polygon points="175,175 300,300 175,425 50,300" fill="#1e293b" fill-opacity="0.4" stroke="#fbbf24" stroke-width="2" />
      <text x="140" y="290" fill="#fef08a" font-family="'EB Garamond', serif" font-size="20" text-anchor="middle">४ (सुख)</text>
      <text x="110" y="190" fill="#cbd5e1" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">२ (धन)</text>
      <text x="110" y="410" fill="#cbd5e1" font-family="'EB Garamond', serif" font-size="16" text-anchor="middle">५ (पुत्र)</text>
    </g>

    <!-- Center Navagraha Bindu & Shatter Seams -->
    <g id="kundali_center_bindu">
      <circle cx="300" cy="300" r="24" fill="#0f172a" stroke="url(#gold_border)" stroke-width="3" filter="url(#gold_glow)"/>
      <circle cx="300" cy="300" r="8" fill="#fbbf24"/>
      <!-- Decorative Navagraha Orbs around Center -->
      <circle cx="280" cy="275" r="5" fill="#f87171"/><!-- Mangal -->
      <circle cx="320" cy="275" r="5" fill="#34d399"/><!-- Budh -->
      <circle cx="330" cy="300" r="6" fill="#fbbf24"/><!-- Guru -->
      <circle cx="320" cy="325" r="5" fill="#f1f5f9"/><!-- Shukra -->
      <circle cx="280" cy="325" r="6" fill="#60a5fa"/><!-- Shani -->
      <circle cx="270" cy="300" r="5" fill="#94a3b8"/><!-- Rahu/Ketu -->
    </g>
  </g>
</svg>
