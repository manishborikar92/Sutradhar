<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" id="prop_cosmic_eye_beams_svg">
  <defs>
    <radialGradient id="ravana_eye_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="shani_eye_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="beam_energy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="beam_blur" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="cosmic_eyes_and_beams_assembly">
    <!-- Top: Ravana's Cosmic Wrathful Eye (Red & Gold) -->
    <g id="top_eye_ravana" transform="translate(300, 140)">
      <!-- Flaming Aura -->
      <circle cx="0" cy="0" r="90" fill="url(#ravana_eye_glow)" opacity="0.4" filter="url(#beam_blur)"/>
      <!-- Sclera -->
      <path d="M -110,0 Q 0,-60 110,0 Q 0,60 -110,0 Z" fill="#7f1d1d" stroke="#f59e0b" stroke-width="4"/>
      <!-- Iris & Pupil -->
      <circle cx="0" cy="0" r="42" fill="#dc2626" stroke="#fef08a" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#18181b"/>
      <!-- Slit pupil highlight -->
      <ellipse cx="-4" cy="-4" rx="5" ry="8" fill="#ffffff" transform="rotate(-20)"/>
      <text x="0" y="85" fill="#fca5a5" font-family="'EB Garamond', serif" font-size="16" font-weight="bold" text-anchor="middle">दशग्रीव क्रोध दृष्टि</text>
    </g>

    <!-- Center: Divine High-Energy Connecting Gaze Beam -->
    <g id="gaze_beam_energy" filter="url(#beam_blur)">
      <!-- Outer Pulsing Energy Column -->
      <polygon points="260,160 340,160 360,640 240,640" fill="url(#beam_energy)" opacity="0.45"/>
      <!-- Core Focused Lightning Laser -->
      <polygon points="285,160 315,160 325,640 275,640" fill="#ffffff" opacity="0.85"/>
      <!-- Central Collision / Clashing Spark Rings -->
      <g id="clash_midpoint" transform="translate(300, 400)">
        <circle cx="0" cy="0" r="40" fill="#fef08a" opacity="0.9"/>
        <circle cx="0" cy="0" r="25" fill="#ffffff"/>
        <!-- Starburst Clashing Rays -->
        <line x1="-60" y1="0" x2="60" y2="0" stroke="#f59e0b" stroke-width="4"/>
        <line x1="0" y1="-60" x2="0" y2="60" stroke="#38bdf8" stroke-width="4"/>
        <line x1="-45" y1="-45" x2="45" y2="45" stroke="#ffffff" stroke-width="3"/>
        <line x1="45" y1="-45" x2="-45" y2="45" stroke="#ffffff" stroke-width="3"/>
      </g>
    </g>

    <!-- Bottom: Shani Dev's Karmic Third Eye (Indigo & Azure) -->
    <g id="bottom_eye_shani" transform="translate(300, 660)">
      <!-- Cosmic Azure Aura -->
      <circle cx="0" cy="0" r="90" fill="url(#shani_eye_glow)" opacity="0.5" filter="url(#beam_blur)"/>
      <!-- Sclera -->
      <path d="M -110,0 Q 0,-60 110,0 Q 0,60 -110,0 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="4"/>
      <!-- Piercing Karmic Iris & Pupil -->
      <circle cx="0" cy="0" r="42" fill="#0284c7" stroke="#e0f2fe" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#020617"/>
      <!-- Star-shaped Third Eye Pupil Reflection -->
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fef08a"/>
      <text x="0" y="85" fill="#7dd3fc" font-family="'EB Garamond', serif" font-size="16" font-weight="bold" text-anchor="middle">शनि देव वक्र दृष्टि (कर्म विधान)</text>
    </g>
  </g>
</svg>
