# Sutradhar English Pronunciation Overrides for Kokoro-82M
# Format:
#   text_replacements: Whole-word pre-synthesis respellings for narration_text
#   ipa_replacements: Regex substitutions directly on Kokoro phoneme stream

text_replacements:
  Sutradhar: "Sootradhar"
  Sanatan: "Sanaatun"
  Dharma: "Dharmah"
  Purana: "Puraana"
  Puranas: "Puraanas"
  Puranic: "Puraanic"
  Upanishad: "Oopanishad"
  Upanishads: "Oopanishads"
  Veda: "Vayda"
  Vedas: "Vaydas"
  Katha: "Kaatha"
  Yuga: "Yooga"
  Kalpa: "Kulpah"
  Mahabharata: "Mahaabhaarata"
  Ramayana: "Raamaayana"
  Ravana: "Raavana"
  Shani: "Shahnee"
  Narad: "Naarud"
  Muni: "Moonee"
  Shiva: "Sheeva"
  Vishnu: "Vishnoo"
  Brahma: "Brahmah"
  Kailash: "Kylaash"
  Kurukshetra: "Koorookshetra"
  Ashwatthama: "Ashwathaama"
  Lanka: "Laahnka"
  Mahadev: "Mahadev"
  Pataliputra: "Patalipootra"
  Nalanda: "Naalanda"
  Chanakya: "Chaanaakya"
  Maurya: "Mowrya"
  Chola: "Chola"
  Vijayanagara: "Vijayanagara"
  Mohenjo-daro: "Mohenjo daaro"

ipa_replacements:
  - pattern: "\\bmˈaʊnt kˈaɪlæʃ\\b"
    replacement: "mˈaʊnt kaɪlˈɑːʃ"
  - pattern: "\\bkˈɪŋ ɹævˈɑːn[ɚə]\\b"
    replacement: "kˈɪŋ ɹˈɑːvənə"
  - pattern: "\\blˈæŋkəz\\b"
    replacement: "lˈɑːŋkəz"
  - pattern: "\\blˈæŋkə\\b"
    replacement: "lˈɑːŋkə"
  - pattern: "\\bɹævˈɑːn[ɚə]\\b"
    replacement: "ɹˈɑːvənə"
  - pattern: "\\bkˈaɪlæʃ\\b"
    replacement: "kaɪlˈɑːʃ"
  - pattern: "\\bmˈæheɪdəvz\\b"
    replacement: "mˈɑːhəˌdeɪvz"
  - pattern: "\\bmˈæheɪdəv\\b"
    replacement: "mˈɑːhɑːdˈeɪv"
  - pattern: "\\bsˈʌtɹɐdhˌɑːɹ\\b"
    replacement: "sˈuːtɹədʱɑːɹ"
  - pattern: "\\bʃˈiːvə\\b"
    replacement: "ʃˈɪvə"
  - pattern: "\\bnælˈændə\\b"
    replacement: "nˈɑːləndə"
  - pattern: "\\bkjˈʊɹɹəkʃˌɛtɹə\\b"
    replacement: "kˈʊɹʊkʃˌeɪtɹə"
