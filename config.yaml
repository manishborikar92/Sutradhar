project:
  name: Sutradhar
  version: 0.4.0
  docs_dir: docs
channel:
  language_mode: per_channel
  audio_language: hi
  caption_language: hi
  metadata_language: en
  thumbnail_language: en
  primary_language: hi
  default_audio_language: hi
  default_language: en
  category_id: '27'
  self_declared_made_for_kids: false
  contains_synthetic_media: true
  pillars:
  - Ancient Epics & Lore
  - Hidden History
  - Cosmic & Scientific Paradoxes
languages:
  hi:
    code: hi
    name: Hindi
    voice_provisional: false
    narrator_voice: Viraj
    narrator_voice_id: uuyFQegRan8rpIQCGu9K
    pronunciations_file: pronunciations_hi.yaml
series:
  completed_history_window: 20
  require_bespoke_asset_per_episode: true
content_format: episodic_series
episode_pacing:
  target_duration_min_sec: 40
  target_duration_max_sec: 120
  hard_duration_min_sec: 30
  hard_duration_max_sec: 180
  min_scenes: 5
  max_scenes: 15
  min_words_per_scene: 8
  max_words_per_scene: 35
contextual_text:
  title_cards: false
  infographics: true
  character_labels: false
  cta_cards: false
tts:
  engine: elevenlabs
  model_id: eleven_v4
  voice_id: uuyFQegRan8rpIQCGu9K
  sample_rate: 44100
  output_format: mp3_44100_128
  cache_dir: build/cache/audio
  voice_settings:
    stability: 0.55
    similarity_boost: 0.80
    style: 0.10
    use_speaker_boost: true
  tag_templates:
    narrator: "[slowly, solemn, deep]"
    divine: "[calm, serene, deep, slowly]"
    antagonist: "[arrogant, booming, furious, shouts]"
    grief: "[softly, sorrowful, trembling, sighs]"
    devotional: "[calm, gentle, devotional]"
    climax: "[building energy, intense]"
    outro: "[gentle, calm, peaceful]"
video:
  width: 1080
  height: 1920
  fps: 30
  render_quality: high
  max_file_bytes: 57671680
  safe_zones:
    top_clear_px: 288
    bottom_clear_px: 520
    right_clear_px: 192
    left_clear_px: 48
audio_mastering:
  target_lufs: -14.0
  true_peak_max_dbtp: -1.5
  trailing_silence_min_sec: 0.7
  silence_floor_max_dbfs: -65.0
  sample_rate_hz: 48000
  channels: 2
  bgm_base_gain_db: -22.0
  sfx_gain_db: -10.0
  sidechain_ducking:
    enabled: true
    threshold: 0.03
    ratio: 6.5
    attack_ms: 20
    release_ms: 500
  kinocut_min_score: 80
  kinocut_dark_min_score: 88
  kinocut_default_min_score: 55
assets:
  bgm_tracks:
  - dramatic_mythology.mp3
  - epic_history.mp3
  - cosmic_mystery.mp3
  - wrath_confrontation.mp3
  - sorrow_tragedy.mp3
  - serene_blessing.mp3
  bgm_by_mood:
    dramatic: dramatic_mythology.mp3
    epic: epic_history.mp3
    mystic: cosmic_mystery.mp3
    cosmic: cosmic_mystery.mp3
    wrath: wrath_confrontation.mp3
    sorrow: sorrow_tragedy.mp3
    serene: serene_blessing.mp3
  bgm_by_pillar:
    Ancient Epics & Lore: dramatic_mythology.mp3
    Hidden History: epic_history.mp3
    Cosmic & Scientific Paradoxes: cosmic_mystery.mp3
  sfx_tracks:
  - whoosh_soft.wav
  - sub_hit.wav
  - tension_swell.wav
  - laser_strike.wav
  - crystal_shatter.wav
  - thunder_rumble.wav
  - conch_blast.wav
  - sword_clash.wav
  - magma_crack.wav
  - cosmic_chime.wav
  - curtain_whoosh.wav
  - footstep_heavy.wav
  - energy_hum.wav
  mood_palettes:
  - theatrical_folk_art
  - golden_imperial
  - cosmic_indigo
  - crimson_wrath
  - kailash_himalayan
  - mystic_slate
  - obsidian_amber
  particle_themes:
  - golden_embers
  - starfield_warp
  - quantum_nodes
  - himalayan_snow
  - crimson_embers
  - mystic_mist
publishing:
  env_file: .env.local
  upload_mode: public
  allow_public_or_scheduled: true
  calibration_episodes_required: 0
  require_custom_thumbnail: true
  scheduled_publish_time_ist: '18:30'
  scheduled_publish_time_utc: '13:00'
  auto_create_series_playlist: true
paths:
  db_file: episodes.db
  build_dir: build
  assets_dir: assets
  docs_dir: docs
  auditions_dir: build/auditions
